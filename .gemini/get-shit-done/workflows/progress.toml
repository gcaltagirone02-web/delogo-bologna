prompt = "<purpose>\r\nCheck project progress, summarize recent work and what's ahead, then intelligently route to the next action — either executing an existing plan or creating the next one. Provides situational awareness before continuing work.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"init_context\">\r\n**Load progress context (paths only):**\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init progress)\r\n```\r\n\r\nExtract from init JSON: `project_exists`, `roadmap_exists`, `state_exists`, `phases`, `current_phase`, `next_phase`, `milestone_version`, `completed_count`, `phase_count`, `paused_at`, `state_path`, `roadmap_path`, `project_path`, `config_path`.\r\n\r\nIf `project_exists` is false (no `.planning/` directory):\r\n\r\n```\r\nNo planning structure found.\r\n\r\nRun /gsd:new-project to start a new project.\r\n```\r\n\r\nExit.\r\n\r\nIf missing STATE.md: suggest `/gsd:new-project`.\r\n\r\n**If ROADMAP.md missing but PROJECT.md exists:**\r\n\r\nThis means a milestone was completed and archived. Go to **Route F** (between milestones).\r\n\r\nIf missing both ROADMAP.md and PROJECT.md: suggest `/gsd:new-project`.\r\n</step>\r\n\r\n<step name=\"load\">\r\n**Use structured extraction from gsd-tools:**\r\n\r\nInstead of reading full files, use targeted tools to get only the data needed for the report:\r\n- `ROADMAP=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap analyze)`\r\n- `STATE=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs state-snapshot)`\r\n\r\nThis minimizes orchestrator context usage.\r\n</step>\r\n\r\n<step name=\"analyze_roadmap\">\r\n**Get comprehensive roadmap analysis (replaces manual parsing):**\r\n\r\n```bash\r\nROADMAP=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap analyze)\r\n```\r\n\r\nThis returns structured JSON with:\r\n- All phases with disk status (complete/partial/planned/empty/no_directory)\r\n- Goal and dependencies per phase\r\n- Plan and summary counts per phase\r\n- Aggregated stats: total plans, summaries, progress percent\r\n- Current and next phase identification\r\n\r\nUse this instead of manually reading/parsing ROADMAP.md.\r\n</step>\r\n\r\n<step name=\"recent\">\r\n**Gather recent work context:**\r\n\r\n- Find the 2-3 most recent SUMMARY.md files\r\n- Use `summary-extract` for efficient parsing:\r\n  ```bash\r\n  node ./.gemini/get-shit-done/bin/gsd-tools.cjs summary-extract <path> --fields one_liner\r\n  ```\r\n- This shows \"what we've been working on\"\r\n  </step>\r\n\r\n<step name=\"position\">\r\n**Parse current position from init context and roadmap analysis:**\r\n\r\n- Use `current_phase` and `next_phase` from `$ROADMAP`\r\n- Note `paused_at` if work was paused (from `$STATE`)\r\n- Count pending todos: use `init todos` or `list-todos`\r\n- Check for active debug sessions: `ls .planning/debug/*.md 2>/dev/null | grep -v resolved | wc -l`\r\n  </step>\r\n\r\n<step name=\"report\">\r\n**Generate progress bar from gsd-tools, then present rich status report:**\r\n\r\n```bash\r\n# Get formatted progress bar\r\nPROGRESS_BAR=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs progress bar --raw)\r\n```\r\n\r\nPresent:\r\n\r\n```\r\n# [Project Name]\r\n\r\n**Progress:** {PROGRESS_BAR}\r\n**Profile:** [quality/balanced/budget]\r\n\r\n## Recent Work\r\n- [Phase X, Plan Y]: [what was accomplished - 1 line from summary-extract]\r\n- [Phase X, Plan Z]: [what was accomplished - 1 line from summary-extract]\r\n\r\n## Current Position\r\nPhase [N] of [total]: [phase-name]\r\nPlan [M] of [phase-total]: [status]\r\nCONTEXT: [✓ if has_context | - if not]\r\n\r\n## Key Decisions Made\r\n- [extract from $STATE.decisions[]]\r\n- [e.g. jq -r '.decisions[].decision' from state-snapshot]\r\n\r\n## Blockers/Concerns\r\n- [extract from $STATE.blockers[]]\r\n- [e.g. jq -r '.blockers[].text' from state-snapshot]\r\n\r\n## Pending Todos\r\n- [count] pending — /gsd:check-todos to review\r\n\r\n## Active Debug Sessions\r\n- [count] active — /gsd:debug to continue\r\n(Only show this section if count > 0)\r\n\r\n## What's Next\r\n[Next phase/plan objective from roadmap analyze]\r\n```\r\n\r\n</step>\r\n\r\n<step name=\"route\">\r\n**Determine next action based on verified counts.**\r\n\r\n**Step 1: Count plans, summaries, and issues in current phase**\r\n\r\nList files in the current phase directory:\r\n\r\n```bash\r\nls -1 .planning/phases/[current-phase-dir]/*-PLAN.md 2>/dev/null | wc -l\r\nls -1 .planning/phases/[current-phase-dir]/*-SUMMARY.md 2>/dev/null | wc -l\r\nls -1 .planning/phases/[current-phase-dir]/*-UAT.md 2>/dev/null | wc -l\r\n```\r\n\r\nState: \"This phase has {X} plans, {Y} summaries.\"\r\n\r\n**Step 1.5: Check for unaddressed UAT gaps**\r\n\r\nCheck for UAT.md files with status \"diagnosed\" (has gaps needing fixes).\r\n\r\n```bash\r\n# Check for diagnosed UAT with gaps\r\ngrep -l \"status: diagnosed\" .planning/phases/[current-phase-dir]/*-UAT.md 2>/dev/null\r\n```\r\n\r\nTrack:\r\n- `uat_with_gaps`: UAT.md files with status \"diagnosed\" (gaps need fixing)\r\n\r\n**Step 2: Route based on counts**\r\n\r\n| Condition | Meaning | Action |\r\n|-----------|---------|--------|\r\n| uat_with_gaps > 0 | UAT gaps need fix plans | Go to **Route E** |\r\n| summaries < plans | Unexecuted plans exist | Go to **Route A** |\r\n| summaries = plans AND plans > 0 | Phase complete | Go to Step 3 |\r\n| plans = 0 | Phase not yet planned | Go to **Route B** |\r\n\r\n---\r\n\r\n**Route A: Unexecuted plan exists**\r\n\r\nFind the first PLAN.md without matching SUMMARY.md.\r\nRead its `<objective>` section.\r\n\r\n```\r\n---\r\n\r\n## ▶ Next Up\r\n\r\n**{phase}-{plan}: [Plan Name]** — [objective summary from PLAN.md]\r\n\r\n`/gsd:execute-phase {phase}`\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n```\r\n\r\n---\r\n\r\n**Route B: Phase needs planning**\r\n\r\nCheck if `{phase_num}-CONTEXT.md` exists in phase directory.\r\n\r\n**If CONTEXT.md exists:**\r\n\r\n```\r\n---\r\n\r\n## ▶ Next Up\r\n\r\n**Phase {N}: {Name}** — {Goal from ROADMAP.md}\r\n*(✓ Context gathered, ready to plan)*\r\n\r\n`/gsd:plan-phase {phase-number}`\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n```\r\n\r\n**If CONTEXT.md does NOT exist:**\r\n\r\n```\r\n---\r\n\r\n## ▶ Next Up\r\n\r\n**Phase {N}: {Name}** — {Goal from ROADMAP.md}\r\n\r\n`/gsd:discuss-phase {phase}` — gather context and clarify approach\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n\r\n**Also available:**\r\n- `/gsd:plan-phase {phase}` — skip discussion, plan directly\r\n- `/gsd:list-phase-assumptions {phase}` — see Claude's assumptions\r\n\r\n---\r\n```\r\n\r\n---\r\n\r\n**Route E: UAT gaps need fix plans**\r\n\r\nUAT.md exists with gaps (diagnosed issues). User needs to plan fixes.\r\n\r\n```\r\n---\r\n\r\n## ⚠ UAT Gaps Found\r\n\r\n**{phase_num}-UAT.md** has {N} gaps requiring fixes.\r\n\r\n`/gsd:plan-phase {phase} --gaps`\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n\r\n**Also available:**\r\n- `/gsd:execute-phase {phase}` — execute phase plans\r\n- `/gsd:verify-work {phase}` — run more UAT testing\r\n\r\n---\r\n```\r\n\r\n---\r\n\r\n**Step 3: Check milestone status (only when phase complete)**\r\n\r\nRead ROADMAP.md and identify:\r\n1. Current phase number\r\n2. All phase numbers in the current milestone section\r\n\r\nCount total phases and identify the highest phase number.\r\n\r\nState: \"Current phase is {X}. Milestone has {N} phases (highest: {Y}).\"\r\n\r\n**Route based on milestone status:**\r\n\r\n| Condition | Meaning | Action |\r\n|-----------|---------|--------|\r\n| current phase < highest phase | More phases remain | Go to **Route C** |\r\n| current phase = highest phase | Milestone complete | Go to **Route D** |\r\n\r\n---\r\n\r\n**Route C: Phase complete, more phases remain**\r\n\r\nRead ROADMAP.md to get the next phase's name and goal.\r\n\r\n```\r\n---\r\n\r\n## ✓ Phase {Z} Complete\r\n\r\n## ▶ Next Up\r\n\r\n**Phase {Z+1}: {Name}** — {Goal from ROADMAP.md}\r\n\r\n`/gsd:discuss-phase {Z+1}` — gather context and clarify approach\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n\r\n**Also available:**\r\n- `/gsd:plan-phase {Z+1}` — skip discussion, plan directly\r\n- `/gsd:verify-work {Z}` — user acceptance test before continuing\r\n\r\n---\r\n```\r\n\r\n---\r\n\r\n**Route D: Milestone complete**\r\n\r\n```\r\n---\r\n\r\n## 🎉 Milestone Complete\r\n\r\nAll {N} phases finished!\r\n\r\n## ▶ Next Up\r\n\r\n**Complete Milestone** — archive and prepare for next\r\n\r\n`/gsd:complete-milestone`\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n\r\n**Also available:**\r\n- `/gsd:verify-work` — user acceptance test before completing milestone\r\n\r\n---\r\n```\r\n\r\n---\r\n\r\n**Route F: Between milestones (ROADMAP.md missing, PROJECT.md exists)**\r\n\r\nA milestone was completed and archived. Ready to start the next milestone cycle.\r\n\r\nRead MILESTONES.md to find the last completed milestone version.\r\n\r\n```\r\n---\r\n\r\n## ✓ Milestone v{X.Y} Complete\r\n\r\nReady to plan the next milestone.\r\n\r\n## ▶ Next Up\r\n\r\n**Start Next Milestone** — questioning → research → requirements → roadmap\r\n\r\n`/gsd:new-milestone`\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\n---\r\n```\r\n\r\n</step>\r\n\r\n<step name=\"edge_cases\">\r\n**Handle edge cases:**\r\n\r\n- Phase complete but next phase not planned → offer `/gsd:plan-phase [next]`\r\n- All work complete → offer milestone completion\r\n- Blockers present → highlight before offering to continue\r\n- Handoff file exists → mention it, offer `/gsd:resume-work`\r\n  </step>\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n\r\n- [ ] Rich context provided (recent work, decisions, issues)\r\n- [ ] Current position clear with visual progress\r\n- [ ] What's next clearly explained\r\n- [ ] Smart routing: /gsd:execute-phase if plans exist, /gsd:plan-phase if not\r\n- [ ] User confirms before any action\r\n- [ ] Seamless handoff to appropriate gsd command\r\n      </success_criteria>\r\n"
