prompt = "<purpose>\r\nCapture an idea, task, or issue that surfaces during a GSD session as a structured todo for later work. Enables \"thought → capture → continue\" flow without losing context.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"init_context\">\r\nLoad todo context:\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init todos)\r\n```\r\n\r\nExtract from init JSON: `commit_docs`, `date`, `timestamp`, `todo_count`, `todos`, `pending_dir`, `todos_dir_exists`.\r\n\r\nEnsure directories exist:\r\n```bash\r\nmkdir -p .planning/todos/pending .planning/todos/done\r\n```\r\n\r\nNote existing areas from the todos array for consistency in infer_area step.\r\n</step>\r\n\r\n<step name=\"extract_content\">\r\n**With arguments:** Use as the title/focus.\r\n- `/gsd:add-todo Add auth token refresh` → title = \"Add auth token refresh\"\r\n\r\n**Without arguments:** Analyze recent conversation to extract:\r\n- The specific problem, idea, or task discussed\r\n- Relevant file paths mentioned\r\n- Technical details (error messages, line numbers, constraints)\r\n\r\nFormulate:\r\n- `title`: 3-10 word descriptive title (action verb preferred)\r\n- `problem`: What's wrong or why this is needed\r\n- `solution`: Approach hints or \"TBD\" if just an idea\r\n- `files`: Relevant paths with line numbers from conversation\r\n</step>\r\n\r\n<step name=\"infer_area\">\r\nInfer area from file paths:\r\n\r\n| Path pattern | Area |\r\n|--------------|------|\r\n| `src/api/*`, `api/*` | `api` |\r\n| `src/components/*`, `src/ui/*` | `ui` |\r\n| `src/auth/*`, `auth/*` | `auth` |\r\n| `src/db/*`, `database/*` | `database` |\r\n| `tests/*`, `__tests__/*` | `testing` |\r\n| `docs/*` | `docs` |\r\n| `.planning/*` | `planning` |\r\n| `scripts/*`, `bin/*` | `tooling` |\r\n| No files or unclear | `general` |\r\n\r\nUse existing area from step 2 if similar match exists.\r\n</step>\r\n\r\n<step name=\"check_duplicates\">\r\n```bash\r\n# Search for key words from title in existing todos\r\ngrep -l -i \"[key words from title]\" .planning/todos/pending/*.md 2>/dev/null\r\n```\r\n\r\nIf potential duplicate found:\r\n1. Read the existing todo\r\n2. Compare scope\r\n\r\nIf overlapping, use AskUserQuestion:\r\n- header: \"Duplicate?\"\r\n- question: \"Similar todo exists: [title]. What would you like to do?\"\r\n- options:\r\n  - \"Skip\" — keep existing todo\r\n  - \"Replace\" — update existing with new context\r\n  - \"Add anyway\" — create as separate todo\r\n</step>\r\n\r\n<step name=\"create_file\">\r\nUse values from init context: `timestamp` and `date` are already available.\r\n\r\nGenerate slug for the title:\r\n```bash\r\nslug=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs generate-slug \"$title\" --raw)\r\n```\r\n\r\nWrite to `.planning/todos/pending/${date}-${slug}.md`:\r\n\r\n```markdown\r\n---\r\ncreated: [timestamp]\r\ntitle: [title]\r\narea: [area]\r\nfiles:\r\n  - [file:lines]\r\n---\r\n\r\n## Problem\r\n\r\n[problem description - enough context for future Claude to understand weeks later]\r\n\r\n## Solution\r\n\r\n[approach hints or \"TBD\"]\r\n```\r\n</step>\r\n\r\n<step name=\"update_state\">\r\nIf `.planning/STATE.md` exists:\r\n\r\n1. Use `todo_count` from init context (or re-run `init todos` if count changed)\r\n2. Update \"### Pending Todos\" under \"## Accumulated Context\"\r\n</step>\r\n\r\n<step name=\"git_commit\">\r\nCommit the todo and any updated state:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: capture todo - [title]\" --files .planning/todos/pending/[filename] .planning/STATE.md\r\n```\r\n\r\nTool respects `commit_docs` config and gitignore automatically.\r\n\r\nConfirm: \"Committed: docs: capture todo - [title]\"\r\n</step>\r\n\r\n<step name=\"confirm\">\r\n```\r\nTodo saved: .planning/todos/pending/[filename]\r\n\r\n  [title]\r\n  Area: [area]\r\n  Files: [count] referenced\r\n\r\n---\r\n\r\nWould you like to:\r\n\r\n1. Continue with current work\r\n2. Add another todo\r\n3. View all todos (/gsd:check-todos)\r\n```\r\n</step>\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] Directory structure exists\r\n- [ ] Todo file created with valid frontmatter\r\n- [ ] Problem section has enough context for future Claude\r\n- [ ] No duplicates (checked and resolved)\r\n- [ ] Area consistent with existing todos\r\n- [ ] STATE.md updated if exists\r\n- [ ] Todo and state committed to git\r\n</success_criteria>\r\n"
