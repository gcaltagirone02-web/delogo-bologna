prompt = "<purpose>\r\nValidate built features through conversational testing with persistent state. Creates UAT.md that tracks test progress, survives /clear, and feeds gaps into /gsd:plan-phase --gaps.\r\n\r\nUser tests, Claude records. One test at a time. Plain text responses.\r\n</purpose>\r\n\r\n<philosophy>\r\n**Show expected, ask if reality matches.**\r\n\r\nClaude presents what SHOULD happen. User confirms or describes what's different.\r\n- \"yes\" / \"y\" / \"next\" / empty → pass\r\n- Anything else → logged as issue, severity inferred\r\n\r\nNo Pass/Fail buttons. No severity questions. Just: \"Here's what should happen. Does it?\"\r\n</philosophy>\r\n\r\n<template>\r\n@./.gemini/get-shit-done/templates/UAT.md\r\n</template>\r\n\r\n<process>\r\n\r\n<step name=\"initialize\" priority=\"first\">\r\nIf $ARGUMENTS contains a phase number, load context:\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init verify-work \"${PHASE_ARG}\")\r\n```\r\n\r\nParse JSON for: `planner_model`, `checker_model`, `commit_docs`, `phase_found`, `phase_dir`, `phase_number`, `phase_name`, `has_verification`.\r\n</step>\r\n\r\n<step name=\"check_active_session\">\r\n**First: Check for active UAT sessions**\r\n\r\n```bash\r\nfind .planning/phases -name \"*-UAT.md\" -type f 2>/dev/null | head -5\r\n```\r\n\r\n**If active sessions exist AND no $ARGUMENTS provided:**\r\n\r\nRead each file's frontmatter (status, phase) and Current Test section.\r\n\r\nDisplay inline:\r\n\r\n```\r\n## Active UAT Sessions\r\n\r\n| # | Phase | Status | Current Test | Progress |\r\n|---|-------|--------|--------------|----------|\r\n| 1 | 04-comments | testing | 3. Reply to Comment | 2/6 |\r\n| 2 | 05-auth | testing | 1. Login Form | 0/4 |\r\n\r\nReply with a number to resume, or provide a phase number to start new.\r\n```\r\n\r\nWait for user response.\r\n\r\n- If user replies with number (1, 2) → Load that file, go to `resume_from_file`\r\n- If user replies with phase number → Treat as new session, go to `create_uat_file`\r\n\r\n**If active sessions exist AND $ARGUMENTS provided:**\r\n\r\nCheck if session exists for that phase. If yes, offer to resume or restart.\r\nIf no, continue to `create_uat_file`.\r\n\r\n**If no active sessions AND no $ARGUMENTS:**\r\n\r\n```\r\nNo active UAT sessions.\r\n\r\nProvide a phase number to start testing (e.g., /gsd:verify-work 4)\r\n```\r\n\r\n**If no active sessions AND $ARGUMENTS provided:**\r\n\r\nContinue to `create_uat_file`.\r\n</step>\r\n\r\n<step name=\"find_summaries\">\r\n**Find what to test:**\r\n\r\nUse `phase_dir` from init (or run init if not already done).\r\n\r\n```bash\r\nls \"$phase_dir\"/*-SUMMARY.md 2>/dev/null\r\n```\r\n\r\nRead each SUMMARY.md to extract testable deliverables.\r\n</step>\r\n\r\n<step name=\"extract_tests\">\r\n**Extract testable deliverables from SUMMARY.md:**\r\n\r\nParse for:\r\n1. **Accomplishments** - Features/functionality added\r\n2. **User-facing changes** - UI, workflows, interactions\r\n\r\nFocus on USER-OBSERVABLE outcomes, not implementation details.\r\n\r\nFor each deliverable, create a test:\r\n- name: Brief test name\r\n- expected: What the user should see/experience (specific, observable)\r\n\r\nExamples:\r\n- Accomplishment: \"Added comment threading with infinite nesting\"\r\n  → Test: \"Reply to a Comment\"\r\n  → Expected: \"Clicking Reply opens inline composer below comment. Submitting shows reply nested under parent with visual indentation.\"\r\n\r\nSkip internal/non-observable items (refactors, type changes, etc.).\r\n</step>\r\n\r\n<step name=\"create_uat_file\">\r\n**Create UAT file with all tests:**\r\n\r\n```bash\r\nmkdir -p \"$PHASE_DIR\"\r\n```\r\n\r\nBuild test list from extracted deliverables.\r\n\r\nCreate file:\r\n\r\n```markdown\r\n---\r\nstatus: testing\r\nphase: XX-name\r\nsource: [list of SUMMARY.md files]\r\nstarted: [ISO timestamp]\r\nupdated: [ISO timestamp]\r\n---\r\n\r\n## Current Test\r\n<!-- OVERWRITE each test - shows where we are -->\r\n\r\nnumber: 1\r\nname: [first test name]\r\nexpected: |\r\n  [what user should observe]\r\nawaiting: user response\r\n\r\n## Tests\r\n\r\n### 1. [Test Name]\r\nexpected: [observable behavior]\r\nresult: [pending]\r\n\r\n### 2. [Test Name]\r\nexpected: [observable behavior]\r\nresult: [pending]\r\n\r\n...\r\n\r\n## Summary\r\n\r\ntotal: [N]\r\npassed: 0\r\nissues: 0\r\npending: [N]\r\nskipped: 0\r\n\r\n## Gaps\r\n\r\n[none yet]\r\n```\r\n\r\nWrite to `.planning/phases/XX-name/{phase_num}-UAT.md`\r\n\r\nProceed to `present_test`.\r\n</step>\r\n\r\n<step name=\"present_test\">\r\n**Present current test to user:**\r\n\r\nRead Current Test section from UAT file.\r\n\r\nDisplay using checkpoint box format:\r\n\r\n```\r\n╔══════════════════════════════════════════════════════════════╗\r\n║  CHECKPOINT: Verification Required                           ║\r\n╚══════════════════════════════════════════════════════════════╝\r\n\r\n**Test {number}: {name}**\r\n\r\n{expected}\r\n\r\n──────────────────────────────────────────────────────────────\r\n→ Type \"pass\" or describe what's wrong\r\n──────────────────────────────────────────────────────────────\r\n```\r\n\r\nWait for user response (plain text, no AskUserQuestion).\r\n</step>\r\n\r\n<step name=\"process_response\">\r\n**Process user response and update file:**\r\n\r\n**If response indicates pass:**\r\n- Empty response, \"yes\", \"y\", \"ok\", \"pass\", \"next\", \"approved\", \"✓\"\r\n\r\nUpdate Tests section:\r\n```\r\n### {N}. {name}\r\nexpected: {expected}\r\nresult: pass\r\n```\r\n\r\n**If response indicates skip:**\r\n- \"skip\", \"can't test\", \"n/a\"\r\n\r\nUpdate Tests section:\r\n```\r\n### {N}. {name}\r\nexpected: {expected}\r\nresult: skipped\r\nreason: [user's reason if provided]\r\n```\r\n\r\n**If response is anything else:**\r\n- Treat as issue description\r\n\r\nInfer severity from description:\r\n- Contains: crash, error, exception, fails, broken, unusable → blocker\r\n- Contains: doesn't work, wrong, missing, can't → major\r\n- Contains: slow, weird, off, minor, small → minor\r\n- Contains: color, font, spacing, alignment, visual → cosmetic\r\n- Default if unclear: major\r\n\r\nUpdate Tests section:\r\n```\r\n### {N}. {name}\r\nexpected: {expected}\r\nresult: issue\r\nreported: \"{verbatim user response}\"\r\nseverity: {inferred}\r\n```\r\n\r\nAppend to Gaps section (structured YAML for plan-phase --gaps):\r\n```yaml\r\n- truth: \"{expected behavior from test}\"\r\n  status: failed\r\n  reason: \"User reported: {verbatim user response}\"\r\n  severity: {inferred}\r\n  test: {N}\r\n  artifacts: []  # Filled by diagnosis\r\n  missing: []    # Filled by diagnosis\r\n```\r\n\r\n**After any response:**\r\n\r\nUpdate Summary counts.\r\nUpdate frontmatter.updated timestamp.\r\n\r\nIf more tests remain → Update Current Test, go to `present_test`\r\nIf no more tests → Go to `complete_session`\r\n</step>\r\n\r\n<step name=\"resume_from_file\">\r\n**Resume testing from UAT file:**\r\n\r\nRead the full UAT file.\r\n\r\nFind first test with `result: [pending]`.\r\n\r\nAnnounce:\r\n```\r\nResuming: Phase {phase} UAT\r\nProgress: {passed + issues + skipped}/{total}\r\nIssues found so far: {issues count}\r\n\r\nContinuing from Test {N}...\r\n```\r\n\r\nUpdate Current Test section with the pending test.\r\nProceed to `present_test`.\r\n</step>\r\n\r\n<step name=\"complete_session\">\r\n**Complete testing and commit:**\r\n\r\nUpdate frontmatter:\r\n- status: complete\r\n- updated: [now]\r\n\r\nClear Current Test section:\r\n```\r\n## Current Test\r\n\r\n[testing complete]\r\n```\r\n\r\nCommit the UAT file:\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"test({phase_num}): complete UAT - {passed} passed, {issues} issues\" --files \".planning/phases/XX-name/{phase_num}-UAT.md\"\r\n```\r\n\r\nPresent summary:\r\n```\r\n## UAT Complete: Phase {phase}\r\n\r\n| Result | Count |\r\n|--------|-------|\r\n| Passed | {N}   |\r\n| Issues | {N}   |\r\n| Skipped| {N}   |\r\n\r\n[If issues > 0:]\r\n### Issues Found\r\n\r\n[List from Issues section]\r\n```\r\n\r\n**If issues > 0:** Proceed to `diagnose_issues`\r\n\r\n**If issues == 0:**\r\n```\r\nAll tests passed. Ready to continue.\r\n\r\n- `/gsd:plan-phase {next}` — Plan next phase\r\n- `/gsd:execute-phase {next}` — Execute next phase\r\n```\r\n</step>\r\n\r\n<step name=\"diagnose_issues\">\r\n**Diagnose root causes before planning fixes:**\r\n\r\n```\r\n---\r\n\r\n{N} issues found. Diagnosing root causes...\r\n\r\nSpawning parallel debug agents to investigate each issue.\r\n```\r\n\r\n- Load diagnose-issues workflow\r\n- Follow @./.gemini/get-shit-done/workflows/diagnose-issues.md\r\n- Spawn parallel debug agents for each issue\r\n- Collect root causes\r\n- Update UAT.md with root causes\r\n- Proceed to `plan_gap_closure`\r\n\r\nDiagnosis runs automatically - no user prompt. Parallel agents investigate simultaneously, so overhead is minimal and fixes are more accurate.\r\n</step>\r\n\r\n<step name=\"plan_gap_closure\">\r\n**Auto-plan fixes from diagnosed gaps:**\r\n\r\nDisplay:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► PLANNING FIXES\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning planner for gap closure...\r\n```\r\n\r\nSpawn gsd-planner in --gaps mode:\r\n\r\n```\r\nTask(\r\n  prompt=\"\"\"\r\n<planning_context>\r\n\r\n**Phase:** {phase_number}\r\n**Mode:** gap_closure\r\n\r\n<files_to_read>\r\n- {phase_dir}/{phase_num}-UAT.md (UAT with diagnoses)\r\n- .planning/STATE.md (Project State)\r\n- .planning/ROADMAP.md (Roadmap)\r\n</files_to_read>\r\n\r\n</planning_context>\r\n\r\n<downstream_consumer>\r\nOutput consumed by /gsd:execute-phase\r\nPlans must be executable prompts.\r\n</downstream_consumer>\r\n\"\"\",\r\n  subagent_type=\"gsd-planner\",\r\n  model=\"{planner_model}\",\r\n  description=\"Plan gap fixes for Phase {phase}\"\r\n)\r\n```\r\n\r\nOn return:\r\n- **PLANNING COMPLETE:** Proceed to `verify_gap_plans`\r\n- **PLANNING INCONCLUSIVE:** Report and offer manual intervention\r\n</step>\r\n\r\n<step name=\"verify_gap_plans\">\r\n**Verify fix plans with checker:**\r\n\r\nDisplay:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► VERIFYING FIX PLANS\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning plan checker...\r\n```\r\n\r\nInitialize: `iteration_count = 1`\r\n\r\nSpawn gsd-plan-checker:\r\n\r\n```\r\nTask(\r\n  prompt=\"\"\"\r\n<verification_context>\r\n\r\n**Phase:** {phase_number}\r\n**Phase Goal:** Close diagnosed gaps from UAT\r\n\r\n<files_to_read>\r\n- {phase_dir}/*-PLAN.md (Plans to verify)\r\n</files_to_read>\r\n\r\n</verification_context>\r\n\r\n<expected_output>\r\nReturn one of:\r\n- ## VERIFICATION PASSED — all checks pass\r\n- ## ISSUES FOUND — structured issue list\r\n</expected_output>\r\n\"\"\",\r\n  subagent_type=\"gsd-plan-checker\",\r\n  model=\"{checker_model}\",\r\n  description=\"Verify Phase {phase} fix plans\"\r\n)\r\n```\r\n\r\nOn return:\r\n- **VERIFICATION PASSED:** Proceed to `present_ready`\r\n- **ISSUES FOUND:** Proceed to `revision_loop`\r\n</step>\r\n\r\n<step name=\"revision_loop\">\r\n**Iterate planner ↔ checker until plans pass (max 3):**\r\n\r\n**If iteration_count < 3:**\r\n\r\nDisplay: `Sending back to planner for revision... (iteration {N}/3)`\r\n\r\nSpawn gsd-planner with revision context:\r\n\r\n```\r\nTask(\r\n  prompt=\"\"\"\r\n<revision_context>\r\n\r\n**Phase:** {phase_number}\r\n**Mode:** revision\r\n\r\n<files_to_read>\r\n- {phase_dir}/*-PLAN.md (Existing plans)\r\n</files_to_read>\r\n\r\n**Checker issues:**\r\n{structured_issues_from_checker}\r\n\r\n</revision_context>\r\n\r\n<instructions>\r\nRead existing PLAN.md files. Make targeted updates to address checker issues.\r\nDo NOT replan from scratch unless issues are fundamental.\r\n</instructions>\r\n\"\"\",\r\n  subagent_type=\"gsd-planner\",\r\n  model=\"{planner_model}\",\r\n  description=\"Revise Phase {phase} plans\"\r\n)\r\n```\r\n\r\nAfter planner returns → spawn checker again (verify_gap_plans logic)\r\nIncrement iteration_count\r\n\r\n**If iteration_count >= 3:**\r\n\r\nDisplay: `Max iterations reached. {N} issues remain.`\r\n\r\nOffer options:\r\n1. Force proceed (execute despite issues)\r\n2. Provide guidance (user gives direction, retry)\r\n3. Abandon (exit, user runs /gsd:plan-phase manually)\r\n\r\nWait for user response.\r\n</step>\r\n\r\n<step name=\"present_ready\">\r\n**Present completion and next steps:**\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► FIXES READY ✓\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n**Phase {X}: {Name}** — {N} gap(s) diagnosed, {M} fix plan(s) created\r\n\r\n| Gap | Root Cause | Fix Plan |\r\n|-----|------------|----------|\r\n| {truth 1} | {root_cause} | {phase}-04 |\r\n| {truth 2} | {root_cause} | {phase}-04 |\r\n\r\nPlans verified and ready for execution.\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n## ▶ Next Up\r\n\r\n**Execute fixes** — run fix plans\r\n\r\n`/clear` then `/gsd:execute-phase {phase} --gaps-only`\r\n\r\n───────────────────────────────────────────────────────────────\r\n```\r\n</step>\r\n\r\n</process>\r\n\r\n<update_rules>\r\n**Batched writes for efficiency:**\r\n\r\nKeep results in memory. Write to file only when:\r\n1. **Issue found** — Preserve the problem immediately\r\n2. **Session complete** — Final write before commit\r\n3. **Checkpoint** — Every 5 passed tests (safety net)\r\n\r\n| Section | Rule | When Written |\r\n|---------|------|--------------|\r\n| Frontmatter.status | OVERWRITE | Start, complete |\r\n| Frontmatter.updated | OVERWRITE | On any file write |\r\n| Current Test | OVERWRITE | On any file write |\r\n| Tests.{N}.result | OVERWRITE | On any file write |\r\n| Summary | OVERWRITE | On any file write |\r\n| Gaps | APPEND | When issue found |\r\n\r\nOn context reset: File shows last checkpoint. Resume from there.\r\n</update_rules>\r\n\r\n<severity_inference>\r\n**Infer severity from user's natural language:**\r\n\r\n| User says | Infer |\r\n|-----------|-------|\r\n| \"crashes\", \"error\", \"exception\", \"fails completely\" | blocker |\r\n| \"doesn't work\", \"nothing happens\", \"wrong behavior\" | major |\r\n| \"works but...\", \"slow\", \"weird\", \"minor issue\" | minor |\r\n| \"color\", \"spacing\", \"alignment\", \"looks off\" | cosmetic |\r\n\r\nDefault to **major** if unclear. User can correct if needed.\r\n\r\n**Never ask \"how severe is this?\"** - just infer and move on.\r\n</severity_inference>\r\n\r\n<success_criteria>\r\n- [ ] UAT file created with all tests from SUMMARY.md\r\n- [ ] Tests presented one at a time with expected behavior\r\n- [ ] User responses processed as pass/issue/skip\r\n- [ ] Severity inferred from description (never asked)\r\n- [ ] Batched writes: on issue, every 5 passes, or completion\r\n- [ ] Committed on completion\r\n- [ ] If issues: parallel debug agents diagnose root causes\r\n- [ ] If issues: gsd-planner creates fix plans (gap_closure mode)\r\n- [ ] If issues: gsd-plan-checker verifies fix plans\r\n- [ ] If issues: revision loop until plans pass (max 3 iterations)\r\n- [ ] Ready for `/gsd:execute-phase --gaps-only` when complete\r\n</success_criteria>\r\n"
