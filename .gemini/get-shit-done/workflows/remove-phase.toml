prompt = "<purpose>\r\nRemove an unstarted future phase from the project roadmap, delete its directory, renumber all subsequent phases to maintain a clean linear sequence, and commit the change. The git commit serves as the historical record of removal.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"parse_arguments\">\r\nParse the command arguments:\r\n- Argument is the phase number to remove (integer or decimal)\r\n- Example: `/gsd:remove-phase 17` → phase = 17\r\n- Example: `/gsd:remove-phase 16.1` → phase = 16.1\r\n\r\nIf no argument provided:\r\n\r\n```\r\nERROR: Phase number required\r\nUsage: /gsd:remove-phase <phase-number>\r\nExample: /gsd:remove-phase 17\r\n```\r\n\r\nExit.\r\n</step>\r\n\r\n<step name=\"init_context\">\r\nLoad phase operation context:\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init phase-op \"${target}\")\r\n```\r\n\r\nExtract: `phase_found`, `phase_dir`, `phase_number`, `commit_docs`, `roadmap_exists`.\r\n\r\nAlso read STATE.md and ROADMAP.md content for parsing current position.\r\n</step>\r\n\r\n<step name=\"validate_future_phase\">\r\nVerify the phase is a future phase (not started):\r\n\r\n1. Compare target phase to current phase from STATE.md\r\n2. Target must be > current phase number\r\n\r\nIf target <= current phase:\r\n\r\n```\r\nERROR: Cannot remove Phase {target}\r\n\r\nOnly future phases can be removed:\r\n- Current phase: {current}\r\n- Phase {target} is current or completed\r\n\r\nTo abandon current work, use /gsd:pause-work instead.\r\n```\r\n\r\nExit.\r\n</step>\r\n\r\n<step name=\"confirm_removal\">\r\nPresent removal summary and confirm:\r\n\r\n```\r\nRemoving Phase {target}: {Name}\r\n\r\nThis will:\r\n- Delete: .planning/phases/{target}-{slug}/\r\n- Renumber all subsequent phases\r\n- Update: ROADMAP.md, STATE.md\r\n\r\nProceed? (y/n)\r\n```\r\n\r\nWait for confirmation.\r\n</step>\r\n\r\n<step name=\"execute_removal\">\r\n**Delegate the entire removal operation to gsd-tools:**\r\n\r\n```bash\r\nRESULT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs phase remove \"${target}\")\r\n```\r\n\r\nIf the phase has executed plans (SUMMARY.md files), gsd-tools will error. Use `--force` only if the user confirms:\r\n\r\n```bash\r\nRESULT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs phase remove \"${target}\" --force)\r\n```\r\n\r\nThe CLI handles:\r\n- Deleting the phase directory\r\n- Renumbering all subsequent directories (in reverse order to avoid conflicts)\r\n- Renaming all files inside renumbered directories (PLAN.md, SUMMARY.md, etc.)\r\n- Updating ROADMAP.md (removing section, renumbering all phase references, updating dependencies)\r\n- Updating STATE.md (decrementing phase count)\r\n\r\nExtract from result: `removed`, `directory_deleted`, `renamed_directories`, `renamed_files`, `roadmap_updated`, `state_updated`.\r\n</step>\r\n\r\n<step name=\"commit\">\r\nStage and commit the removal:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"chore: remove phase {target} ({original-phase-name})\" --files .planning/\r\n```\r\n\r\nThe commit message preserves the historical record of what was removed.\r\n</step>\r\n\r\n<step name=\"completion\">\r\nPresent completion summary:\r\n\r\n```\r\nPhase {target} ({original-name}) removed.\r\n\r\nChanges:\r\n- Deleted: .planning/phases/{target}-{slug}/\r\n- Renumbered: {N} directories and {M} files\r\n- Updated: ROADMAP.md, STATE.md\r\n- Committed: chore: remove phase {target} ({original-name})\r\n\r\n---\r\n\r\n## What's Next\r\n\r\nWould you like to:\r\n- `/gsd:progress` — see updated roadmap status\r\n- Continue with current phase\r\n- Review roadmap\r\n\r\n---\r\n```\r\n</step>\r\n\r\n</process>\r\n\r\n<anti_patterns>\r\n\r\n- Don't remove completed phases (have SUMMARY.md files) without --force\r\n- Don't remove current or past phases\r\n- Don't manually renumber — use `gsd-tools phase remove` which handles all renumbering\r\n- Don't add \"removed phase\" notes to STATE.md — git commit is the record\r\n- Don't modify completed phase directories\r\n</anti_patterns>\r\n\r\n<success_criteria>\r\nPhase removal is complete when:\r\n\r\n- [ ] Target phase validated as future/unstarted\r\n- [ ] `gsd-tools phase remove` executed successfully\r\n- [ ] Changes committed with descriptive message\r\n- [ ] User informed of changes\r\n</success_criteria>\r\n"
