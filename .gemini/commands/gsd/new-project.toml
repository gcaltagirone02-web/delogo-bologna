prompt = "<context>\r\n**Flags:**\r\n- `--auto` — Automatic mode. After config questions, runs research → requirements → roadmap without further interaction. Expects idea document via @ reference.\r\n</context>\r\n\r\n<objective>\r\nInitialize a new project through unified flow: questioning → research (optional) → requirements → roadmap.\r\n\r\n**Creates:**\r\n- `.planning/PROJECT.md` — project context\r\n- `.planning/config.json` — workflow preferences\r\n- `.planning/research/` — domain research (optional)\r\n- `.planning/REQUIREMENTS.md` — scoped requirements\r\n- `.planning/ROADMAP.md` — phase structure\r\n- `.planning/STATE.md` — project memory\r\n\r\n**After this command:** Run `/gsd:plan-phase 1` to start execution.\r\n</objective>\r\n\r\n<execution_context>\r\n@./.gemini/get-shit-done/workflows/new-project.md\r\n@./.gemini/get-shit-done/references/questioning.md\r\n@./.gemini/get-shit-done/references/ui-brand.md\r\n@./.gemini/get-shit-done/templates/project.md\r\n@./.gemini/get-shit-done/templates/requirements.md\r\n</execution_context>\r\n\r\n<process>\r\nExecute the new-project workflow from @./.gemini/get-shit-done/workflows/new-project.md end-to-end.\r\nPreserve all workflow gates (validation, approvals, commits, routing).\r\n</process>"
