description = "Research how to implement a phase (standalone - usually use /gsd:plan-phase instead)"
prompt = "<objective>\r\nResearch how to implement a phase. Spawns gsd-phase-researcher agent with phase context.\r\n\r\n**Note:** This is a standalone research command. For most workflows, use `/gsd:plan-phase` which integrates research automatically.\r\n\r\n**Use this command when:**\r\n- You want to research without planning yet\r\n- You want to re-research after planning is complete\r\n- You need to investigate before deciding if a phase is feasible\r\n\r\n**Orchestrator role:** Parse phase, validate against roadmap, check existing research, gather context, spawn researcher agent, present results.\r\n\r\n**Why subagent:** Research burns context fast (WebSearch, Context7 queries, source verification). Fresh 200k context for investigation. Main context stays lean for user interaction.\r\n</objective>\r\n\r\n<context>\r\nPhase number: $ARGUMENTS (required)\r\n\r\nNormalize phase input in step 1 before any directory lookups.\r\n</context>\r\n\r\n<process>\r\n\r\n## 0. Initialize Context\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init phase-op \"$ARGUMENTS\")\r\n```\r\n\r\nExtract from init JSON: `phase_dir`, `phase_number`, `phase_name`, `phase_found`, `commit_docs`, `has_research`, `state_path`, `requirements_path`, `context_path`, `research_path`.\r\n\r\nResolve researcher model:\r\n```bash\r\nRESEARCHER_MODEL=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs resolve-model gsd-phase-researcher --raw)\r\n```\r\n\r\n## 1. Validate Phase\r\n\r\n```bash\r\nPHASE_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${phase_number}\")\r\n```\r\n\r\n**If `found` is false:** Error and exit. **If `found` is true:** Extract `phase_number`, `phase_name`, `goal` from JSON.\r\n\r\n## 2. Check Existing Research\r\n\r\n```bash\r\nls .planning/phases/${PHASE}-*/RESEARCH.md 2>/dev/null\r\n```\r\n\r\n**If exists:** Offer: 1) Update research, 2) View existing, 3) Skip. Wait for response.\r\n\r\n**If doesn't exist:** Continue.\r\n\r\n## 3. Gather Phase Context\r\n\r\nUse paths from INIT (do not inline file contents in orchestrator context):\r\n- `requirements_path`\r\n- `context_path`\r\n- `state_path`\r\n\r\nPresent summary with phase description and what files the researcher will load.\r\n\r\n## 4. Spawn gsd-phase-researcher Agent\r\n\r\nResearch modes: ecosystem (default), feasibility, implementation, comparison.\r\n\r\n```markdown\r\n<research_type>\r\nPhase Research — investigating HOW to implement a specific phase well.\r\n</research_type>\r\n\r\n<key_insight>\r\nThe question is NOT \"which library should I use?\"\r\n\r\nThe question is: \"What do I not know that I don't know?\"\r\n\r\nFor this phase, discover:\r\n- What's the established architecture pattern?\r\n- What libraries form the standard stack?\r\n- What problems do people commonly hit?\r\n- What's SOTA vs what Claude's training thinks is SOTA?\r\n- What should NOT be hand-rolled?\r\n</key_insight>\r\n\r\n<objective>\r\nResearch implementation approach for Phase {phase_number}: {phase_name}\r\nMode: ecosystem\r\n</objective>\r\n\r\n<files_to_read>\r\n- {requirements_path} (Requirements)\r\n- {context_path} (Phase context from discuss-phase, if exists)\r\n- {state_path} (Prior project decisions and blockers)\r\n</files_to_read>\r\n\r\n<additional_context>\r\n**Phase description:** {phase_description}\r\n</additional_context>\r\n\r\n<downstream_consumer>\r\nYour RESEARCH.md will be loaded by `/gsd:plan-phase` which uses specific sections:\r\n- `## Standard Stack` → Plans use these libraries\r\n- `## Architecture Patterns` → Task structure follows these\r\n- `## Don't Hand-Roll` → Tasks NEVER build custom solutions for listed problems\r\n- `## Common Pitfalls` → Verification steps check for these\r\n- `## Code Examples` → Task actions reference these patterns\r\n\r\nBe prescriptive, not exploratory. \"Use X\" not \"Consider X or Y.\"\r\n</downstream_consumer>\r\n\r\n<quality_gate>\r\nBefore declaring complete, verify:\r\n- [ ] All domains investigated (not just some)\r\n- [ ] Negative claims verified with official docs\r\n- [ ] Multiple sources for critical claims\r\n- [ ] Confidence levels assigned honestly\r\n- [ ] Section names match what plan-phase expects\r\n</quality_gate>\r\n\r\n<output>\r\nWrite to: .planning/phases/${PHASE}-{slug}/${PHASE}-RESEARCH.md\r\n</output>\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=\"First, read ./.gemini/agents/gsd-phase-researcher.md for your role and instructions.\\n\\n\" + filled_prompt,\r\n  subagent_type=\"general-purpose\",\r\n  model=\"{researcher_model}\",\r\n  description=\"Research Phase {phase}\"\r\n)\r\n```\r\n\r\n## 5. Handle Agent Return\r\n\r\n**`## RESEARCH COMPLETE`:** Display summary, offer: Plan phase, Dig deeper, Review full, Done.\r\n\r\n**`## CHECKPOINT REACHED`:** Present to user, get response, spawn continuation.\r\n\r\n**`## RESEARCH INCONCLUSIVE`:** Show what was attempted, offer: Add context, Try different mode, Manual.\r\n\r\n## 6. Spawn Continuation Agent\r\n\r\n```markdown\r\n<objective>\r\nContinue research for Phase {phase_number}: {phase_name}\r\n</objective>\r\n\r\n<prior_state>\r\n<files_to_read>\r\n- .planning/phases/${PHASE}-{slug}/${PHASE}-RESEARCH.md (Existing research)\r\n</files_to_read>\r\n</prior_state>\r\n\r\n<checkpoint_response>\r\n**Type:** {checkpoint_type}\r\n**Response:** {user_response}\r\n</checkpoint_response>\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=\"First, read ./.gemini/agents/gsd-phase-researcher.md for your role and instructions.\\n\\n\" + continuation_prompt,\r\n  subagent_type=\"general-purpose\",\r\n  model=\"{researcher_model}\",\r\n  description=\"Continue research Phase {phase}\"\r\n)\r\n```\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] Phase validated against roadmap\r\n- [ ] Existing research checked\r\n- [ ] gsd-phase-researcher spawned with context\r\n- [ ] Checkpoints handled correctly\r\n- [ ] User knows next steps\r\n</success_criteria>"
