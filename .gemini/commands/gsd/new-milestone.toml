description = "Start a new milestone cycle — update PROJECT.md and route to requirements"
prompt = "<objective>\r\nStart a new milestone: questioning → research (optional) → requirements → roadmap.\r\n\r\nBrownfield equivalent of new-project. Project exists, PROJECT.md has history. Gathers \"what's next\", updates PROJECT.md, then runs requirements → roadmap cycle.\r\n\r\n**Creates/Updates:**\r\n- `.planning/PROJECT.md` — updated with new milestone goals\r\n- `.planning/research/` — domain research (optional, NEW features only)\r\n- `.planning/REQUIREMENTS.md` — scoped requirements for this milestone\r\n- `.planning/ROADMAP.md` — phase structure (continues numbering)\r\n- `.planning/STATE.md` — reset for new milestone\r\n\r\n**After:** `/gsd:plan-phase [N]` to start execution.\r\n</objective>\r\n\r\n<execution_context>\r\n@./.gemini/get-shit-done/workflows/new-milestone.md\r\n@./.gemini/get-shit-done/references/questioning.md\r\n@./.gemini/get-shit-done/references/ui-brand.md\r\n@./.gemini/get-shit-done/templates/project.md\r\n@./.gemini/get-shit-done/templates/requirements.md\r\n</execution_context>\r\n\r\n<context>\r\nMilestone name: $ARGUMENTS (optional - will prompt if not provided)\r\n\r\nProject and milestone context files are resolved inside the workflow (`init new-milestone`) and delegated via `<files_to_read>` blocks where subagents are used.\r\n</context>\r\n\r\n<process>\r\nExecute the new-milestone workflow from @./.gemini/get-shit-done/workflows/new-milestone.md end-to-end.\r\nPreserve all workflow gates (validation, questioning, research, requirements, roadmap approval, commits).\r\n</process>"
