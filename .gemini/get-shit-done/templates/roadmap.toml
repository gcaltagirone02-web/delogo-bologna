prompt = "# Roadmap Template\r\n\r\nTemplate for `.planning/ROADMAP.md`.\r\n\r\n## Initial Roadmap (v1.0 Greenfield)\r\n\r\n```markdown\r\n# Roadmap: [Project Name]\r\n\r\n## Overview\r\n\r\n[One paragraph describing the journey from start to finish]\r\n\r\n## Phases\r\n\r\n**Phase Numbering:**\r\n- Integer phases (1, 2, 3): Planned milestone work\r\n- Decimal phases (2.1, 2.2): Urgent insertions (marked with INSERTED)\r\n\r\nDecimal phases appear between their surrounding integers in numeric order.\r\n\r\n- [ ] **Phase 1: [Name]** - [One-line description]\r\n- [ ] **Phase 2: [Name]** - [One-line description]\r\n- [ ] **Phase 3: [Name]** - [One-line description]\r\n- [ ] **Phase 4: [Name]** - [One-line description]\r\n\r\n## Phase Details\r\n\r\n### Phase 1: [Name]\r\n**Goal**: [What this phase delivers]\r\n**Depends on**: Nothing (first phase)\r\n**Requirements**: [REQ-01, REQ-02, REQ-03]  <!-- brackets optional, parser handles both formats -->\r\n**Success Criteria** (what must be TRUE):\r\n  1. [Observable behavior from user perspective]\r\n  2. [Observable behavior from user perspective]\r\n  3. [Observable behavior from user perspective]\r\n**Plans**: [Number of plans, e.g., \"3 plans\" or \"TBD\"]\r\n\r\nPlans:\r\n- [ ] 01-01: [Brief description of first plan]\r\n- [ ] 01-02: [Brief description of second plan]\r\n- [ ] 01-03: [Brief description of third plan]\r\n\r\n### Phase 2: [Name]\r\n**Goal**: [What this phase delivers]\r\n**Depends on**: Phase 1\r\n**Requirements**: [REQ-04, REQ-05]\r\n**Success Criteria** (what must be TRUE):\r\n  1. [Observable behavior from user perspective]\r\n  2. [Observable behavior from user perspective]\r\n**Plans**: [Number of plans]\r\n\r\nPlans:\r\n- [ ] 02-01: [Brief description]\r\n- [ ] 02-02: [Brief description]\r\n\r\n### Phase 2.1: Critical Fix (INSERTED)\r\n**Goal**: [Urgent work inserted between phases]\r\n**Depends on**: Phase 2\r\n**Success Criteria** (what must be TRUE):\r\n  1. [What the fix achieves]\r\n**Plans**: 1 plan\r\n\r\nPlans:\r\n- [ ] 02.1-01: [Description]\r\n\r\n### Phase 3: [Name]\r\n**Goal**: [What this phase delivers]\r\n**Depends on**: Phase 2\r\n**Requirements**: [REQ-06, REQ-07, REQ-08]\r\n**Success Criteria** (what must be TRUE):\r\n  1. [Observable behavior from user perspective]\r\n  2. [Observable behavior from user perspective]\r\n  3. [Observable behavior from user perspective]\r\n**Plans**: [Number of plans]\r\n\r\nPlans:\r\n- [ ] 03-01: [Brief description]\r\n- [ ] 03-02: [Brief description]\r\n\r\n### Phase 4: [Name]\r\n**Goal**: [What this phase delivers]\r\n**Depends on**: Phase 3\r\n**Requirements**: [REQ-09, REQ-10]\r\n**Success Criteria** (what must be TRUE):\r\n  1. [Observable behavior from user perspective]\r\n  2. [Observable behavior from user perspective]\r\n**Plans**: [Number of plans]\r\n\r\nPlans:\r\n- [ ] 04-01: [Brief description]\r\n\r\n## Progress\r\n\r\n**Execution Order:**\r\nPhases execute in numeric order: 2 → 2.1 → 2.2 → 3 → 3.1 → 4\r\n\r\n| Phase | Plans Complete | Status | Completed |\r\n|-------|----------------|--------|-----------|\r\n| 1. [Name] | 0/3 | Not started | - |\r\n| 2. [Name] | 0/2 | Not started | - |\r\n| 3. [Name] | 0/2 | Not started | - |\r\n| 4. [Name] | 0/1 | Not started | - |\r\n```\r\n\r\n<guidelines>\r\n**Initial planning (v1.0):**\r\n- Phase count depends on depth setting (quick: 3-5, standard: 5-8, comprehensive: 8-12)\r\n- Each phase delivers something coherent\r\n- Phases can have 1+ plans (split if >3 tasks or multiple subsystems)\r\n- Plans use naming: {phase}-{plan}-PLAN.md (e.g., 01-02-PLAN.md)\r\n- No time estimates (this isn't enterprise PM)\r\n- Progress table updated by execute workflow\r\n- Plan count can be \"TBD\" initially, refined during planning\r\n\r\n**Success criteria:**\r\n- 2-5 observable behaviors per phase (from user's perspective)\r\n- Cross-checked against requirements during roadmap creation\r\n- Flow downstream to `must_haves` in plan-phase\r\n- Verified by verify-phase after execution\r\n- Format: \"User can [action]\" or \"[Thing] works/exists\"\r\n\r\n**After milestones ship:**\r\n- Collapse completed milestones in `<details>` tags\r\n- Add new milestone sections for upcoming work\r\n- Keep continuous phase numbering (never restart at 01)\r\n</guidelines>\r\n\r\n<status_values>\r\n- `Not started` - Haven't begun\r\n- `In progress` - Currently working\r\n- `Complete` - Done (add completion date)\r\n- `Deferred` - Pushed to later (with reason)\r\n</status_values>\r\n\r\n## Milestone-Grouped Roadmap (After v1.0 Ships)\r\n\r\nAfter completing first milestone, reorganize with milestone groupings:\r\n\r\n```markdown\r\n# Roadmap: [Project Name]\r\n\r\n## Milestones\r\n\r\n- ✅ **v1.0 MVP** - Phases 1-4 (shipped YYYY-MM-DD)\r\n- 🚧 **v1.1 [Name]** - Phases 5-6 (in progress)\r\n- 📋 **v2.0 [Name]** - Phases 7-10 (planned)\r\n\r\n## Phases\r\n\r\n<details>\r\n<summary>✅ v1.0 MVP (Phases 1-4) - SHIPPED YYYY-MM-DD</summary>\r\n\r\n### Phase 1: [Name]\r\n**Goal**: [What this phase delivers]\r\n**Plans**: 3 plans\r\n\r\nPlans:\r\n- [x] 01-01: [Brief description]\r\n- [x] 01-02: [Brief description]\r\n- [x] 01-03: [Brief description]\r\n\r\n[... remaining v1.0 phases ...]\r\n\r\n</details>\r\n\r\n### 🚧 v1.1 [Name] (In Progress)\r\n\r\n**Milestone Goal:** [What v1.1 delivers]\r\n\r\n#### Phase 5: [Name]\r\n**Goal**: [What this phase delivers]\r\n**Depends on**: Phase 4\r\n**Plans**: 2 plans\r\n\r\nPlans:\r\n- [ ] 05-01: [Brief description]\r\n- [ ] 05-02: [Brief description]\r\n\r\n[... remaining v1.1 phases ...]\r\n\r\n### 📋 v2.0 [Name] (Planned)\r\n\r\n**Milestone Goal:** [What v2.0 delivers]\r\n\r\n[... v2.0 phases ...]\r\n\r\n## Progress\r\n\r\n| Phase | Milestone | Plans Complete | Status | Completed |\r\n|-------|-----------|----------------|--------|-----------|\r\n| 1. Foundation | v1.0 | 3/3 | Complete | YYYY-MM-DD |\r\n| 2. Features | v1.0 | 2/2 | Complete | YYYY-MM-DD |\r\n| 5. Security | v1.1 | 0/2 | Not started | - |\r\n```\r\n\r\n**Notes:**\r\n- Milestone emoji: ✅ shipped, 🚧 in progress, 📋 planned\r\n- Completed milestones collapsed in `<details>` for readability\r\n- Current/future milestones expanded\r\n- Continuous phase numbering (01-99)\r\n- Progress table includes milestone column\r\n"
