prompt = "<purpose>\r\nValidate `.planning/` directory integrity and report actionable issues. Checks for missing files, invalid configurations, inconsistent state, and orphaned plans. Optionally repairs auto-fixable issues.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"parse_args\">\r\n**Parse arguments:**\r\n\r\nCheck if `--repair` flag is present in the command arguments.\r\n\r\n```\r\nREPAIR_FLAG=\"\"\r\nif arguments contain \"--repair\"; then\r\n  REPAIR_FLAG=\"--repair\"\r\nfi\r\n```\r\n</step>\r\n\r\n<step name=\"run_health_check\">\r\n**Run health validation:**\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs validate health $REPAIR_FLAG\r\n```\r\n\r\nParse JSON output:\r\n- `status`: \"healthy\" | \"degraded\" | \"broken\"\r\n- `errors[]`: Critical issues (code, message, fix, repairable)\r\n- `warnings[]`: Non-critical issues\r\n- `info[]`: Informational notes\r\n- `repairable_count`: Number of auto-fixable issues\r\n- `repairs_performed[]`: Actions taken if --repair was used\r\n</step>\r\n\r\n<step name=\"format_output\">\r\n**Format and display results:**\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD Health Check\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\nStatus: HEALTHY | DEGRADED | BROKEN\r\nErrors: N | Warnings: N | Info: N\r\n```\r\n\r\n**If repairs were performed:**\r\n```\r\n## Repairs Performed\r\n\r\n- ✓ config.json: Created with defaults\r\n- ✓ STATE.md: Regenerated from roadmap\r\n```\r\n\r\n**If errors exist:**\r\n```\r\n## Errors\r\n\r\n- [E001] config.json: JSON parse error at line 5\r\n  Fix: Run /gsd:health --repair to reset to defaults\r\n\r\n- [E002] PROJECT.md not found\r\n  Fix: Run /gsd:new-project to create\r\n```\r\n\r\n**If warnings exist:**\r\n```\r\n## Warnings\r\n\r\n- [W001] STATE.md references phase 5, but only phases 1-3 exist\r\n  Fix: Run /gsd:health --repair to regenerate\r\n\r\n- [W005] Phase directory \"1-setup\" doesn't follow NN-name format\r\n  Fix: Rename to match pattern (e.g., 01-setup)\r\n```\r\n\r\n**If info exists:**\r\n```\r\n## Info\r\n\r\n- [I001] 02-implementation/02-01-PLAN.md has no SUMMARY.md\r\n  Note: May be in progress\r\n```\r\n\r\n**Footer (if repairable issues exist and --repair was NOT used):**\r\n```\r\n---\r\nN issues can be auto-repaired. Run: /gsd:health --repair\r\n```\r\n</step>\r\n\r\n<step name=\"offer_repair\">\r\n**If repairable issues exist and --repair was NOT used:**\r\n\r\nAsk user if they want to run repairs:\r\n\r\n```\r\nWould you like to run /gsd:health --repair to fix N issues automatically?\r\n```\r\n\r\nIf yes, re-run with --repair flag and display results.\r\n</step>\r\n\r\n<step name=\"verify_repairs\">\r\n**If repairs were performed:**\r\n\r\nRe-run health check without --repair to confirm issues are resolved:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs validate health\r\n```\r\n\r\nReport final status.\r\n</step>\r\n\r\n</process>\r\n\r\n<error_codes>\r\n\r\n| Code | Severity | Description | Repairable |\r\n|------|----------|-------------|------------|\r\n| E001 | error | .planning/ directory not found | No |\r\n| E002 | error | PROJECT.md not found | No |\r\n| E003 | error | ROADMAP.md not found | No |\r\n| E004 | error | STATE.md not found | Yes |\r\n| E005 | error | config.json parse error | Yes |\r\n| W001 | warning | PROJECT.md missing required section | No |\r\n| W002 | warning | STATE.md references invalid phase | Yes |\r\n| W003 | warning | config.json not found | Yes |\r\n| W004 | warning | config.json invalid field value | No |\r\n| W005 | warning | Phase directory naming mismatch | No |\r\n| W006 | warning | Phase in ROADMAP but no directory | No |\r\n| W007 | warning | Phase on disk but not in ROADMAP | No |\r\n| I001 | info | Plan without SUMMARY (may be in progress) | No |\r\n\r\n</error_codes>\r\n\r\n<repair_actions>\r\n\r\n| Action | Effect | Risk |\r\n|--------|--------|------|\r\n| createConfig | Create config.json with defaults | None |\r\n| resetConfig | Delete + recreate config.json | Loses custom settings |\r\n| regenerateState | Create STATE.md from ROADMAP structure | Loses session history |\r\n\r\n**Not repairable (too risky):**\r\n- PROJECT.md, ROADMAP.md content\r\n- Phase directory renaming\r\n- Orphaned plan cleanup\r\n\r\n</repair_actions>\r\n"
