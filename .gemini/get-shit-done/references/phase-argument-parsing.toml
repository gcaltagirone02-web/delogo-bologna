prompt = "# Phase Argument Parsing\r\n\r\nParse and normalize phase arguments for commands that operate on phases.\r\n\r\n## Extraction\r\n\r\nFrom `$ARGUMENTS`:\r\n- Extract phase number (first numeric argument)\r\n- Extract flags (prefixed with `--`)\r\n- Remaining text is description (for insert/add commands)\r\n\r\n## Using gsd-tools\r\n\r\nThe `find-phase` command handles normalization and validation in one step:\r\n\r\n```bash\r\nPHASE_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs find-phase \"${PHASE}\")\r\n```\r\n\r\nReturns JSON with:\r\n- `found`: true/false\r\n- `directory`: Full path to phase directory\r\n- `phase_number`: Normalized number (e.g., \"06\", \"06.1\")\r\n- `phase_name`: Name portion (e.g., \"foundation\")\r\n- `plans`: Array of PLAN.md files\r\n- `summaries`: Array of SUMMARY.md files\r\n\r\n## Manual Normalization (Legacy)\r\n\r\nZero-pad integer phases to 2 digits. Preserve decimal suffixes.\r\n\r\n```bash\r\n# Normalize phase number\r\nif [[ \"$PHASE\" =~ ^[0-9]+$ ]]; then\r\n  # Integer: 8 → 08\r\n  PHASE=$(printf \"%02d\" \"$PHASE\")\r\nelif [[ \"$PHASE\" =~ ^([0-9]+)\\.([0-9]+)$ ]]; then\r\n  # Decimal: 2.1 → 02.1\r\n  PHASE=$(printf \"%02d.%s\" \"${BASH_REMATCH[1]}\" \"${BASH_REMATCH[2]}\")\r\nfi\r\n```\r\n\r\n## Validation\r\n\r\nUse `roadmap get-phase` to validate phase exists:\r\n\r\n```bash\r\nPHASE_CHECK=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${PHASE}\")\r\nif [ \"$(echo \"$PHASE_CHECK\" | jq -r '.found')\" = \"false\" ]; then\r\n  echo \"ERROR: Phase ${PHASE} not found in roadmap\"\r\n  exit 1\r\nfi\r\n```\r\n\r\n## Directory Lookup\r\n\r\nUse `find-phase` for directory lookup:\r\n\r\n```bash\r\nPHASE_DIR=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs find-phase \"${PHASE}\" --raw)\r\n```\r\n"
