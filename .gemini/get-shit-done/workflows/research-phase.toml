prompt = "<purpose>\r\nResearch how to implement a phase. Spawns gsd-phase-researcher with phase context.\r\n\r\nStandalone research command. For most workflows, use `/gsd:plan-phase` which integrates research automatically.\r\n</purpose>\r\n\r\n<process>\r\n\r\n## Step 0: Resolve Model Profile\r\n\r\n@./.gemini/get-shit-done/references/model-profile-resolution.md\r\n\r\nResolve model for:\r\n- `gsd-phase-researcher`\r\n\r\n## Step 1: Normalize and Validate Phase\r\n\r\n@./.gemini/get-shit-done/references/phase-argument-parsing.md\r\n\r\n```bash\r\nPHASE_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${PHASE}\")\r\n```\r\n\r\nIf `found` is false: Error and exit.\r\n\r\n## Step 2: Check Existing Research\r\n\r\n```bash\r\nls .planning/phases/${PHASE}-*/RESEARCH.md 2>/dev/null\r\n```\r\n\r\nIf exists: Offer update/view/skip options.\r\n\r\n## Step 3: Gather Phase Context\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init phase-op \"${PHASE}\")\r\n# Extract: phase_dir, padded_phase, phase_number, state_path, requirements_path, context_path\r\n```\r\n\r\n## Step 4: Spawn Researcher\r\n\r\n```\r\nTask(\r\n  prompt=\"<objective>\r\nResearch implementation approach for Phase {phase}: {name}\r\n</objective>\r\n\r\n<files_to_read>\r\n- {context_path} (USER DECISIONS from /gsd:discuss-phase)\r\n- {requirements_path} (Project requirements)\r\n- {state_path} (Project decisions and history)\r\n</files_to_read>\r\n\r\n<additional_context>\r\nPhase description: {description}\r\n</additional_context>\r\n\r\n<output>\r\nWrite to: .planning/phases/${PHASE}-{slug}/${PHASE}-RESEARCH.md\r\n</output>\",\r\n  subagent_type=\"gsd-phase-researcher\",\r\n  model=\"{researcher_model}\"\r\n)\r\n```\r\n\r\n## Step 5: Handle Return\r\n\r\n- `## RESEARCH COMPLETE` — Display summary, offer: Plan/Dig deeper/Review/Done\r\n- `## CHECKPOINT REACHED` — Present to user, spawn continuation\r\n- `## RESEARCH INCONCLUSIVE` — Show attempts, offer: Add context/Try different mode/Manual\r\n\r\n</process>\r\n"
