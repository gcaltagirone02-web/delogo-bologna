prompt = "<purpose>\r\nInteractive configuration of GSD workflow agents (research, plan_check, verifier) and model profile selection via multi-question prompt. Updates .planning/config.json with user preferences. Optionally saves settings as global defaults (~/.gsd/defaults.json) for future projects.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"ensure_and_load_config\">\r\nEnsure config exists and load current state:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs config-ensure-section\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs state load)\r\n```\r\n\r\nCreates `.planning/config.json` with defaults if missing and loads current config values.\r\n</step>\r\n\r\n<step name=\"read_current\">\r\n```bash\r\ncat .planning/config.json\r\n```\r\n\r\nParse current values (default to `true` if not present):\r\n- `workflow.research` — spawn researcher during plan-phase\r\n- `workflow.plan_check` — spawn plan checker during plan-phase\r\n- `workflow.verifier` — spawn verifier during execute-phase\r\n- `model_profile` — which model each agent uses (default: `balanced`)\r\n- `git.branching_strategy` — branching approach (default: `\"none\"`)\r\n</step>\r\n\r\n<step name=\"present_settings\">\r\nUse AskUserQuestion with current values pre-selected:\r\n\r\n```\r\nAskUserQuestion([\r\n  {\r\n    question: \"Which model profile for agents?\",\r\n    header: \"Model\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Quality\", description: \"Opus everywhere except verification (highest cost)\" },\r\n      { label: \"Balanced (Recommended)\", description: \"Opus for planning, Sonnet for execution/verification\" },\r\n      { label: \"Budget\", description: \"Sonnet for writing, Haiku for research/verification (lowest cost)\" }\r\n    ]\r\n  },\r\n  {\r\n    question: \"Spawn Plan Researcher? (researches domain before planning)\",\r\n    header: \"Research\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes\", description: \"Research phase goals before planning\" },\r\n      { label: \"No\", description: \"Skip research, plan directly\" }\r\n    ]\r\n  },\r\n  {\r\n    question: \"Spawn Plan Checker? (verifies plans before execution)\",\r\n    header: \"Plan Check\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes\", description: \"Verify plans meet phase goals\" },\r\n      { label: \"No\", description: \"Skip plan verification\" }\r\n    ]\r\n  },\r\n  {\r\n    question: \"Spawn Execution Verifier? (verifies phase completion)\",\r\n    header: \"Verifier\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes\", description: \"Verify must-haves after execution\" },\r\n      { label: \"No\", description: \"Skip post-execution verification\" }\r\n    ]\r\n  },\r\n  {\r\n    question: \"Auto-advance pipeline? (discuss → plan → execute automatically)\",\r\n    header: \"Auto\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"No (Recommended)\", description: \"Manual /clear + paste between stages\" },\r\n      { label: \"Yes\", description: \"Chain stages via Task() subagents (same isolation)\" }\r\n    ]\r\n  },\r\n  {\r\n    question: \"Git branching strategy?\",\r\n    header: \"Branching\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"None (Recommended)\", description: \"Commit directly to current branch\" },\r\n      { label: \"Per Phase\", description: \"Create branch for each phase (gsd/phase-{N}-{name})\" },\r\n      { label: \"Per Milestone\", description: \"Create branch for entire milestone (gsd/{version}-{name})\" }\r\n    ]\r\n  }\r\n])\r\n```\r\n</step>\r\n\r\n<step name=\"update_config\">\r\nMerge new settings into existing config.json:\r\n\r\n```json\r\n{\r\n  ...existing_config,\r\n  \"model_profile\": \"quality\" | \"balanced\" | \"budget\",\r\n  \"workflow\": {\r\n    \"research\": true/false,\r\n    \"plan_check\": true/false,\r\n    \"verifier\": true/false,\r\n    \"auto_advance\": true/false\r\n  },\r\n  \"git\": {\r\n    \"branching_strategy\": \"none\" | \"phase\" | \"milestone\"\r\n  }\r\n}\r\n```\r\n\r\nWrite updated config to `.planning/config.json`.\r\n</step>\r\n\r\n<step name=\"save_as_defaults\">\r\nAsk whether to save these settings as global defaults for future projects:\r\n\r\n```\r\nAskUserQuestion([\r\n  {\r\n    question: \"Save these as default settings for all new projects?\",\r\n    header: \"Defaults\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes\", description: \"New projects start with these settings (saved to ~/.gsd/defaults.json)\" },\r\n      { label: \"No\", description: \"Only apply to this project\" }\r\n    ]\r\n  }\r\n])\r\n```\r\n\r\nIf \"Yes\": write the same config object (minus project-specific fields like `brave_search`) to `~/.gsd/defaults.json`:\r\n\r\n```bash\r\nmkdir -p ~/.gsd\r\n```\r\n\r\nWrite `~/.gsd/defaults.json` with:\r\n```json\r\n{\r\n  \"mode\": <current>,\r\n  \"depth\": <current>,\r\n  \"model_profile\": <current>,\r\n  \"commit_docs\": <current>,\r\n  \"parallelization\": <current>,\r\n  \"branching_strategy\": <current>,\r\n  \"workflow\": {\r\n    \"research\": <current>,\r\n    \"plan_check\": <current>,\r\n    \"verifier\": <current>,\r\n    \"auto_advance\": <current>\r\n  }\r\n}\r\n```\r\n</step>\r\n\r\n<step name=\"confirm\">\r\nDisplay:\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► SETTINGS UPDATED\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n| Setting              | Value |\r\n|----------------------|-------|\r\n| Model Profile        | {quality/balanced/budget} |\r\n| Plan Researcher      | {On/Off} |\r\n| Plan Checker         | {On/Off} |\r\n| Execution Verifier   | {On/Off} |\r\n| Auto-Advance         | {On/Off} |\r\n| Git Branching        | {None/Per Phase/Per Milestone} |\r\n| Saved as Defaults    | {Yes/No} |\r\n\r\nThese settings apply to future /gsd:plan-phase and /gsd:execute-phase runs.\r\n\r\nQuick commands:\r\n- /gsd:set-profile <profile> — switch model profile\r\n- /gsd:plan-phase --research — force research\r\n- /gsd:plan-phase --skip-research — skip research\r\n- /gsd:plan-phase --skip-verify — skip plan check\r\n```\r\n</step>\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] Current config read\r\n- [ ] User presented with 6 settings (profile + 4 workflow toggles + git branching)\r\n- [ ] Config updated with model_profile, workflow, and git sections\r\n- [ ] User offered to save as global defaults (~/.gsd/defaults.json)\r\n- [ ] Changes confirmed to user\r\n</success_criteria>\r\n"
