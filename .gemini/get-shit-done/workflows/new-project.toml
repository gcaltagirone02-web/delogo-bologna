prompt = "<purpose>\r\nInitialize a new project through unified flow: questioning, research (optional), requirements, roadmap. This is the most leveraged moment in any project — deep questioning here means better plans, better execution, better outcomes. One workflow takes you from idea to ready-for-planning.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<auto_mode>\r\n## Auto Mode Detection\r\n\r\nCheck if `--auto` flag is present in $ARGUMENTS.\r\n\r\n**If auto mode:**\r\n- Skip brownfield mapping offer (assume greenfield)\r\n- Skip deep questioning (extract context from provided document)\r\n- Config: YOLO mode is implicit (skip that question), but ask depth/git/agents FIRST (Step 2a)\r\n- After config: run Steps 6-9 automatically with smart defaults:\r\n  - Research: Always yes\r\n  - Requirements: Include all table stakes + features from provided document\r\n  - Requirements approval: Auto-approve\r\n  - Roadmap approval: Auto-approve\r\n\r\n**Document requirement:**\r\nAuto mode requires an idea document — either:\r\n- File reference: `/gsd:new-project --auto @prd.md`\r\n- Pasted/written text in the prompt\r\n\r\nIf no document content provided, error:\r\n\r\n```\r\nError: --auto requires an idea document.\r\n\r\nUsage:\r\n  /gsd:new-project --auto @your-idea.md\r\n  /gsd:new-project --auto [paste or write your idea here]\r\n\r\nThe document should describe what you want to build.\r\n```\r\n</auto_mode>\r\n\r\n<process>\r\n\r\n## 1. Setup\r\n\r\n**MANDATORY FIRST STEP — Execute these checks before ANY user interaction:**\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init new-project)\r\n```\r\n\r\nParse JSON for: `researcher_model`, `synthesizer_model`, `roadmapper_model`, `commit_docs`, `project_exists`, `has_codebase_map`, `planning_exists`, `has_existing_code`, `has_package_file`, `is_brownfield`, `needs_codebase_map`, `has_git`, `project_path`.\r\n\r\n**If `project_exists` is true:** Error — project already initialized. Use `/gsd:progress`.\r\n\r\n**If `has_git` is false:** Initialize git:\r\n```bash\r\ngit init\r\n```\r\n\r\n## 2. Brownfield Offer\r\n\r\n**If auto mode:** Skip to Step 4 (assume greenfield, synthesize PROJECT.md from provided document).\r\n\r\n**If `needs_codebase_map` is true** (from init — existing code detected but no codebase map):\r\n\r\nUse AskUserQuestion:\r\n- header: \"Codebase\"\r\n- question: \"I detected existing code in this directory. Would you like to map the codebase first?\"\r\n- options:\r\n  - \"Map codebase first\" — Run /gsd:map-codebase to understand existing architecture (Recommended)\r\n  - \"Skip mapping\" — Proceed with project initialization\r\n\r\n**If \"Map codebase first\":**\r\n```\r\nRun `/gsd:map-codebase` first, then return to `/gsd:new-project`\r\n```\r\nExit command.\r\n\r\n**If \"Skip mapping\" OR `needs_codebase_map` is false:** Continue to Step 3.\r\n\r\n## 2a. Auto Mode Config (auto mode only)\r\n\r\n**If auto mode:** Collect config settings upfront before processing the idea document.\r\n\r\nYOLO mode is implicit (auto = YOLO). Ask remaining config questions:\r\n\r\n**Round 1 — Core settings (3 questions, no Mode question):**\r\n\r\n```\r\nAskUserQuestion([\r\n  {\r\n    header: \"Depth\",\r\n    question: \"How thorough should planning be?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Quick (Recommended)\", description: \"Ship fast (3-5 phases, 1-3 plans each)\" },\r\n      { label: \"Standard\", description: \"Balanced scope and speed (5-8 phases, 3-5 plans each)\" },\r\n      { label: \"Comprehensive\", description: \"Thorough coverage (8-12 phases, 5-10 plans each)\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Execution\",\r\n    question: \"Run plans in parallel?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Parallel (Recommended)\", description: \"Independent plans run simultaneously\" },\r\n      { label: \"Sequential\", description: \"One plan at a time\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Git Tracking\",\r\n    question: \"Commit planning docs to git?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Planning docs tracked in version control\" },\r\n      { label: \"No\", description: \"Keep .planning/ local-only (add to .gitignore)\" }\r\n    ]\r\n  }\r\n])\r\n```\r\n\r\n**Round 2 — Workflow agents (same as Step 5):**\r\n\r\n```\r\nAskUserQuestion([\r\n  {\r\n    header: \"Research\",\r\n    question: \"Research before planning each phase? (adds tokens/time)\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Investigate domain, find patterns, surface gotchas\" },\r\n      { label: \"No\", description: \"Plan directly from requirements\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Plan Check\",\r\n    question: \"Verify plans will achieve their goals? (adds tokens/time)\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Catch gaps before execution starts\" },\r\n      { label: \"No\", description: \"Execute plans without verification\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Verifier\",\r\n    question: \"Verify work satisfies requirements after each phase? (adds tokens/time)\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Confirm deliverables match phase goals\" },\r\n      { label: \"No\", description: \"Trust execution, skip verification\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"AI Models\",\r\n    question: \"Which AI models for planning agents?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Balanced (Recommended)\", description: \"Sonnet for most agents — good quality/cost ratio\" },\r\n      { label: \"Quality\", description: \"Opus for research/roadmap — higher cost, deeper analysis\" },\r\n      { label: \"Budget\", description: \"Haiku where possible — fastest, lowest cost\" }\r\n    ]\r\n  }\r\n])\r\n```\r\n\r\nCreate `.planning/config.json` with mode set to \"yolo\":\r\n\r\n```json\r\n{\r\n  \"mode\": \"yolo\",\r\n  \"depth\": \"[selected]\",\r\n  \"parallelization\": true|false,\r\n  \"commit_docs\": true|false,\r\n  \"model_profile\": \"quality|balanced|budget\",\r\n  \"workflow\": {\r\n    \"research\": true|false,\r\n    \"plan_check\": true|false,\r\n    \"verifier\": true|false,\r\n    \"auto_advance\": true\r\n  }\r\n}\r\n```\r\n\r\n**If commit_docs = No:** Add `.planning/` to `.gitignore`.\r\n\r\n**Commit config.json:**\r\n\r\n```bash\r\nmkdir -p .planning\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"chore: add project config\" --files .planning/config.json\r\n```\r\n\r\n**Persist auto-advance to config (survives context compaction):**\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs config-set workflow.auto_advance true\r\n```\r\n\r\nProceed to Step 4 (skip Steps 3 and 5).\r\n\r\n## 3. Deep Questioning\r\n\r\n**If auto mode:** Skip (already handled in Step 2a). Extract project context from provided document instead and proceed to Step 4.\r\n\r\n**Display stage banner:**\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► QUESTIONING\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n```\r\n\r\n**Open the conversation:**\r\n\r\nAsk inline (freeform, NOT AskUserQuestion):\r\n\r\n\"What do you want to build?\"\r\n\r\nWait for their response. This gives you the context needed to ask intelligent follow-up questions.\r\n\r\n**Follow the thread:**\r\n\r\nBased on what they said, ask follow-up questions that dig into their response. Use AskUserQuestion with options that probe what they mentioned — interpretations, clarifications, concrete examples.\r\n\r\nKeep following threads. Each answer opens new threads to explore. Ask about:\r\n- What excited them\r\n- What problem sparked this\r\n- What they mean by vague terms\r\n- What it would actually look like\r\n- What's already decided\r\n\r\nConsult `questioning.md` for techniques:\r\n- Challenge vagueness\r\n- Make abstract concrete\r\n- Surface assumptions\r\n- Find edges\r\n- Reveal motivation\r\n\r\n**Check context (background, not out loud):**\r\n\r\nAs you go, mentally check the context checklist from `questioning.md`. If gaps remain, weave questions naturally. Don't suddenly switch to checklist mode.\r\n\r\n**Decision gate:**\r\n\r\nWhen you could write a clear PROJECT.md, use AskUserQuestion:\r\n\r\n- header: \"Ready?\"\r\n- question: \"I think I understand what you're after. Ready to create PROJECT.md?\"\r\n- options:\r\n  - \"Create PROJECT.md\" — Let's move forward\r\n  - \"Keep exploring\" — I want to share more / ask me more\r\n\r\nIf \"Keep exploring\" — ask what they want to add, or identify gaps and probe naturally.\r\n\r\nLoop until \"Create PROJECT.md\" selected.\r\n\r\n## 4. Write PROJECT.md\r\n\r\n**If auto mode:** Synthesize from provided document. No \"Ready?\" gate was shown — proceed directly to commit.\r\n\r\nSynthesize all context into `.planning/PROJECT.md` using the template from `templates/project.md`.\r\n\r\n**For greenfield projects:**\r\n\r\nInitialize requirements as hypotheses:\r\n\r\n```markdown\r\n## Requirements\r\n\r\n### Validated\r\n\r\n(None yet — ship to validate)\r\n\r\n### Active\r\n\r\n- [ ] [Requirement 1]\r\n- [ ] [Requirement 2]\r\n- [ ] [Requirement 3]\r\n\r\n### Out of Scope\r\n\r\n- [Exclusion 1] — [why]\r\n- [Exclusion 2] — [why]\r\n```\r\n\r\nAll Active requirements are hypotheses until shipped and validated.\r\n\r\n**For brownfield projects (codebase map exists):**\r\n\r\nInfer Validated requirements from existing code:\r\n\r\n1. Read `.planning/codebase/ARCHITECTURE.md` and `STACK.md`\r\n2. Identify what the codebase already does\r\n3. These become the initial Validated set\r\n\r\n```markdown\r\n## Requirements\r\n\r\n### Validated\r\n\r\n- ✓ [Existing capability 1] — existing\r\n- ✓ [Existing capability 2] — existing\r\n- ✓ [Existing capability 3] — existing\r\n\r\n### Active\r\n\r\n- [ ] [New requirement 1]\r\n- [ ] [New requirement 2]\r\n\r\n### Out of Scope\r\n\r\n- [Exclusion 1] — [why]\r\n```\r\n\r\n**Key Decisions:**\r\n\r\nInitialize with any decisions made during questioning:\r\n\r\n```markdown\r\n## Key Decisions\r\n\r\n| Decision | Rationale | Outcome |\r\n|----------|-----------|---------|\r\n| [Choice from questioning] | [Why] | — Pending |\r\n```\r\n\r\n**Last updated footer:**\r\n\r\n```markdown\r\n---\r\n*Last updated: [date] after initialization*\r\n```\r\n\r\nDo not compress. Capture everything gathered.\r\n\r\n**Commit PROJECT.md:**\r\n\r\n```bash\r\nmkdir -p .planning\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: initialize project\" --files .planning/PROJECT.md\r\n```\r\n\r\n## 5. Workflow Preferences\r\n\r\n**If auto mode:** Skip — config was collected in Step 2a. Proceed to Step 5.5.\r\n\r\n**Check for global defaults** at `~/.gsd/defaults.json`. If the file exists, offer to use saved defaults:\r\n\r\n```\r\nAskUserQuestion([\r\n  {\r\n    question: \"Use your saved default settings? (from ~/.gsd/defaults.json)\",\r\n    header: \"Defaults\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Use saved defaults, skip settings questions\" },\r\n      { label: \"No\", description: \"Configure settings manually\" }\r\n    ]\r\n  }\r\n])\r\n```\r\n\r\nIf \"Yes\": read `~/.gsd/defaults.json`, use those values for config.json, and skip directly to **Commit config.json** below.\r\n\r\nIf \"No\" or `~/.gsd/defaults.json` doesn't exist: proceed with the questions below.\r\n\r\n**Round 1 — Core workflow settings (4 questions):**\r\n\r\n```\r\nquestions: [\r\n  {\r\n    header: \"Mode\",\r\n    question: \"How do you want to work?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"YOLO (Recommended)\", description: \"Auto-approve, just execute\" },\r\n      { label: \"Interactive\", description: \"Confirm at each step\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Depth\",\r\n    question: \"How thorough should planning be?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Quick\", description: \"Ship fast (3-5 phases, 1-3 plans each)\" },\r\n      { label: \"Standard\", description: \"Balanced scope and speed (5-8 phases, 3-5 plans each)\" },\r\n      { label: \"Comprehensive\", description: \"Thorough coverage (8-12 phases, 5-10 plans each)\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Execution\",\r\n    question: \"Run plans in parallel?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Parallel (Recommended)\", description: \"Independent plans run simultaneously\" },\r\n      { label: \"Sequential\", description: \"One plan at a time\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Git Tracking\",\r\n    question: \"Commit planning docs to git?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Planning docs tracked in version control\" },\r\n      { label: \"No\", description: \"Keep .planning/ local-only (add to .gitignore)\" }\r\n    ]\r\n  }\r\n]\r\n```\r\n\r\n**Round 2 — Workflow agents:**\r\n\r\nThese spawn additional agents during planning/execution. They add tokens and time but improve quality.\r\n\r\n| Agent | When it runs | What it does |\r\n|-------|--------------|--------------|\r\n| **Researcher** | Before planning each phase | Investigates domain, finds patterns, surfaces gotchas |\r\n| **Plan Checker** | After plan is created | Verifies plan actually achieves the phase goal |\r\n| **Verifier** | After phase execution | Confirms must-haves were delivered |\r\n\r\nAll recommended for important projects. Skip for quick experiments.\r\n\r\n```\r\nquestions: [\r\n  {\r\n    header: \"Research\",\r\n    question: \"Research before planning each phase? (adds tokens/time)\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Investigate domain, find patterns, surface gotchas\" },\r\n      { label: \"No\", description: \"Plan directly from requirements\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Plan Check\",\r\n    question: \"Verify plans will achieve their goals? (adds tokens/time)\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Catch gaps before execution starts\" },\r\n      { label: \"No\", description: \"Execute plans without verification\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"Verifier\",\r\n    question: \"Verify work satisfies requirements after each phase? (adds tokens/time)\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Yes (Recommended)\", description: \"Confirm deliverables match phase goals\" },\r\n      { label: \"No\", description: \"Trust execution, skip verification\" }\r\n    ]\r\n  },\r\n  {\r\n    header: \"AI Models\",\r\n    question: \"Which AI models for planning agents?\",\r\n    multiSelect: false,\r\n    options: [\r\n      { label: \"Balanced (Recommended)\", description: \"Sonnet for most agents — good quality/cost ratio\" },\r\n      { label: \"Quality\", description: \"Opus for research/roadmap — higher cost, deeper analysis\" },\r\n      { label: \"Budget\", description: \"Haiku where possible — fastest, lowest cost\" }\r\n    ]\r\n  }\r\n]\r\n```\r\n\r\nCreate `.planning/config.json` with all settings:\r\n\r\n```json\r\n{\r\n  \"mode\": \"yolo|interactive\",\r\n  \"depth\": \"quick|standard|comprehensive\",\r\n  \"parallelization\": true|false,\r\n  \"commit_docs\": true|false,\r\n  \"model_profile\": \"quality|balanced|budget\",\r\n  \"workflow\": {\r\n    \"research\": true|false,\r\n    \"plan_check\": true|false,\r\n    \"verifier\": true|false\r\n  }\r\n}\r\n```\r\n\r\n**If commit_docs = No:**\r\n- Set `commit_docs: false` in config.json\r\n- Add `.planning/` to `.gitignore` (create if needed)\r\n\r\n**If commit_docs = Yes:**\r\n- No additional gitignore entries needed\r\n\r\n**Commit config.json:**\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"chore: add project config\" --files .planning/config.json\r\n```\r\n\r\n**Note:** Run `/gsd:settings` anytime to update these preferences.\r\n\r\n## 5.5. Resolve Model Profile\r\n\r\nUse models from init: `researcher_model`, `synthesizer_model`, `roadmapper_model`.\r\n\r\n## 6. Research Decision\r\n\r\n**If auto mode:** Default to \"Research first\" without asking.\r\n\r\nUse AskUserQuestion:\r\n- header: \"Research\"\r\n- question: \"Research the domain ecosystem before defining requirements?\"\r\n- options:\r\n  - \"Research first (Recommended)\" — Discover standard stacks, expected features, architecture patterns\r\n  - \"Skip research\" — I know this domain well, go straight to requirements\r\n\r\n**If \"Research first\":**\r\n\r\nDisplay stage banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► RESEARCHING\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\nResearching [domain] ecosystem...\r\n```\r\n\r\nCreate research directory:\r\n```bash\r\nmkdir -p .planning/research\r\n```\r\n\r\n**Determine milestone context:**\r\n\r\nCheck if this is greenfield or subsequent milestone:\r\n- If no \"Validated\" requirements in PROJECT.md → Greenfield (building from scratch)\r\n- If \"Validated\" requirements exist → Subsequent milestone (adding to existing app)\r\n\r\nDisplay spawning indicator:\r\n```\r\n◆ Spawning 4 researchers in parallel...\r\n  → Stack research\r\n  → Features research\r\n  → Architecture research\r\n  → Pitfalls research\r\n```\r\n\r\nSpawn 4 parallel gsd-project-researcher agents with path references:\r\n\r\n```\r\nTask(prompt=\"First, read ./.gemini/agents/gsd-project-researcher.md for your role and instructions.\r\n\r\n<research_type>\r\nProject Research — Stack dimension for [domain].\r\n</research_type>\r\n\r\n<milestone_context>\r\n[greenfield OR subsequent]\r\n\r\nGreenfield: Research the standard stack for building [domain] from scratch.\r\nSubsequent: Research what's needed to add [target features] to an existing [domain] app. Don't re-research the existing system.\r\n</milestone_context>\r\n\r\n<question>\r\nWhat's the standard 2025 stack for [domain]?\r\n</question>\r\n\r\n<files_to_read>\r\n- {project_path} (Project context and goals)\r\n</files_to_read>\r\n\r\n<downstream_consumer>\r\nYour STACK.md feeds into roadmap creation. Be prescriptive:\r\n- Specific libraries with versions\r\n- Clear rationale for each choice\r\n- What NOT to use and why\r\n</downstream_consumer>\r\n\r\n<quality_gate>\r\n- [ ] Versions are current (verify with Context7/official docs, not training data)\r\n- [ ] Rationale explains WHY, not just WHAT\r\n- [ ] Confidence levels assigned to each recommendation\r\n</quality_gate>\r\n\r\n<output>\r\nWrite to: .planning/research/STACK.md\r\nUse template: ./.gemini/get-shit-done/templates/research-project/STACK.md\r\n</output>\r\n\", subagent_type=\"general-purpose\", model=\"{researcher_model}\", description=\"Stack research\")\r\n\r\nTask(prompt=\"First, read ./.gemini/agents/gsd-project-researcher.md for your role and instructions.\r\n\r\n<research_type>\r\nProject Research — Features dimension for [domain].\r\n</research_type>\r\n\r\n<milestone_context>\r\n[greenfield OR subsequent]\r\n\r\nGreenfield: What features do [domain] products have? What's table stakes vs differentiating?\r\nSubsequent: How do [target features] typically work? What's expected behavior?\r\n</milestone_context>\r\n\r\n<question>\r\nWhat features do [domain] products have? What's table stakes vs differentiating?\r\n</question>\r\n\r\n<files_to_read>\r\n- {project_path} (Project context)\r\n</files_to_read>\r\n\r\n<downstream_consumer>\r\nYour FEATURES.md feeds into requirements definition. Categorize clearly:\r\n- Table stakes (must have or users leave)\r\n- Differentiators (competitive advantage)\r\n- Anti-features (things to deliberately NOT build)\r\n</downstream_consumer>\r\n\r\n<quality_gate>\r\n- [ ] Categories are clear (table stakes vs differentiators vs anti-features)\r\n- [ ] Complexity noted for each feature\r\n- [ ] Dependencies between features identified\r\n</quality_gate>\r\n\r\n<output>\r\nWrite to: .planning/research/FEATURES.md\r\nUse template: ./.gemini/get-shit-done/templates/research-project/FEATURES.md\r\n</output>\r\n\", subagent_type=\"general-purpose\", model=\"{researcher_model}\", description=\"Features research\")\r\n\r\nTask(prompt=\"First, read ./.gemini/agents/gsd-project-researcher.md for your role and instructions.\r\n\r\n<research_type>\r\nProject Research — Architecture dimension for [domain].\r\n</research_type>\r\n\r\n<milestone_context>\r\n[greenfield OR subsequent]\r\n\r\nGreenfield: How are [domain] systems typically structured? What are major components?\r\nSubsequent: How do [target features] integrate with existing [domain] architecture?\r\n</milestone_context>\r\n\r\n<question>\r\nHow are [domain] systems typically structured? What are major components?\r\n</question>\r\n\r\n<files_to_read>\r\n- {project_path} (Project context)\r\n</files_to_read>\r\n\r\n<downstream_consumer>\r\nYour ARCHITECTURE.md informs phase structure in roadmap. Include:\r\n- Component boundaries (what talks to what)\r\n- Data flow (how information moves)\r\n- Suggested build order (dependencies between components)\r\n</downstream_consumer>\r\n\r\n<quality_gate>\r\n- [ ] Components clearly defined with boundaries\r\n- [ ] Data flow direction explicit\r\n- [ ] Build order implications noted\r\n</quality_gate>\r\n\r\n<output>\r\nWrite to: .planning/research/ARCHITECTURE.md\r\nUse template: ./.gemini/get-shit-done/templates/research-project/ARCHITECTURE.md\r\n</output>\r\n\", subagent_type=\"general-purpose\", model=\"{researcher_model}\", description=\"Architecture research\")\r\n\r\nTask(prompt=\"First, read ./.gemini/agents/gsd-project-researcher.md for your role and instructions.\r\n\r\n<research_type>\r\nProject Research — Pitfalls dimension for [domain].\r\n</research_type>\r\n\r\n<milestone_context>\r\n[greenfield OR subsequent]\r\n\r\nGreenfield: What do [domain] projects commonly get wrong? Critical mistakes?\r\nSubsequent: What are common mistakes when adding [target features] to [domain]?\r\n</milestone_context>\r\n\r\n<question>\r\nWhat do [domain] projects commonly get wrong? Critical mistakes?\r\n</question>\r\n\r\n<files_to_read>\r\n- {project_path} (Project context)\r\n</files_to_read>\r\n\r\n<downstream_consumer>\r\nYour PITFALLS.md prevents mistakes in roadmap/planning. For each pitfall:\r\n- Warning signs (how to detect early)\r\n- Prevention strategy (how to avoid)\r\n- Which phase should address it\r\n</downstream_consumer>\r\n\r\n<quality_gate>\r\n- [ ] Pitfalls are specific to this domain (not generic advice)\r\n- [ ] Prevention strategies are actionable\r\n- [ ] Phase mapping included where relevant\r\n</quality_gate>\r\n\r\n<output>\r\nWrite to: .planning/research/PITFALLS.md\r\nUse template: ./.gemini/get-shit-done/templates/research-project/PITFALLS.md\r\n</output>\r\n\", subagent_type=\"general-purpose\", model=\"{researcher_model}\", description=\"Pitfalls research\")\r\n```\r\n\r\nAfter all 4 agents complete, spawn synthesizer to create SUMMARY.md:\r\n\r\n```\r\nTask(prompt=\"\r\n<task>\r\nSynthesize research outputs into SUMMARY.md.\r\n</task>\r\n\r\n<files_to_read>\r\n- .planning/research/STACK.md\r\n- .planning/research/FEATURES.md\r\n- .planning/research/ARCHITECTURE.md\r\n- .planning/research/PITFALLS.md\r\n</files_to_read>\r\n\r\n<output>\r\nWrite to: .planning/research/SUMMARY.md\r\nUse template: ./.gemini/get-shit-done/templates/research-project/SUMMARY.md\r\nCommit after writing.\r\n</output>\r\n\", subagent_type=\"gsd-research-synthesizer\", model=\"{synthesizer_model}\", description=\"Synthesize research\")\r\n```\r\n\r\nDisplay research complete banner and key findings:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► RESEARCH COMPLETE ✓\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n## Key Findings\r\n\r\n**Stack:** [from SUMMARY.md]\r\n**Table Stakes:** [from SUMMARY.md]\r\n**Watch Out For:** [from SUMMARY.md]\r\n\r\nFiles: `.planning/research/`\r\n```\r\n\r\n**If \"Skip research\":** Continue to Step 7.\r\n\r\n## 7. Define Requirements\r\n\r\nDisplay stage banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► DEFINING REQUIREMENTS\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n```\r\n\r\n**Load context:**\r\n\r\nRead PROJECT.md and extract:\r\n- Core value (the ONE thing that must work)\r\n- Stated constraints (budget, timeline, tech limitations)\r\n- Any explicit scope boundaries\r\n\r\n**If research exists:** Read research/FEATURES.md and extract feature categories.\r\n\r\n**If auto mode:**\r\n- Auto-include all table stakes features (users expect these)\r\n- Include features explicitly mentioned in provided document\r\n- Auto-defer differentiators not mentioned in document\r\n- Skip per-category AskUserQuestion loops\r\n- Skip \"Any additions?\" question\r\n- Skip requirements approval gate\r\n- Generate REQUIREMENTS.md and commit directly\r\n\r\n**Present features by category (interactive mode only):**\r\n\r\n```\r\nHere are the features for [domain]:\r\n\r\n## Authentication\r\n**Table stakes:**\r\n- Sign up with email/password\r\n- Email verification\r\n- Password reset\r\n- Session management\r\n\r\n**Differentiators:**\r\n- Magic link login\r\n- OAuth (Google, GitHub)\r\n- 2FA\r\n\r\n**Research notes:** [any relevant notes]\r\n\r\n---\r\n\r\n## [Next Category]\r\n...\r\n```\r\n\r\n**If no research:** Gather requirements through conversation instead.\r\n\r\nAsk: \"What are the main things users need to be able to do?\"\r\n\r\nFor each capability mentioned:\r\n- Ask clarifying questions to make it specific\r\n- Probe for related capabilities\r\n- Group into categories\r\n\r\n**Scope each category:**\r\n\r\nFor each category, use AskUserQuestion:\r\n\r\n- header: \"[Category]\" (max 12 chars)\r\n- question: \"Which [category] features are in v1?\"\r\n- multiSelect: true\r\n- options:\r\n  - \"[Feature 1]\" — [brief description]\r\n  - \"[Feature 2]\" — [brief description]\r\n  - \"[Feature 3]\" — [brief description]\r\n  - \"None for v1\" — Defer entire category\r\n\r\nTrack responses:\r\n- Selected features → v1 requirements\r\n- Unselected table stakes → v2 (users expect these)\r\n- Unselected differentiators → out of scope\r\n\r\n**Identify gaps:**\r\n\r\nUse AskUserQuestion:\r\n- header: \"Additions\"\r\n- question: \"Any requirements research missed? (Features specific to your vision)\"\r\n- options:\r\n  - \"No, research covered it\" — Proceed\r\n  - \"Yes, let me add some\" — Capture additions\r\n\r\n**Validate core value:**\r\n\r\nCross-check requirements against Core Value from PROJECT.md. If gaps detected, surface them.\r\n\r\n**Generate REQUIREMENTS.md:**\r\n\r\nCreate `.planning/REQUIREMENTS.md` with:\r\n- v1 Requirements grouped by category (checkboxes, REQ-IDs)\r\n- v2 Requirements (deferred)\r\n- Out of Scope (explicit exclusions with reasoning)\r\n- Traceability section (empty, filled by roadmap)\r\n\r\n**REQ-ID format:** `[CATEGORY]-[NUMBER]` (AUTH-01, CONTENT-02)\r\n\r\n**Requirement quality criteria:**\r\n\r\nGood requirements are:\r\n- **Specific and testable:** \"User can reset password via email link\" (not \"Handle password reset\")\r\n- **User-centric:** \"User can X\" (not \"System does Y\")\r\n- **Atomic:** One capability per requirement (not \"User can login and manage profile\")\r\n- **Independent:** Minimal dependencies on other requirements\r\n\r\nReject vague requirements. Push for specificity:\r\n- \"Handle authentication\" → \"User can log in with email/password and stay logged in across sessions\"\r\n- \"Support sharing\" → \"User can share post via link that opens in recipient's browser\"\r\n\r\n**Present full requirements list (interactive mode only):**\r\n\r\nShow every requirement (not counts) for user confirmation:\r\n\r\n```\r\n## v1 Requirements\r\n\r\n### Authentication\r\n- [ ] **AUTH-01**: User can create account with email/password\r\n- [ ] **AUTH-02**: User can log in and stay logged in across sessions\r\n- [ ] **AUTH-03**: User can log out from any page\r\n\r\n### Content\r\n- [ ] **CONT-01**: User can create posts with text\r\n- [ ] **CONT-02**: User can edit their own posts\r\n\r\n[... full list ...]\r\n\r\n---\r\n\r\nDoes this capture what you're building? (yes / adjust)\r\n```\r\n\r\nIf \"adjust\": Return to scoping.\r\n\r\n**Commit requirements:**\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: define v1 requirements\" --files .planning/REQUIREMENTS.md\r\n```\r\n\r\n## 8. Create Roadmap\r\n\r\nDisplay stage banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► CREATING ROADMAP\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning roadmapper...\r\n```\r\n\r\nSpawn gsd-roadmapper agent with path references:\r\n\r\n```\r\nTask(prompt=\"\r\n<planning_context>\r\n\r\n<files_to_read>\r\n- .planning/PROJECT.md (Project context)\r\n- .planning/REQUIREMENTS.md (v1 Requirements)\r\n- .planning/research/SUMMARY.md (Research findings - if exists)\r\n- .planning/config.json (Depth and mode settings)\r\n</files_to_read>\r\n\r\n</planning_context>\r\n\r\n<instructions>\r\nCreate roadmap:\r\n1. Derive phases from requirements (don't impose structure)\r\n2. Map every v1 requirement to exactly one phase\r\n3. Derive 2-5 success criteria per phase (observable user behaviors)\r\n4. Validate 100% coverage\r\n5. Write files immediately (ROADMAP.md, STATE.md, update REQUIREMENTS.md traceability)\r\n6. Return ROADMAP CREATED with summary\r\n\r\nWrite files first, then return. This ensures artifacts persist even if context is lost.\r\n</instructions>\r\n\", subagent_type=\"gsd-roadmapper\", model=\"{roadmapper_model}\", description=\"Create roadmap\")\r\n```\r\n\r\n**Handle roadmapper return:**\r\n\r\n**If `## ROADMAP BLOCKED`:**\r\n- Present blocker information\r\n- Work with user to resolve\r\n- Re-spawn when resolved\r\n\r\n**If `## ROADMAP CREATED`:**\r\n\r\nRead the created ROADMAP.md and present it nicely inline:\r\n\r\n```\r\n---\r\n\r\n## Proposed Roadmap\r\n\r\n**[N] phases** | **[X] requirements mapped** | All v1 requirements covered ✓\r\n\r\n| # | Phase | Goal | Requirements | Success Criteria |\r\n|---|-------|------|--------------|------------------|\r\n| 1 | [Name] | [Goal] | [REQ-IDs] | [count] |\r\n| 2 | [Name] | [Goal] | [REQ-IDs] | [count] |\r\n| 3 | [Name] | [Goal] | [REQ-IDs] | [count] |\r\n...\r\n\r\n### Phase Details\r\n\r\n**Phase 1: [Name]**\r\nGoal: [goal]\r\nRequirements: [REQ-IDs]\r\nSuccess criteria:\r\n1. [criterion]\r\n2. [criterion]\r\n3. [criterion]\r\n\r\n**Phase 2: [Name]**\r\nGoal: [goal]\r\nRequirements: [REQ-IDs]\r\nSuccess criteria:\r\n1. [criterion]\r\n2. [criterion]\r\n\r\n[... continue for all phases ...]\r\n\r\n---\r\n```\r\n\r\n**If auto mode:** Skip approval gate — auto-approve and commit directly.\r\n\r\n**CRITICAL: Ask for approval before committing (interactive mode only):**\r\n\r\nUse AskUserQuestion:\r\n- header: \"Roadmap\"\r\n- question: \"Does this roadmap structure work for you?\"\r\n- options:\r\n  - \"Approve\" — Commit and continue\r\n  - \"Adjust phases\" — Tell me what to change\r\n  - \"Review full file\" — Show raw ROADMAP.md\r\n\r\n**If \"Approve\":** Continue to commit.\r\n\r\n**If \"Adjust phases\":**\r\n- Get user's adjustment notes\r\n- Re-spawn roadmapper with revision context:\r\n  ```\r\n  Task(prompt=\"\r\n  <revision>\r\n  User feedback on roadmap:\r\n  [user's notes]\r\n\r\n  <files_to_read>\r\n  - .planning/ROADMAP.md (Current roadmap to revise)\r\n  </files_to_read>\r\n\r\n  Update the roadmap based on feedback. Edit files in place.\r\n  Return ROADMAP REVISED with changes made.\r\n  </revision>\r\n  \", subagent_type=\"gsd-roadmapper\", model=\"{roadmapper_model}\", description=\"Revise roadmap\")\r\n  ```\r\n- Present revised roadmap\r\n- Loop until user approves\r\n\r\n**If \"Review full file\":** Display raw `cat .planning/ROADMAP.md`, then re-ask.\r\n\r\n**Commit roadmap (after approval or auto mode):**\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: create roadmap ([N] phases)\" --files .planning/ROADMAP.md .planning/STATE.md .planning/REQUIREMENTS.md\r\n```\r\n\r\n## 9. Done\r\n\r\nPresent completion summary:\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► PROJECT INITIALIZED ✓\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n**[Project Name]**\r\n\r\n| Artifact       | Location                    |\r\n|----------------|-----------------------------|\r\n| Project        | `.planning/PROJECT.md`      |\r\n| Config         | `.planning/config.json`     |\r\n| Research       | `.planning/research/`       |\r\n| Requirements   | `.planning/REQUIREMENTS.md` |\r\n| Roadmap        | `.planning/ROADMAP.md`      |\r\n\r\n**[N] phases** | **[X] requirements** | Ready to build ✓\r\n```\r\n\r\n**If auto mode:**\r\n\r\n```\r\n╔══════════════════════════════════════════╗\r\n║  AUTO-ADVANCING → DISCUSS PHASE 1        ║\r\n╚══════════════════════════════════════════╝\r\n```\r\n\r\nExit skill and invoke SlashCommand(\"/gsd:discuss-phase 1 --auto\")\r\n\r\n**If interactive mode:**\r\n\r\n```\r\n───────────────────────────────────────────────────────────────\r\n\r\n## ▶ Next Up\r\n\r\n**Phase 1: [Phase Name]** — [Goal from ROADMAP.md]\r\n\r\n/gsd:discuss-phase 1 — gather context and clarify approach\r\n\r\n*(/clear first → fresh context window)*\r\n\r\n---\r\n\r\n**Also available:**\r\n- /gsd:plan-phase 1 — skip discussion, plan directly\r\n\r\n───────────────────────────────────────────────────────────────\r\n```\r\n\r\n</process>\r\n\r\n<output>\r\n\r\n- `.planning/PROJECT.md`\r\n- `.planning/config.json`\r\n- `.planning/research/` (if research selected)\r\n  - `STACK.md`\r\n  - `FEATURES.md`\r\n  - `ARCHITECTURE.md`\r\n  - `PITFALLS.md`\r\n  - `SUMMARY.md`\r\n- `.planning/REQUIREMENTS.md`\r\n- `.planning/ROADMAP.md`\r\n- `.planning/STATE.md`\r\n\r\n</output>\r\n\r\n<success_criteria>\r\n\r\n- [ ] .planning/ directory created\r\n- [ ] Git repo initialized\r\n- [ ] Brownfield detection completed\r\n- [ ] Deep questioning completed (threads followed, not rushed)\r\n- [ ] PROJECT.md captures full context → **committed**\r\n- [ ] config.json has workflow mode, depth, parallelization → **committed**\r\n- [ ] Research completed (if selected) — 4 parallel agents spawned → **committed**\r\n- [ ] Requirements gathered (from research or conversation)\r\n- [ ] User scoped each category (v1/v2/out of scope)\r\n- [ ] REQUIREMENTS.md created with REQ-IDs → **committed**\r\n- [ ] gsd-roadmapper spawned with context\r\n- [ ] Roadmap files written immediately (not draft)\r\n- [ ] User feedback incorporated (if any)\r\n- [ ] ROADMAP.md created with phases, requirement mappings, success criteria\r\n- [ ] STATE.md initialized\r\n- [ ] REQUIREMENTS.md traceability updated\r\n- [ ] User knows next step is `/gsd:discuss-phase 1`\r\n\r\n**Atomic commits:** Each phase commits its artifacts immediately. If context is lost, artifacts persist.\r\n\r\n</success_criteria>\r\n"
