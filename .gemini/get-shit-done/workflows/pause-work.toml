prompt = "<purpose>\r\nCreate `.continue-here.md` handoff file to preserve complete work state across sessions. Enables seamless resumption with full context restoration.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"detect\">\r\nFind current phase directory from most recently modified files:\r\n\r\n```bash\r\n# Find most recent phase directory with work\r\nls -lt .planning/phases/*/PLAN.md 2>/dev/null | head -1 | grep -oP 'phases/\\K[^/]+'\r\n```\r\n\r\nIf no active phase detected, ask user which phase they're pausing work on.\r\n</step>\r\n\r\n<step name=\"gather\">\r\n**Collect complete state for handoff:**\r\n\r\n1. **Current position**: Which phase, which plan, which task\r\n2. **Work completed**: What got done this session\r\n3. **Work remaining**: What's left in current plan/phase\r\n4. **Decisions made**: Key decisions and rationale\r\n5. **Blockers/issues**: Anything stuck\r\n6. **Mental context**: The approach, next steps, \"vibe\"\r\n7. **Files modified**: What's changed but not committed\r\n\r\nAsk user for clarifications if needed via conversational questions.\r\n</step>\r\n\r\n<step name=\"write\">\r\n**Write handoff to `.planning/phases/XX-name/.continue-here.md`:**\r\n\r\n```markdown\r\n---\r\nphase: XX-name\r\ntask: 3\r\ntotal_tasks: 7\r\nstatus: in_progress\r\nlast_updated: [timestamp from current-timestamp]\r\n---\r\n\r\n<current_state>\r\n[Where exactly are we? Immediate context]\r\n</current_state>\r\n\r\n<completed_work>\r\n\r\n- Task 1: [name] - Done\r\n- Task 2: [name] - Done\r\n- Task 3: [name] - In progress, [what's done]\r\n</completed_work>\r\n\r\n<remaining_work>\r\n\r\n- Task 3: [what's left]\r\n- Task 4: Not started\r\n- Task 5: Not started\r\n</remaining_work>\r\n\r\n<decisions_made>\r\n\r\n- Decided to use [X] because [reason]\r\n- Chose [approach] over [alternative] because [reason]\r\n</decisions_made>\r\n\r\n<blockers>\r\n- [Blocker 1]: [status/workaround]\r\n</blockers>\r\n\r\n<context>\r\n[Mental state, what were you thinking, the plan]\r\n</context>\r\n\r\n<next_action>\r\nStart with: [specific first action when resuming]\r\n</next_action>\r\n```\r\n\r\nBe specific enough for a fresh Claude to understand immediately.\r\n\r\nUse `current-timestamp` for last_updated field. You can use init todos (which provides timestamps) or call directly:\r\n```bash\r\ntimestamp=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs current-timestamp full --raw)\r\n```\r\n</step>\r\n\r\n<step name=\"commit\">\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"wip: [phase-name] paused at task [X]/[Y]\" --files .planning/phases/*/.continue-here.md\r\n```\r\n</step>\r\n\r\n<step name=\"confirm\">\r\n```\r\n✓ Handoff created: .planning/phases/[XX-name]/.continue-here.md\r\n\r\nCurrent state:\r\n\r\n- Phase: [XX-name]\r\n- Task: [X] of [Y]\r\n- Status: [in_progress/blocked]\r\n- Committed as WIP\r\n\r\nTo resume: /gsd:resume-work\r\n\r\n```\r\n</step>\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] .continue-here.md created in correct phase directory\r\n- [ ] All sections filled with specific content\r\n- [ ] Committed as WIP\r\n- [ ] User knows location and how to resume\r\n</success_criteria>\r\n"
