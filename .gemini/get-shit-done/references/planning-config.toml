prompt = "<planning_config>\r\n\r\nConfiguration options for `.planning/` directory behavior.\r\n\r\n<config_schema>\r\n```json\r\n\"planning\": {\r\n  \"commit_docs\": true,\r\n  \"search_gitignored\": false\r\n},\r\n\"git\": {\r\n  \"branching_strategy\": \"none\",\r\n  \"phase_branch_template\": \"gsd/phase-{phase}-{slug}\",\r\n  \"milestone_branch_template\": \"gsd/{milestone}-{slug}\"\r\n}\r\n```\r\n\r\n| Option | Default | Description |\r\n|--------|---------|-------------|\r\n| `commit_docs` | `true` | Whether to commit planning artifacts to git |\r\n| `search_gitignored` | `false` | Add `--no-ignore` to broad rg searches |\r\n| `git.branching_strategy` | `\"none\"` | Git branching approach: `\"none\"`, `\"phase\"`, or `\"milestone\"` |\r\n| `git.phase_branch_template` | `\"gsd/phase-{phase}-{slug}\"` | Branch template for phase strategy |\r\n| `git.milestone_branch_template` | `\"gsd/{milestone}-{slug}\"` | Branch template for milestone strategy |\r\n</config_schema>\r\n\r\n<commit_docs_behavior>\r\n\r\n**When `commit_docs: true` (default):**\r\n- Planning files committed normally\r\n- SUMMARY.md, STATE.md, ROADMAP.md tracked in git\r\n- Full history of planning decisions preserved\r\n\r\n**When `commit_docs: false`:**\r\n- Skip all `git add`/`git commit` for `.planning/` files\r\n- User must add `.planning/` to `.gitignore`\r\n- Useful for: OSS contributions, client projects, keeping planning private\r\n\r\n**Using gsd-tools.cjs (preferred):**\r\n\r\n```bash\r\n# Commit with automatic commit_docs + gitignore checks:\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: update state\" --files .planning/STATE.md\r\n\r\n# Load config via state load (returns JSON):\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs state load)\r\n# commit_docs is available in the JSON output\r\n\r\n# Or use init commands which include commit_docs:\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init execute-phase \"1\")\r\n# commit_docs is included in all init command outputs\r\n```\r\n\r\n**Auto-detection:** If `.planning/` is gitignored, `commit_docs` is automatically `false` regardless of config.json. This prevents git errors when users have `.planning/` in `.gitignore`.\r\n\r\n**Commit via CLI (handles checks automatically):**\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: update state\" --files .planning/STATE.md\r\n```\r\n\r\nThe CLI checks `commit_docs` config and gitignore status internally — no manual conditionals needed.\r\n\r\n</commit_docs_behavior>\r\n\r\n<search_behavior>\r\n\r\n**When `search_gitignored: false` (default):**\r\n- Standard rg behavior (respects .gitignore)\r\n- Direct path searches work: `rg \"pattern\" .planning/` finds files\r\n- Broad searches skip gitignored: `rg \"pattern\"` skips `.planning/`\r\n\r\n**When `search_gitignored: true`:**\r\n- Add `--no-ignore` to broad rg searches that should include `.planning/`\r\n- Only needed when searching entire repo and expecting `.planning/` matches\r\n\r\n**Note:** Most GSD operations use direct file reads or explicit paths, which work regardless of gitignore status.\r\n\r\n</search_behavior>\r\n\r\n<setup_uncommitted_mode>\r\n\r\nTo use uncommitted mode:\r\n\r\n1. **Set config:**\r\n   ```json\r\n   \"planning\": {\r\n     \"commit_docs\": false,\r\n     \"search_gitignored\": true\r\n   }\r\n   ```\r\n\r\n2. **Add to .gitignore:**\r\n   ```\r\n   .planning/\r\n   ```\r\n\r\n3. **Existing tracked files:** If `.planning/` was previously tracked:\r\n   ```bash\r\n   git rm -r --cached .planning/\r\n   git commit -m \"chore: stop tracking planning docs\"\r\n   ```\r\n\r\n4. **Branch merges:** When using `branching_strategy: phase` or `milestone`, the `complete-milestone` workflow automatically strips `.planning/` files from staging before merge commits when `commit_docs: false`.\r\n\r\n</setup_uncommitted_mode>\r\n\r\n<branching_strategy_behavior>\r\n\r\n**Branching Strategies:**\r\n\r\n| Strategy | When branch created | Branch scope | Merge point |\r\n|----------|---------------------|--------------|-------------|\r\n| `none` | Never | N/A | N/A |\r\n| `phase` | At `execute-phase` start | Single phase | User merges after phase |\r\n| `milestone` | At first `execute-phase` of milestone | Entire milestone | At `complete-milestone` |\r\n\r\n**When `git.branching_strategy: \"none\"` (default):**\r\n- All work commits to current branch\r\n- Standard GSD behavior\r\n\r\n**When `git.branching_strategy: \"phase\"`:**\r\n- `execute-phase` creates/switches to a branch before execution\r\n- Branch name from `phase_branch_template` (e.g., `gsd/phase-03-authentication`)\r\n- All plan commits go to that branch\r\n- User merges branches manually after phase completion\r\n- `complete-milestone` offers to merge all phase branches\r\n\r\n**When `git.branching_strategy: \"milestone\"`:**\r\n- First `execute-phase` of milestone creates the milestone branch\r\n- Branch name from `milestone_branch_template` (e.g., `gsd/v1.0-mvp`)\r\n- All phases in milestone commit to same branch\r\n- `complete-milestone` offers to merge milestone branch to main\r\n\r\n**Template variables:**\r\n\r\n| Variable | Available in | Description |\r\n|----------|--------------|-------------|\r\n| `{phase}` | phase_branch_template | Zero-padded phase number (e.g., \"03\") |\r\n| `{slug}` | Both | Lowercase, hyphenated name |\r\n| `{milestone}` | milestone_branch_template | Milestone version (e.g., \"v1.0\") |\r\n\r\n**Checking the config:**\r\n\r\nUse `init execute-phase` which returns all config as JSON:\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init execute-phase \"1\")\r\n# JSON output includes: branching_strategy, phase_branch_template, milestone_branch_template\r\n```\r\n\r\nOr use `state load` for the config values:\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs state load)\r\n# Parse branching_strategy, phase_branch_template, milestone_branch_template from JSON\r\n```\r\n\r\n**Branch creation:**\r\n\r\n```bash\r\n# For phase strategy\r\nif [ \"$BRANCHING_STRATEGY\" = \"phase\" ]; then\r\n  PHASE_SLUG=$(echo \"$PHASE_NAME\" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')\r\n  BRANCH_NAME=$(echo \"$PHASE_BRANCH_TEMPLATE\" | sed \"s/{phase}/$PADDED_PHASE/g\" | sed \"s/{slug}/$PHASE_SLUG/g\")\r\n  git checkout -b \"$BRANCH_NAME\" 2>/dev/null || git checkout \"$BRANCH_NAME\"\r\nfi\r\n\r\n# For milestone strategy\r\nif [ \"$BRANCHING_STRATEGY\" = \"milestone\" ]; then\r\n  MILESTONE_SLUG=$(echo \"$MILESTONE_NAME\" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')\r\n  BRANCH_NAME=$(echo \"$MILESTONE_BRANCH_TEMPLATE\" | sed \"s/{milestone}/$MILESTONE_VERSION/g\" | sed \"s/{slug}/$MILESTONE_SLUG/g\")\r\n  git checkout -b \"$BRANCH_NAME\" 2>/dev/null || git checkout \"$BRANCH_NAME\"\r\nfi\r\n```\r\n\r\n**Merge options at complete-milestone:**\r\n\r\n| Option | Git command | Result |\r\n|--------|-------------|--------|\r\n| Squash merge (recommended) | `git merge --squash` | Single clean commit per branch |\r\n| Merge with history | `git merge --no-ff` | Preserves all individual commits |\r\n| Delete without merging | `git branch -D` | Discard branch work |\r\n| Keep branches | (none) | Manual handling later |\r\n\r\nSquash merge is recommended — keeps main branch history clean while preserving the full development history in the branch (until deleted).\r\n\r\n**Use cases:**\r\n\r\n| Strategy | Best for |\r\n|----------|----------|\r\n| `none` | Solo development, simple projects |\r\n| `phase` | Code review per phase, granular rollback, team collaboration |\r\n| `milestone` | Release branches, staging environments, PR per version |\r\n\r\n</branching_strategy_behavior>\r\n\r\n</planning_config>\r\n"
