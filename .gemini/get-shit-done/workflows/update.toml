prompt = "<purpose>\r\nCheck for GSD updates via npm, display changelog for versions between installed and latest, obtain user confirmation, and execute clean installation with cache clearing.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"get_installed_version\">\r\nDetect whether GSD is installed locally or globally by checking both locations:\r\n\r\n```bash\r\n# Check local first (takes priority)\r\n# Paths templated at install time for runtime compatibility\r\nif [ -f ./.gemini/get-shit-done/VERSION ]; then\r\n  cat ./.gemini/get-shit-done/VERSION\r\n  echo \"LOCAL\"\r\nelif [ -f ./.gemini/get-shit-done/VERSION ]; then\r\n  cat ./.gemini/get-shit-done/VERSION\r\n  echo \"GLOBAL\"\r\nelse\r\n  echo \"UNKNOWN\"\r\nfi\r\n```\r\n\r\nParse output:\r\n- If last line is \"LOCAL\": installed version is first line, use `--local` flag for update\r\n- If last line is \"GLOBAL\": installed version is first line, use `--global` flag for update\r\n- If \"UNKNOWN\": proceed to install step (treat as version 0.0.0)\r\n\r\n**If VERSION file missing:**\r\n```\r\n## GSD Update\r\n\r\n**Installed version:** Unknown\r\n\r\nYour installation doesn't include version tracking.\r\n\r\nRunning fresh install...\r\n```\r\n\r\nProceed to install step (treat as version 0.0.0 for comparison).\r\n</step>\r\n\r\n<step name=\"check_latest_version\">\r\nCheck npm for latest version:\r\n\r\n```bash\r\nnpm view get-shit-done-cc version 2>/dev/null\r\n```\r\n\r\n**If npm check fails:**\r\n```\r\nCouldn't check for updates (offline or npm unavailable).\r\n\r\nTo update manually: `npx get-shit-done-cc --global`\r\n```\r\n\r\nExit.\r\n</step>\r\n\r\n<step name=\"compare_versions\">\r\nCompare installed vs latest:\r\n\r\n**If installed == latest:**\r\n```\r\n## GSD Update\r\n\r\n**Installed:** X.Y.Z\r\n**Latest:** X.Y.Z\r\n\r\nYou're already on the latest version.\r\n```\r\n\r\nExit.\r\n\r\n**If installed > latest:**\r\n```\r\n## GSD Update\r\n\r\n**Installed:** X.Y.Z\r\n**Latest:** A.B.C\r\n\r\nYou're ahead of the latest release (development version?).\r\n```\r\n\r\nExit.\r\n</step>\r\n\r\n<step name=\"show_changes_and_confirm\">\r\n**If update available**, fetch and show what's new BEFORE updating:\r\n\r\n1. Fetch changelog from GitHub raw URL\r\n2. Extract entries between installed and latest versions\r\n3. Display preview and ask for confirmation:\r\n\r\n```\r\n## GSD Update Available\r\n\r\n**Installed:** 1.5.10\r\n**Latest:** 1.5.15\r\n\r\n### What's New\r\n────────────────────────────────────────────────────────────\r\n\r\n## [1.5.15] - 2026-01-20\r\n\r\n### Added\r\n- Feature X\r\n\r\n## [1.5.14] - 2026-01-18\r\n\r\n### Fixed\r\n- Bug fix Y\r\n\r\n────────────────────────────────────────────────────────────\r\n\r\n⚠️  **Note:** The installer performs a clean install of GSD folders:\r\n- `commands/gsd/` will be wiped and replaced\r\n- `get-shit-done/` will be wiped and replaced\r\n- `agents/gsd-*` files will be replaced\r\n\r\n(Paths are relative to your install location: `./.gemini/` for global, `./.gemini/` for local)\r\n\r\nYour custom files in other locations are preserved:\r\n- Custom commands not in `commands/gsd/` ✓\r\n- Custom agents not prefixed with `gsd-` ✓\r\n- Custom hooks ✓\r\n- Your CLAUDE.md files ✓\r\n\r\nIf you've modified any GSD files directly, they'll be automatically backed up to `gsd-local-patches/` and can be reapplied with `/gsd:reapply-patches` after the update.\r\n```\r\n\r\nUse AskUserQuestion:\r\n- Question: \"Proceed with update?\"\r\n- Options:\r\n  - \"Yes, update now\"\r\n  - \"No, cancel\"\r\n\r\n**If user cancels:** Exit.\r\n</step>\r\n\r\n<step name=\"run_update\">\r\nRun the update using the install type detected in step 1:\r\n\r\n**If LOCAL install:**\r\n```bash\r\nnpx get-shit-done-cc --local\r\n```\r\n\r\n**If GLOBAL install (or unknown):**\r\n```bash\r\nnpx get-shit-done-cc --global\r\n```\r\n\r\nCapture output. If install fails, show error and exit.\r\n\r\nClear the update cache so statusline indicator disappears:\r\n\r\n**If LOCAL install:**\r\n```bash\r\nrm -f ./.gemini/cache/gsd-update-check.json\r\n```\r\n\r\n**If GLOBAL install:**\r\n```bash\r\nrm -f ./.gemini/cache/gsd-update-check.json\r\n```\r\n(Paths are templated at install time for runtime compatibility)\r\n</step>\r\n\r\n<step name=\"display_result\">\r\nFormat completion message (changelog was already shown in confirmation step):\r\n\r\n```\r\n╔═══════════════════════════════════════════════════════════╗\r\n║  GSD Updated: v1.5.10 → v1.5.15                           ║\r\n╚═══════════════════════════════════════════════════════════╝\r\n\r\n⚠️  Restart Claude Code to pick up the new commands.\r\n\r\n[View full changelog](https://github.com/glittercowboy/get-shit-done/blob/main/CHANGELOG.md)\r\n```\r\n</step>\r\n\r\n\r\n<step name=\"check_local_patches\">\r\nAfter update completes, check if the installer detected and backed up any locally modified files:\r\n\r\nCheck for gsd-local-patches/backup-meta.json in the config directory.\r\n\r\n**If patches found:**\r\n\r\n```\r\nLocal patches were backed up before the update.\r\nRun /gsd:reapply-patches to merge your modifications into the new version.\r\n```\r\n\r\n**If no patches:** Continue normally.\r\n</step>\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] Installed version read correctly\r\n- [ ] Latest version checked via npm\r\n- [ ] Update skipped if already current\r\n- [ ] Changelog fetched and displayed BEFORE update\r\n- [ ] Clean install warning shown\r\n- [ ] User confirmation obtained\r\n- [ ] Update executed successfully\r\n- [ ] Restart reminder shown\r\n</success_criteria>\r\n"
