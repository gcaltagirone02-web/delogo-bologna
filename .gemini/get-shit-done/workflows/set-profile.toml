prompt = "<purpose>\r\nSwitch the model profile used by GSD agents. Controls which Claude model each agent uses, balancing quality vs token spend.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"validate\">\r\nValidate argument:\r\n\r\n```\r\nif $ARGUMENTS.profile not in [\"quality\", \"balanced\", \"budget\"]:\r\n  Error: Invalid profile \"$ARGUMENTS.profile\"\r\n  Valid profiles: quality, balanced, budget\r\n  EXIT\r\n```\r\n</step>\r\n\r\n<step name=\"ensure_and_load_config\">\r\nEnsure config exists and load current state:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs config-ensure-section\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs state load)\r\n```\r\n\r\nThis creates `.planning/config.json` with defaults if missing and loads current config.\r\n</step>\r\n\r\n<step name=\"update_config\">\r\nRead current config from state load or directly:\r\n\r\nUpdate `model_profile` field:\r\n```json\r\n{\r\n  \"model_profile\": \"$ARGUMENTS.profile\"\r\n}\r\n```\r\n\r\nWrite updated config back to `.planning/config.json`.\r\n</step>\r\n\r\n<step name=\"confirm\">\r\nDisplay confirmation with model table for selected profile:\r\n\r\n```\r\n✓ Model profile set to: $ARGUMENTS.profile\r\n\r\nAgents will now use:\r\n\r\n[Show table from MODEL_PROFILES in gsd-tools.cjs for selected profile]\r\n\r\nExample:\r\n| Agent | Model |\r\n|-------|-------|\r\n| gsd-planner | opus |\r\n| gsd-executor | sonnet |\r\n| gsd-verifier | haiku |\r\n| ... | ... |\r\n\r\nNext spawned agents will use the new profile.\r\n```\r\n\r\nMap profile names:\r\n- quality: use \"quality\" column from MODEL_PROFILES\r\n- balanced: use \"balanced\" column from MODEL_PROFILES\r\n- budget: use \"budget\" column from MODEL_PROFILES\r\n</step>\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] Argument validated\r\n- [ ] Config file ensured\r\n- [ ] Config updated with new model_profile\r\n- [ ] Confirmation displayed with model table\r\n</success_criteria>\r\n"
