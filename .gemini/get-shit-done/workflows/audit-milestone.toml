prompt = "<purpose>\r\nVerify milestone achieved its definition of done by aggregating phase verifications, checking cross-phase integration, and assessing requirements coverage. Reads existing VERIFICATION.md files (phases already verified during execute-phase), aggregates tech debt and deferred gaps, then spawns integration checker for cross-phase wiring.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n## 0. Initialize Milestone Context\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init milestone-op)\r\n```\r\n\r\nExtract from init JSON: `milestone_version`, `milestone_name`, `phase_count`, `completed_phases`, `commit_docs`.\r\n\r\nResolve integration checker model:\r\n```bash\r\nCHECKER_MODEL=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs resolve-model gsd-integration-checker --raw)\r\n```\r\n\r\n## 1. Determine Milestone Scope\r\n\r\n```bash\r\n# Get phases in milestone (sorted numerically, handles decimals)\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs phases list\r\n```\r\n\r\n- Parse version from arguments or detect current from ROADMAP.md\r\n- Identify all phase directories in scope\r\n- Extract milestone definition of done from ROADMAP.md\r\n- Extract requirements mapped to this milestone from REQUIREMENTS.md\r\n\r\n## 2. Read All Phase Verifications\r\n\r\nFor each phase directory, read the VERIFICATION.md:\r\n\r\n```bash\r\n# For each phase, use find-phase to resolve the directory (handles archived phases)\r\nPHASE_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs find-phase 01 --raw)\r\n# Extract directory from JSON, then read VERIFICATION.md from that directory\r\n# Repeat for each phase number from ROADMAP.md\r\n```\r\n\r\nFrom each VERIFICATION.md, extract:\r\n- **Status:** passed | gaps_found\r\n- **Critical gaps:** (if any — these are blockers)\r\n- **Non-critical gaps:** tech debt, deferred items, warnings\r\n- **Anti-patterns found:** TODOs, stubs, placeholders\r\n- **Requirements coverage:** which requirements satisfied/blocked\r\n\r\nIf a phase is missing VERIFICATION.md, flag it as \"unverified phase\" — this is a blocker.\r\n\r\n## 3. Spawn Integration Checker\r\n\r\nWith phase context collected:\r\n\r\nExtract `MILESTONE_REQ_IDS` from REQUIREMENTS.md traceability table — all REQ-IDs assigned to phases in this milestone.\r\n\r\n```\r\nTask(\r\n  prompt=\"Check cross-phase integration and E2E flows.\r\n\r\nPhases: {phase_dirs}\r\nPhase exports: {from SUMMARYs}\r\nAPI routes: {routes created}\r\n\r\nMilestone Requirements:\r\n{MILESTONE_REQ_IDS — list each REQ-ID with description and assigned phase}\r\n\r\nMUST map each integration finding to affected requirement IDs where applicable.\r\n\r\nVerify cross-phase wiring and E2E user flows.\",\r\n  subagent_type=\"gsd-integration-checker\",\r\n  model=\"{integration_checker_model}\"\r\n)\r\n```\r\n\r\n## 4. Collect Results\r\n\r\nCombine:\r\n- Phase-level gaps and tech debt (from step 2)\r\n- Integration checker's report (wiring gaps, broken flows)\r\n\r\n## 5. Check Requirements Coverage (3-Source Cross-Reference)\r\n\r\nMUST cross-reference three independent sources for each requirement:\r\n\r\n### 5a. Parse REQUIREMENTS.md Traceability Table\r\n\r\nExtract all REQ-IDs mapped to milestone phases from the traceability table:\r\n- Requirement ID, description, assigned phase, current status, checked-off state (`[x]` vs `[ ]`)\r\n\r\n### 5b. Parse Phase VERIFICATION.md Requirements Tables\r\n\r\nFor each phase's VERIFICATION.md, extract the expanded requirements table:\r\n- Requirement | Source Plan | Description | Status | Evidence\r\n- Map each entry back to its REQ-ID\r\n\r\n### 5c. Extract SUMMARY.md Frontmatter Cross-Check\r\n\r\nFor each phase's SUMMARY.md, extract `requirements-completed` from YAML frontmatter:\r\n```bash\r\nfor summary in .planning/phases/*-*/*-SUMMARY.md; do\r\n  node ./.gemini/get-shit-done/bin/gsd-tools.cjs summary-extract \"$summary\" --fields requirements_completed | jq -r '.requirements_completed'\r\ndone\r\n```\r\n\r\n### 5d. Status Determination Matrix\r\n\r\nFor each REQ-ID, determine status using all three sources:\r\n\r\n| VERIFICATION.md Status | SUMMARY Frontmatter | REQUIREMENTS.md | → Final Status |\r\n|------------------------|---------------------|-----------------|----------------|\r\n| passed                 | listed              | `[x]`           | **satisfied**  |\r\n| passed                 | listed              | `[ ]`           | **satisfied** (update checkbox) |\r\n| passed                 | missing             | any             | **partial** (verify manually) |\r\n| gaps_found             | any                 | any             | **unsatisfied** |\r\n| missing                | listed              | any             | **partial** (verification gap) |\r\n| missing                | missing             | any             | **unsatisfied** |\r\n\r\n### 5e. FAIL Gate and Orphan Detection\r\n\r\n**REQUIRED:** Any `unsatisfied` requirement MUST force `gaps_found` status on the milestone audit.\r\n\r\n**Orphan detection:** Requirements present in REQUIREMENTS.md traceability table but absent from ALL phase VERIFICATION.md files MUST be flagged as orphaned. Orphaned requirements are treated as `unsatisfied` — they were assigned but never verified by any phase.\r\n\r\n## 6. Aggregate into v{version}-MILESTONE-AUDIT.md\r\n\r\nCreate `.planning/v{version}-v{version}-MILESTONE-AUDIT.md` with:\r\n\r\n```yaml\r\n---\r\nmilestone: {version}\r\naudited: {timestamp}\r\nstatus: passed | gaps_found | tech_debt\r\nscores:\r\n  requirements: N/M\r\n  phases: N/M\r\n  integration: N/M\r\n  flows: N/M\r\ngaps:  # Critical blockers\r\n  requirements:\r\n    - id: \"{REQ-ID}\"\r\n      status: \"unsatisfied | partial | orphaned\"\r\n      phase: \"{assigned phase}\"\r\n      claimed_by_plans: [\"{plan files that reference this requirement}\"]\r\n      completed_by_plans: [\"{plan files whose SUMMARY marks it complete}\"]\r\n      verification_status: \"passed | gaps_found | missing | orphaned\"\r\n      evidence: \"{specific evidence or lack thereof}\"\r\n  integration: [...]\r\n  flows: [...]\r\ntech_debt:  # Non-critical, deferred\r\n  - phase: 01-auth\r\n    items:\r\n      - \"TODO: add rate limiting\"\r\n      - \"Warning: no password strength validation\"\r\n  - phase: 03-dashboard\r\n    items:\r\n      - \"Deferred: mobile responsive layout\"\r\n---\r\n```\r\n\r\nPlus full markdown report with tables for requirements, phases, integration, tech debt.\r\n\r\n**Status values:**\r\n- `passed` — all requirements met, no critical gaps, minimal tech debt\r\n- `gaps_found` — critical blockers exist\r\n- `tech_debt` — no blockers but accumulated deferred items need review\r\n\r\n## 7. Present Results\r\n\r\nRoute by status (see `<offer_next>`).\r\n\r\n</process>\r\n\r\n<offer_next>\r\nOutput this markdown directly (not as a code block). Route based on status:\r\n\r\n---\r\n\r\n**If passed:**\r\n\r\n## ✓ Milestone {version} — Audit Passed\r\n\r\n**Score:** {N}/{M} requirements satisfied\r\n**Report:** .planning/v{version}-MILESTONE-AUDIT.md\r\n\r\nAll requirements covered. Cross-phase integration verified. E2E flows complete.\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n## ▶ Next Up\r\n\r\n**Complete milestone** — archive and tag\r\n\r\n/gsd:complete-milestone {version}\r\n\r\n*(/clear first → fresh context window)*\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n---\r\n\r\n**If gaps_found:**\r\n\r\n## ⚠ Milestone {version} — Gaps Found\r\n\r\n**Score:** {N}/{M} requirements satisfied\r\n**Report:** .planning/v{version}-MILESTONE-AUDIT.md\r\n\r\n### Unsatisfied Requirements\r\n\r\n{For each unsatisfied requirement:}\r\n- **{REQ-ID}: {description}** (Phase {X})\r\n  - {reason}\r\n\r\n### Cross-Phase Issues\r\n\r\n{For each integration gap:}\r\n- **{from} → {to}:** {issue}\r\n\r\n### Broken Flows\r\n\r\n{For each flow gap:}\r\n- **{flow name}:** breaks at {step}\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n## ▶ Next Up\r\n\r\n**Plan gap closure** — create phases to complete milestone\r\n\r\n/gsd:plan-milestone-gaps\r\n\r\n*(/clear first → fresh context window)*\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n**Also available:**\r\n- cat .planning/v{version}-MILESTONE-AUDIT.md — see full report\r\n- /gsd:complete-milestone {version} — proceed anyway (accept tech debt)\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n---\r\n\r\n**If tech_debt (no blockers but accumulated debt):**\r\n\r\n## ⚡ Milestone {version} — Tech Debt Review\r\n\r\n**Score:** {N}/{M} requirements satisfied\r\n**Report:** .planning/v{version}-MILESTONE-AUDIT.md\r\n\r\nAll requirements met. No critical blockers. Accumulated tech debt needs review.\r\n\r\n### Tech Debt by Phase\r\n\r\n{For each phase with debt:}\r\n**Phase {X}: {name}**\r\n- {item 1}\r\n- {item 2}\r\n\r\n### Total: {N} items across {M} phases\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n## ▶ Options\r\n\r\n**A. Complete milestone** — accept debt, track in backlog\r\n\r\n/gsd:complete-milestone {version}\r\n\r\n**B. Plan cleanup phase** — address debt before completing\r\n\r\n/gsd:plan-milestone-gaps\r\n\r\n*(/clear first → fresh context window)*\r\n\r\n───────────────────────────────────────────────────────────────\r\n</offer_next>\r\n\r\n<success_criteria>\r\n- [ ] Milestone scope identified\r\n- [ ] All phase VERIFICATION.md files read\r\n- [ ] SUMMARY.md `requirements-completed` frontmatter extracted for each phase\r\n- [ ] REQUIREMENTS.md traceability table parsed for all milestone REQ-IDs\r\n- [ ] 3-source cross-reference completed (VERIFICATION + SUMMARY + traceability)\r\n- [ ] Orphaned requirements detected (in traceability but absent from all VERIFICATIONs)\r\n- [ ] Tech debt and deferred gaps aggregated\r\n- [ ] Integration checker spawned with milestone requirement IDs\r\n- [ ] v{version}-MILESTONE-AUDIT.md created with structured requirement gap objects\r\n- [ ] FAIL gate enforced — any unsatisfied requirement forces gaps_found status\r\n- [ ] Results presented with actionable next steps\r\n</success_criteria>\r\n"
