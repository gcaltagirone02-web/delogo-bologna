prompt = "<overview>\r\nGit integration for GSD framework.\r\n</overview>\r\n\r\n<core_principle>\r\n\r\n**Commit outcomes, not process.**\r\n\r\nThe git log should read like a changelog of what shipped, not a diary of planning activity.\r\n</core_principle>\r\n\r\n<commit_points>\r\n\r\n| Event                   | Commit? | Why                                              |\r\n| ----------------------- | ------- | ------------------------------------------------ |\r\n| BRIEF + ROADMAP created | YES     | Project initialization                           |\r\n| PLAN.md created         | NO      | Intermediate - commit with plan completion       |\r\n| RESEARCH.md created     | NO      | Intermediate                                     |\r\n| DISCOVERY.md created    | NO      | Intermediate                                     |\r\n| **Task completed**      | YES     | Atomic unit of work (1 commit per task)         |\r\n| **Plan completed**      | YES     | Metadata commit (SUMMARY + STATE + ROADMAP)     |\r\n| Handoff created         | YES     | WIP state preserved                              |\r\n\r\n</commit_points>\r\n\r\n<git_check>\r\n\r\n```bash\r\n[ -d .git ] && echo \"GIT_EXISTS\" || echo \"NO_GIT\"\r\n```\r\n\r\nIf NO_GIT: Run `git init` silently. GSD projects always get their own repo.\r\n</git_check>\r\n\r\n<commit_formats>\r\n\r\n<format name=\"initialization\">\r\n## Project Initialization (brief + roadmap together)\r\n\r\n```\r\ndocs: initialize [project-name] ([N] phases)\r\n\r\n[One-liner from PROJECT.md]\r\n\r\nPhases:\r\n1. [phase-name]: [goal]\r\n2. [phase-name]: [goal]\r\n3. [phase-name]: [goal]\r\n```\r\n\r\nWhat to commit:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: initialize [project-name] ([N] phases)\" --files .planning/\r\n```\r\n\r\n</format>\r\n\r\n<format name=\"task-completion\">\r\n## Task Completion (During Plan Execution)\r\n\r\nEach task gets its own commit immediately after completion.\r\n\r\n```\r\n{type}({phase}-{plan}): {task-name}\r\n\r\n- [Key change 1]\r\n- [Key change 2]\r\n- [Key change 3]\r\n```\r\n\r\n**Commit types:**\r\n- `feat` - New feature/functionality\r\n- `fix` - Bug fix\r\n- `test` - Test-only (TDD RED phase)\r\n- `refactor` - Code cleanup (TDD REFACTOR phase)\r\n- `perf` - Performance improvement\r\n- `chore` - Dependencies, config, tooling\r\n\r\n**Examples:**\r\n\r\n```bash\r\n# Standard task\r\ngit add src/api/auth.ts src/types/user.ts\r\ngit commit -m \"feat(08-02): create user registration endpoint\r\n\r\n- POST /auth/register validates email and password\r\n- Checks for duplicate users\r\n- Returns JWT token on success\r\n\"\r\n\r\n# TDD task - RED phase\r\ngit add src/__tests__/jwt.test.ts\r\ngit commit -m \"test(07-02): add failing test for JWT generation\r\n\r\n- Tests token contains user ID claim\r\n- Tests token expires in 1 hour\r\n- Tests signature verification\r\n\"\r\n\r\n# TDD task - GREEN phase\r\ngit add src/utils/jwt.ts\r\ngit commit -m \"feat(07-02): implement JWT generation\r\n\r\n- Uses jose library for signing\r\n- Includes user ID and expiry claims\r\n- Signs with HS256 algorithm\r\n\"\r\n```\r\n\r\n</format>\r\n\r\n<format name=\"plan-completion\">\r\n## Plan Completion (After All Tasks Done)\r\n\r\nAfter all tasks committed, one final metadata commit captures plan completion.\r\n\r\n```\r\ndocs({phase}-{plan}): complete [plan-name] plan\r\n\r\nTasks completed: [N]/[N]\r\n- [Task 1 name]\r\n- [Task 2 name]\r\n- [Task 3 name]\r\n\r\nSUMMARY: .planning/phases/XX-name/{phase}-{plan}-SUMMARY.md\r\n```\r\n\r\nWhat to commit:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs({phase}-{plan}): complete [plan-name] plan\" --files .planning/phases/XX-name/{phase}-{plan}-PLAN.md .planning/phases/XX-name/{phase}-{plan}-SUMMARY.md .planning/STATE.md .planning/ROADMAP.md\r\n```\r\n\r\n**Note:** Code files NOT included - already committed per-task.\r\n\r\n</format>\r\n\r\n<format name=\"handoff\">\r\n## Handoff (WIP)\r\n\r\n```\r\nwip: [phase-name] paused at task [X]/[Y]\r\n\r\nCurrent: [task name]\r\n[If blocked:] Blocked: [reason]\r\n```\r\n\r\nWhat to commit:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"wip: [phase-name] paused at task [X]/[Y]\" --files .planning/\r\n```\r\n\r\n</format>\r\n</commit_formats>\r\n\r\n<example_log>\r\n\r\n**Old approach (per-plan commits):**\r\n```\r\na7f2d1 feat(checkout): Stripe payments with webhook verification\r\n3e9c4b feat(products): catalog with search, filters, and pagination\r\n8a1b2c feat(auth): JWT with refresh rotation using jose\r\n5c3d7e feat(foundation): Next.js 15 + Prisma + Tailwind scaffold\r\n2f4a8d docs: initialize ecommerce-app (5 phases)\r\n```\r\n\r\n**New approach (per-task commits):**\r\n```\r\n# Phase 04 - Checkout\r\n1a2b3c docs(04-01): complete checkout flow plan\r\n4d5e6f feat(04-01): add webhook signature verification\r\n7g8h9i feat(04-01): implement payment session creation\r\n0j1k2l feat(04-01): create checkout page component\r\n\r\n# Phase 03 - Products\r\n3m4n5o docs(03-02): complete product listing plan\r\n6p7q8r feat(03-02): add pagination controls\r\n9s0t1u feat(03-02): implement search and filters\r\n2v3w4x feat(03-01): create product catalog schema\r\n\r\n# Phase 02 - Auth\r\n5y6z7a docs(02-02): complete token refresh plan\r\n8b9c0d feat(02-02): implement refresh token rotation\r\n1e2f3g test(02-02): add failing test for token refresh\r\n4h5i6j docs(02-01): complete JWT setup plan\r\n7k8l9m feat(02-01): add JWT generation and validation\r\n0n1o2p chore(02-01): install jose library\r\n\r\n# Phase 01 - Foundation\r\n3q4r5s docs(01-01): complete scaffold plan\r\n6t7u8v feat(01-01): configure Tailwind and globals\r\n9w0x1y feat(01-01): set up Prisma with database\r\n2z3a4b feat(01-01): create Next.js 15 project\r\n\r\n# Initialization\r\n5c6d7e docs: initialize ecommerce-app (5 phases)\r\n```\r\n\r\nEach plan produces 2-4 commits (tasks + metadata). Clear, granular, bisectable.\r\n\r\n</example_log>\r\n\r\n<anti_patterns>\r\n\r\n**Still don't commit (intermediate artifacts):**\r\n- PLAN.md creation (commit with plan completion)\r\n- RESEARCH.md (intermediate)\r\n- DISCOVERY.md (intermediate)\r\n- Minor planning tweaks\r\n- \"Fixed typo in roadmap\"\r\n\r\n**Do commit (outcomes):**\r\n- Each task completion (feat/fix/test/refactor)\r\n- Plan completion metadata (docs)\r\n- Project initialization (docs)\r\n\r\n**Key principle:** Commit working code and shipped outcomes, not planning process.\r\n\r\n</anti_patterns>\r\n\r\n<commit_strategy_rationale>\r\n\r\n## Why Per-Task Commits?\r\n\r\n**Context engineering for AI:**\r\n- Git history becomes primary context source for future Claude sessions\r\n- `git log --grep=\"{phase}-{plan}\"` shows all work for a plan\r\n- `git diff <hash>^..<hash>` shows exact changes per task\r\n- Less reliance on parsing SUMMARY.md = more context for actual work\r\n\r\n**Failure recovery:**\r\n- Task 1 committed ✅, Task 2 failed ❌\r\n- Claude in next session: sees task 1 complete, can retry task 2\r\n- Can `git reset --hard` to last successful task\r\n\r\n**Debugging:**\r\n- `git bisect` finds exact failing task, not just failing plan\r\n- `git blame` traces line to specific task context\r\n- Each commit is independently revertable\r\n\r\n**Observability:**\r\n- Solo developer + Claude workflow benefits from granular attribution\r\n- Atomic commits are git best practice\r\n- \"Commit noise\" irrelevant when consumer is Claude, not humans\r\n\r\n</commit_strategy_rationale>\r\n"
