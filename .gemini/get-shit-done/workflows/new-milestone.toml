prompt = "<purpose>\r\n\r\nStart a new milestone cycle for an existing project. Loads project context, gathers milestone goals (from MILESTONE-CONTEXT.md or conversation), updates PROJECT.md and STATE.md, optionally runs parallel research, defines scoped requirements with REQ-IDs, spawns the roadmapper to create phased execution plan, and commits all artifacts. Brownfield equivalent of new-project.\r\n\r\n</purpose>\r\n\r\n<required_reading>\r\n\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n\r\n</required_reading>\r\n\r\n<process>\r\n\r\n## 1. Load Context\r\n\r\n- Read PROJECT.md (existing project, validated requirements, decisions)\r\n- Read MILESTONES.md (what shipped previously)\r\n- Read STATE.md (pending todos, blockers)\r\n- Check for MILESTONE-CONTEXT.md (from /gsd:discuss-milestone)\r\n\r\n## 2. Gather Milestone Goals\r\n\r\n**If MILESTONE-CONTEXT.md exists:**\r\n- Use features and scope from discuss-milestone\r\n- Present summary for confirmation\r\n\r\n**If no context file:**\r\n- Present what shipped in last milestone\r\n- Ask: \"What do you want to build next?\"\r\n- Use AskUserQuestion to explore features, priorities, constraints, scope\r\n\r\n## 3. Determine Milestone Version\r\n\r\n- Parse last version from MILESTONES.md\r\n- Suggest next version (v1.0 → v1.1, or v2.0 for major)\r\n- Confirm with user\r\n\r\n## 4. Update PROJECT.md\r\n\r\nAdd/update:\r\n\r\n```markdown\r\n## Current Milestone: v[X.Y] [Name]\r\n\r\n**Goal:** [One sentence describing milestone focus]\r\n\r\n**Target features:**\r\n- [Feature 1]\r\n- [Feature 2]\r\n- [Feature 3]\r\n```\r\n\r\nUpdate Active requirements section and \"Last updated\" footer.\r\n\r\n## 5. Update STATE.md\r\n\r\n```markdown\r\n## Current Position\r\n\r\nPhase: Not started (defining requirements)\r\nPlan: —\r\nStatus: Defining requirements\r\nLast activity: [today] — Milestone v[X.Y] started\r\n```\r\n\r\nKeep Accumulated Context section from previous milestone.\r\n\r\n## 6. Cleanup and Commit\r\n\r\nDelete MILESTONE-CONTEXT.md if exists (consumed).\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: start milestone v[X.Y] [Name]\" --files .planning/PROJECT.md .planning/STATE.md\r\n```\r\n\r\n## 7. Load Context and Resolve Models\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init new-milestone)\r\n```\r\n\r\nExtract from init JSON: `researcher_model`, `synthesizer_model`, `roadmapper_model`, `commit_docs`, `research_enabled`, `current_milestone`, `project_exists`, `roadmap_exists`.\r\n\r\n## 8. Research Decision\r\n\r\nAskUserQuestion: \"Research the domain ecosystem for new features before defining requirements?\"\r\n- \"Research first (Recommended)\" — Discover patterns, features, architecture for NEW capabilities\r\n- \"Skip research\" — Go straight to requirements\r\n\r\n**Persist choice to config** (so future `/gsd:plan-phase` honors it):\r\n\r\n```bash\r\n# If \"Research first\": persist true\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs config-set workflow.research true\r\n\r\n# If \"Skip research\": persist false\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs config-set workflow.research false\r\n```\r\n\r\n**If \"Research first\":**\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► RESEARCHING\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning 4 researchers in parallel...\r\n  → Stack, Features, Architecture, Pitfalls\r\n```\r\n\r\n```bash\r\nmkdir -p .planning/research\r\n```\r\n\r\nSpawn 4 parallel gsd-project-researcher agents. Each uses this template with dimension-specific fields:\r\n\r\n**Common structure for all 4 researchers:**\r\n```\r\nTask(prompt=\"\r\n<research_type>Project Research — {DIMENSION} for [new features].</research_type>\r\n\r\n<milestone_context>\r\nSUBSEQUENT MILESTONE — Adding [target features] to existing app.\r\n{EXISTING_CONTEXT}\r\nFocus ONLY on what's needed for the NEW features.\r\n</milestone_context>\r\n\r\n<question>{QUESTION}</question>\r\n\r\n<files_to_read>\r\n- .planning/PROJECT.md (Project context)\r\n</files_to_read>\r\n\r\n<downstream_consumer>{CONSUMER}</downstream_consumer>\r\n\r\n<quality_gate>{GATES}</quality_gate>\r\n\r\n<output>\r\nWrite to: .planning/research/{FILE}\r\nUse template: ./.gemini/get-shit-done/templates/research-project/{FILE}\r\n</output>\r\n\", subagent_type=\"gsd-project-researcher\", model=\"{researcher_model}\", description=\"{DIMENSION} research\")\r\n```\r\n\r\n**Dimension-specific fields:**\r\n\r\n| Field | Stack | Features | Architecture | Pitfalls |\r\n|-------|-------|----------|-------------|----------|\r\n| EXISTING_CONTEXT | Existing validated capabilities (DO NOT re-research): [from PROJECT.md] | Existing features (already built): [from PROJECT.md] | Existing architecture: [from PROJECT.md or codebase map] | Focus on common mistakes when ADDING these features to existing system |\r\n| QUESTION | What stack additions/changes are needed for [new features]? | How do [target features] typically work? Expected behavior? | How do [target features] integrate with existing architecture? | Common mistakes when adding [target features] to [domain]? |\r\n| CONSUMER | Specific libraries with versions for NEW capabilities, integration points, what NOT to add | Table stakes vs differentiators vs anti-features, complexity noted, dependencies on existing | Integration points, new components, data flow changes, suggested build order | Warning signs, prevention strategy, which phase should address it |\r\n| GATES | Versions current (verify with Context7), rationale explains WHY, integration considered | Categories clear, complexity noted, dependencies identified | Integration points identified, new vs modified explicit, build order considers deps | Pitfalls specific to adding these features, integration pitfalls covered, prevention actionable |\r\n| FILE | STACK.md | FEATURES.md | ARCHITECTURE.md | PITFALLS.md |\r\n\r\nAfter all 4 complete, spawn synthesizer:\r\n\r\n```\r\nTask(prompt=\"\r\nSynthesize research outputs into SUMMARY.md.\r\n\r\n<files_to_read>\r\n- .planning/research/STACK.md\r\n- .planning/research/FEATURES.md\r\n- .planning/research/ARCHITECTURE.md\r\n- .planning/research/PITFALLS.md\r\n</files_to_read>\r\n\r\nWrite to: .planning/research/SUMMARY.md\r\nUse template: ./.gemini/get-shit-done/templates/research-project/SUMMARY.md\r\nCommit after writing.\r\n\", subagent_type=\"gsd-research-synthesizer\", model=\"{synthesizer_model}\", description=\"Synthesize research\")\r\n```\r\n\r\nDisplay key findings from SUMMARY.md:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► RESEARCH COMPLETE ✓\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n**Stack additions:** [from SUMMARY.md]\r\n**Feature table stakes:** [from SUMMARY.md]\r\n**Watch Out For:** [from SUMMARY.md]\r\n```\r\n\r\n**If \"Skip research\":** Continue to Step 9.\r\n\r\n## 9. Define Requirements\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► DEFINING REQUIREMENTS\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n```\r\n\r\nRead PROJECT.md: core value, current milestone goals, validated requirements (what exists).\r\n\r\n**If research exists:** Read FEATURES.md, extract feature categories.\r\n\r\nPresent features by category:\r\n```\r\n## [Category 1]\r\n**Table stakes:** Feature A, Feature B\r\n**Differentiators:** Feature C, Feature D\r\n**Research notes:** [any relevant notes]\r\n```\r\n\r\n**If no research:** Gather requirements through conversation. Ask: \"What are the main things users need to do with [new features]?\" Clarify, probe for related capabilities, group into categories.\r\n\r\n**Scope each category** via AskUserQuestion (multiSelect: true, header max 12 chars):\r\n- \"[Feature 1]\" — [brief description]\r\n- \"[Feature 2]\" — [brief description]\r\n- \"None for this milestone\" — Defer entire category\r\n\r\nTrack: Selected → this milestone. Unselected table stakes → future. Unselected differentiators → out of scope.\r\n\r\n**Identify gaps** via AskUserQuestion:\r\n- \"No, research covered it\" — Proceed\r\n- \"Yes, let me add some\" — Capture additions\r\n\r\n**Generate REQUIREMENTS.md:**\r\n- v1 Requirements grouped by category (checkboxes, REQ-IDs)\r\n- Future Requirements (deferred)\r\n- Out of Scope (explicit exclusions with reasoning)\r\n- Traceability section (empty, filled by roadmap)\r\n\r\n**REQ-ID format:** `[CATEGORY]-[NUMBER]` (AUTH-01, NOTIF-02). Continue numbering from existing.\r\n\r\n**Requirement quality criteria:**\r\n\r\nGood requirements are:\r\n- **Specific and testable:** \"User can reset password via email link\" (not \"Handle password reset\")\r\n- **User-centric:** \"User can X\" (not \"System does Y\")\r\n- **Atomic:** One capability per requirement (not \"User can login and manage profile\")\r\n- **Independent:** Minimal dependencies on other requirements\r\n\r\nPresent FULL requirements list for confirmation:\r\n\r\n```\r\n## Milestone v[X.Y] Requirements\r\n\r\n### [Category 1]\r\n- [ ] **CAT1-01**: User can do X\r\n- [ ] **CAT1-02**: User can do Y\r\n\r\n### [Category 2]\r\n- [ ] **CAT2-01**: User can do Z\r\n\r\nDoes this capture what you're building? (yes / adjust)\r\n```\r\n\r\nIf \"adjust\": Return to scoping.\r\n\r\n**Commit requirements:**\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: define milestone v[X.Y] requirements\" --files .planning/REQUIREMENTS.md\r\n```\r\n\r\n## 10. Create Roadmap\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► CREATING ROADMAP\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning roadmapper...\r\n```\r\n\r\n**Starting phase number:** Read MILESTONES.md for last phase number. Continue from there (v1.0 ended at phase 5 → v1.1 starts at phase 6).\r\n\r\n```\r\nTask(prompt=\"\r\n<planning_context>\r\n<files_to_read>\r\n- .planning/PROJECT.md\r\n- .planning/REQUIREMENTS.md\r\n- .planning/research/SUMMARY.md (if exists)\r\n- .planning/config.json\r\n- .planning/MILESTONES.md\r\n</files_to_read>\r\n</planning_context>\r\n\r\n<instructions>\r\nCreate roadmap for milestone v[X.Y]:\r\n1. Start phase numbering from [N]\r\n2. Derive phases from THIS MILESTONE's requirements only\r\n3. Map every requirement to exactly one phase\r\n4. Derive 2-5 success criteria per phase (observable user behaviors)\r\n5. Validate 100% coverage\r\n6. Write files immediately (ROADMAP.md, STATE.md, update REQUIREMENTS.md traceability)\r\n7. Return ROADMAP CREATED with summary\r\n\r\nWrite files first, then return.\r\n</instructions>\r\n\", subagent_type=\"gsd-roadmapper\", model=\"{roadmapper_model}\", description=\"Create roadmap\")\r\n```\r\n\r\n**Handle return:**\r\n\r\n**If `## ROADMAP BLOCKED`:** Present blocker, work with user, re-spawn.\r\n\r\n**If `## ROADMAP CREATED`:** Read ROADMAP.md, present inline:\r\n\r\n```\r\n## Proposed Roadmap\r\n\r\n**[N] phases** | **[X] requirements mapped** | All covered ✓\r\n\r\n| # | Phase | Goal | Requirements | Success Criteria |\r\n|---|-------|------|--------------|------------------|\r\n| [N] | [Name] | [Goal] | [REQ-IDs] | [count] |\r\n\r\n### Phase Details\r\n\r\n**Phase [N]: [Name]**\r\nGoal: [goal]\r\nRequirements: [REQ-IDs]\r\nSuccess criteria:\r\n1. [criterion]\r\n2. [criterion]\r\n```\r\n\r\n**Ask for approval** via AskUserQuestion:\r\n- \"Approve\" — Commit and continue\r\n- \"Adjust phases\" — Tell me what to change\r\n- \"Review full file\" — Show raw ROADMAP.md\r\n\r\n**If \"Adjust\":** Get notes, re-spawn roadmapper with revision context, loop until approved.\r\n**If \"Review\":** Display raw ROADMAP.md, re-ask.\r\n\r\n**Commit roadmap** (after approval):\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: create milestone v[X.Y] roadmap ([N] phases)\" --files .planning/ROADMAP.md .planning/STATE.md .planning/REQUIREMENTS.md\r\n```\r\n\r\n## 11. Done\r\n\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► MILESTONE INITIALIZED ✓\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n**Milestone v[X.Y]: [Name]**\r\n\r\n| Artifact       | Location                    |\r\n|----------------|-----------------------------|\r\n| Project        | `.planning/PROJECT.md`      |\r\n| Research       | `.planning/research/`       |\r\n| Requirements   | `.planning/REQUIREMENTS.md` |\r\n| Roadmap        | `.planning/ROADMAP.md`      |\r\n\r\n**[N] phases** | **[X] requirements** | Ready to build ✓\r\n\r\n## ▶ Next Up\r\n\r\n**Phase [N]: [Phase Name]** — [Goal]\r\n\r\n`/gsd:discuss-phase [N]` — gather context and clarify approach\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\nAlso: `/gsd:plan-phase [N]` — skip discussion, plan directly\r\n```\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] PROJECT.md updated with Current Milestone section\r\n- [ ] STATE.md reset for new milestone\r\n- [ ] MILESTONE-CONTEXT.md consumed and deleted (if existed)\r\n- [ ] Research completed (if selected) — 4 parallel agents, milestone-aware\r\n- [ ] Requirements gathered and scoped per category\r\n- [ ] REQUIREMENTS.md created with REQ-IDs\r\n- [ ] gsd-roadmapper spawned with phase numbering context\r\n- [ ] Roadmap files written immediately (not draft)\r\n- [ ] User feedback incorporated (if any)\r\n- [ ] ROADMAP.md phases continue from previous milestone\r\n- [ ] All commits made (if planning docs committed)\r\n- [ ] User knows next step: `/gsd:discuss-phase [N]`\r\n\r\n**Atomic commits:** Each phase commits its artifacts immediately.\r\n</success_criteria>\r\n"
