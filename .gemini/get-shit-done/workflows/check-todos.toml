prompt = "<purpose>\r\nList all pending todos, allow selection, load full context for the selected todo, and route to appropriate action.\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"init_context\">\r\nLoad todo context:\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init todos)\r\n```\r\n\r\nExtract from init JSON: `todo_count`, `todos`, `pending_dir`.\r\n\r\nIf `todo_count` is 0:\r\n```\r\nNo pending todos.\r\n\r\nTodos are captured during work sessions with /gsd:add-todo.\r\n\r\n---\r\n\r\nWould you like to:\r\n\r\n1. Continue with current phase (/gsd:progress)\r\n2. Add a todo now (/gsd:add-todo)\r\n```\r\n\r\nExit.\r\n</step>\r\n\r\n<step name=\"parse_filter\">\r\nCheck for area filter in arguments:\r\n- `/gsd:check-todos` → show all\r\n- `/gsd:check-todos api` → filter to area:api only\r\n</step>\r\n\r\n<step name=\"list_todos\">\r\nUse the `todos` array from init context (already filtered by area if specified).\r\n\r\nParse and display as numbered list:\r\n\r\n```\r\nPending Todos:\r\n\r\n1. Add auth token refresh (api, 2d ago)\r\n2. Fix modal z-index issue (ui, 1d ago)\r\n3. Refactor database connection pool (database, 5h ago)\r\n\r\n---\r\n\r\nReply with a number to view details, or:\r\n- `/gsd:check-todos [area]` to filter by area\r\n- `q` to exit\r\n```\r\n\r\nFormat age as relative time from created timestamp.\r\n</step>\r\n\r\n<step name=\"handle_selection\">\r\nWait for user to reply with a number.\r\n\r\nIf valid: load selected todo, proceed.\r\nIf invalid: \"Invalid selection. Reply with a number (1-[N]) or `q` to exit.\"\r\n</step>\r\n\r\n<step name=\"load_context\">\r\nRead the todo file completely. Display:\r\n\r\n```\r\n## [title]\r\n\r\n**Area:** [area]\r\n**Created:** [date] ([relative time] ago)\r\n**Files:** [list or \"None\"]\r\n\r\n### Problem\r\n[problem section content]\r\n\r\n### Solution\r\n[solution section content]\r\n```\r\n\r\nIf `files` field has entries, read and briefly summarize each.\r\n</step>\r\n\r\n<step name=\"check_roadmap\">\r\nCheck for roadmap (can use init progress or directly check file existence):\r\n\r\nIf `.planning/ROADMAP.md` exists:\r\n1. Check if todo's area matches an upcoming phase\r\n2. Check if todo's files overlap with a phase's scope\r\n3. Note any match for action options\r\n</step>\r\n\r\n<step name=\"offer_actions\">\r\n**If todo maps to a roadmap phase:**\r\n\r\nUse AskUserQuestion:\r\n- header: \"Action\"\r\n- question: \"This todo relates to Phase [N]: [name]. What would you like to do?\"\r\n- options:\r\n  - \"Work on it now\" — move to done, start working\r\n  - \"Add to phase plan\" — include when planning Phase [N]\r\n  - \"Brainstorm approach\" — think through before deciding\r\n  - \"Put it back\" — return to list\r\n\r\n**If no roadmap match:**\r\n\r\nUse AskUserQuestion:\r\n- header: \"Action\"\r\n- question: \"What would you like to do with this todo?\"\r\n- options:\r\n  - \"Work on it now\" — move to done, start working\r\n  - \"Create a phase\" — /gsd:add-phase with this scope\r\n  - \"Brainstorm approach\" — think through before deciding\r\n  - \"Put it back\" — return to list\r\n</step>\r\n\r\n<step name=\"execute_action\">\r\n**Work on it now:**\r\n```bash\r\nmv \".planning/todos/pending/[filename]\" \".planning/todos/done/\"\r\n```\r\nUpdate STATE.md todo count. Present problem/solution context. Begin work or ask how to proceed.\r\n\r\n**Add to phase plan:**\r\nNote todo reference in phase planning notes. Keep in pending. Return to list or exit.\r\n\r\n**Create a phase:**\r\nDisplay: `/gsd:add-phase [description from todo]`\r\nKeep in pending. User runs command in fresh context.\r\n\r\n**Brainstorm approach:**\r\nKeep in pending. Start discussion about problem and approaches.\r\n\r\n**Put it back:**\r\nReturn to list_todos step.\r\n</step>\r\n\r\n<step name=\"update_state\">\r\nAfter any action that changes todo count:\r\n\r\nRe-run `init todos` to get updated count, then update STATE.md \"### Pending Todos\" section if exists.\r\n</step>\r\n\r\n<step name=\"git_commit\">\r\nIf todo was moved to done/, commit the change:\r\n\r\n```bash\r\ngit rm --cached .planning/todos/pending/[filename] 2>/dev/null || true\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs: start work on todo - [title]\" --files .planning/todos/done/[filename] .planning/STATE.md\r\n```\r\n\r\nTool respects `commit_docs` config and gitignore automatically.\r\n\r\nConfirm: \"Committed: docs: start work on todo - [title]\"\r\n</step>\r\n\r\n</process>\r\n\r\n<success_criteria>\r\n- [ ] All pending todos listed with title, area, age\r\n- [ ] Area filter applied if specified\r\n- [ ] Selected todo's full context loaded\r\n- [ ] Roadmap context checked for phase match\r\n- [ ] Appropriate actions offered\r\n- [ ] Selected action executed\r\n- [ ] STATE.md updated if todo count changed\r\n- [ ] Changes committed to git (if todo moved to done/)\r\n</success_criteria>\r\n"
