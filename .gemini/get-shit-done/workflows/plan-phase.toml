prompt = "<purpose>\r\nCreate executable phase prompts (PLAN.md files) for a roadmap phase with integrated research and verification. Default flow: Research (if needed) -> Plan -> Verify -> Done. Orchestrates gsd-phase-researcher, gsd-planner, and gsd-plan-checker agents with a revision loop (max 3 iterations).\r\n</purpose>\r\n\r\n<required_reading>\r\nRead all files referenced by the invoking prompt's execution_context before starting.\r\n\r\n@./.gemini/get-shit-done/references/ui-brand.md\r\n</required_reading>\r\n\r\n<process>\r\n\r\n## 1. Initialize\r\n\r\nLoad all context in one call (paths only to minimize orchestrator context):\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init plan-phase \"$PHASE\")\r\n```\r\n\r\nParse JSON for: `researcher_model`, `planner_model`, `checker_model`, `research_enabled`, `plan_checker_enabled`, `commit_docs`, `phase_found`, `phase_dir`, `phase_number`, `phase_name`, `phase_slug`, `padded_phase`, `has_research`, `has_context`, `has_plans`, `plan_count`, `planning_exists`, `roadmap_exists`.\r\n\r\n**File paths (for <files_to_read> blocks):** `state_path`, `roadmap_path`, `requirements_path`, `context_path`, `research_path`, `verification_path`, `uat_path`. These are null if files don't exist.\r\n\r\n**If `planning_exists` is false:** Error — run `/gsd:new-project` first.\r\n\r\n## 2. Parse and Normalize Arguments\r\n\r\nExtract from $ARGUMENTS: phase number (integer or decimal like `2.1`), flags (`--research`, `--skip-research`, `--gaps`, `--skip-verify`).\r\n\r\n**If no phase number:** Detect next unplanned phase from roadmap.\r\n\r\n**If `phase_found` is false:** Validate phase exists in ROADMAP.md. If valid, create the directory using `phase_slug` and `padded_phase` from init:\r\n```bash\r\nmkdir -p \".planning/phases/${padded_phase}-${phase_slug}\"\r\n```\r\n\r\n**Existing artifacts from init:** `has_research`, `has_plans`, `plan_count`.\r\n\r\n## 3. Validate Phase\r\n\r\n```bash\r\nPHASE_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${PHASE}\")\r\n```\r\n\r\n**If `found` is false:** Error with available phases. **If `found` is true:** Extract `phase_number`, `phase_name`, `goal` from JSON.\r\n\r\n## 4. Load CONTEXT.md\r\n\r\nCheck `context_path` from init JSON.\r\n\r\nIf `context_path` is not null, display: `Using phase context from: ${context_path}`\r\n\r\n**If `context_path` is null (no CONTEXT.md exists):**\r\n\r\nUse AskUserQuestion:\r\n- header: \"No context\"\r\n- question: \"No CONTEXT.md found for Phase {X}. Plans will use research and requirements only — your design preferences won't be included. Continue or capture context first?\"\r\n- options:\r\n  - \"Continue without context\" — Plan using research + requirements only\r\n  - \"Run discuss-phase first\" — Capture design decisions before planning\r\n\r\nIf \"Continue without context\": Proceed to step 5.\r\nIf \"Run discuss-phase first\": Display `/gsd:discuss-phase {X}` and exit workflow.\r\n\r\n## 5. Handle Research\r\n\r\n**Skip if:** `--gaps` flag, `--skip-research` flag, or `research_enabled` is false (from init) without `--research` override.\r\n\r\n**If `has_research` is true (from init) AND no `--research` flag:** Use existing, skip to step 6.\r\n\r\n**If RESEARCH.md missing OR `--research` flag:**\r\n\r\nDisplay banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► RESEARCHING PHASE {X}\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning researcher...\r\n```\r\n\r\n### Spawn gsd-phase-researcher\r\n\r\n```bash\r\nPHASE_DESC=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${PHASE}\" | jq -r '.section')\r\nPHASE_REQ_IDS=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${PHASE}\" | jq -r '.section // empty' | grep -i \"Requirements:\" | head -1 | sed 's/.*Requirements:\\*\\*\\s*//' | sed 's/[\\[\\]]//g' | tr ',' '\\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | tr '\\n' ',' | sed 's/,$//')\r\n```\r\n\r\nResearch prompt:\r\n\r\n```markdown\r\n<objective>\r\nResearch how to implement Phase {phase_number}: {phase_name}\r\nAnswer: \"What do I need to know to PLAN this phase well?\"\r\n</objective>\r\n\r\n<files_to_read>\r\n- {context_path} (USER DECISIONS from /gsd:discuss-phase)\r\n- {requirements_path} (Project requirements)\r\n- {state_path} (Project decisions and history)\r\n</files_to_read>\r\n\r\n<additional_context>\r\n**Phase description:** {phase_description}\r\n**Phase requirement IDs (MUST address):** {phase_req_ids}\r\n\r\n**Project instructions:** Read ./CLAUDE.md if exists — follow project-specific guidelines\r\n**Project skills:** Check .agents/skills/ directory (if exists) — read SKILL.md files, research should account for project skill patterns\r\n</additional_context>\r\n\r\n<output>\r\nWrite to: {phase_dir}/{phase_num}-RESEARCH.md\r\n</output>\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=\"First, read ./.gemini/agents/gsd-phase-researcher.md for your role and instructions.\\n\\n\" + research_prompt,\r\n  subagent_type=\"general-purpose\",\r\n  model=\"{researcher_model}\",\r\n  description=\"Research Phase {phase}\"\r\n)\r\n```\r\n\r\n### Handle Researcher Return\r\n\r\n- **`## RESEARCH COMPLETE`:** Display confirmation, continue to step 6\r\n- **`## RESEARCH BLOCKED`:** Display blocker, offer: 1) Provide context, 2) Skip research, 3) Abort\r\n\r\n## 6. Check Existing Plans\r\n\r\n```bash\r\nls \"${PHASE_DIR}\"/*-PLAN.md 2>/dev/null\r\n```\r\n\r\n**If exists:** Offer: 1) Add more plans, 2) View existing, 3) Replan from scratch.\r\n\r\n## 7. Use Context Paths from INIT\r\n\r\nExtract from INIT JSON:\r\n\r\n```bash\r\nSTATE_PATH=$(echo \"$INIT\" | jq -r '.state_path // empty')\r\nROADMAP_PATH=$(echo \"$INIT\" | jq -r '.roadmap_path // empty')\r\nREQUIREMENTS_PATH=$(echo \"$INIT\" | jq -r '.requirements_path // empty')\r\nRESEARCH_PATH=$(echo \"$INIT\" | jq -r '.research_path // empty')\r\nVERIFICATION_PATH=$(echo \"$INIT\" | jq -r '.verification_path // empty')\r\nUAT_PATH=$(echo \"$INIT\" | jq -r '.uat_path // empty')\r\nCONTEXT_PATH=$(echo \"$INIT\" | jq -r '.context_path // empty')\r\n```\r\n\r\n## 8. Spawn gsd-planner Agent\r\n\r\nDisplay banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► PLANNING PHASE {X}\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning planner...\r\n```\r\n\r\nPlanner prompt:\r\n\r\n```markdown\r\n<planning_context>\r\n**Phase:** {phase_number}\r\n**Mode:** {standard | gap_closure}\r\n\r\n<files_to_read>\r\n- {state_path} (Project State)\r\n- {roadmap_path} (Roadmap)\r\n- {requirements_path} (Requirements)\r\n- {context_path} (USER DECISIONS from /gsd:discuss-phase)\r\n- {research_path} (Technical Research)\r\n- {verification_path} (Verification Gaps - if --gaps)\r\n- {uat_path} (UAT Gaps - if --gaps)\r\n</files_to_read>\r\n\r\n**Phase requirement IDs (every ID MUST appear in a plan's `requirements` field):** {phase_req_ids}\r\n\r\n**Project instructions:** Read ./CLAUDE.md if exists — follow project-specific guidelines\r\n**Project skills:** Check .agents/skills/ directory (if exists) — read SKILL.md files, plans should account for project skill rules\r\n</planning_context>\r\n\r\n<downstream_consumer>\r\nOutput consumed by /gsd:execute-phase. Plans need:\r\n- Frontmatter (wave, depends_on, files_modified, autonomous)\r\n- Tasks in XML format\r\n- Verification criteria\r\n- must_haves for goal-backward verification\r\n</downstream_consumer>\r\n\r\n<quality_gate>\r\n- [ ] PLAN.md files created in phase directory\r\n- [ ] Each plan has valid frontmatter\r\n- [ ] Tasks are specific and actionable\r\n- [ ] Dependencies correctly identified\r\n- [ ] Waves assigned for parallel execution\r\n- [ ] must_haves derived from phase goal\r\n</quality_gate>\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=\"First, read ./.gemini/agents/gsd-planner.md for your role and instructions.\\n\\n\" + filled_prompt,\r\n  subagent_type=\"general-purpose\",\r\n  model=\"{planner_model}\",\r\n  description=\"Plan Phase {phase}\"\r\n)\r\n```\r\n\r\n## 9. Handle Planner Return\r\n\r\n- **`## PLANNING COMPLETE`:** Display plan count. If `--skip-verify` or `plan_checker_enabled` is false (from init): skip to step 13. Otherwise: step 10.\r\n- **`## CHECKPOINT REACHED`:** Present to user, get response, spawn continuation (step 12)\r\n- **`## PLANNING INCONCLUSIVE`:** Show attempts, offer: Add context / Retry / Manual\r\n\r\n## 10. Spawn gsd-plan-checker Agent\r\n\r\nDisplay banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► VERIFYING PLANS\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n◆ Spawning plan checker...\r\n```\r\n\r\nChecker prompt:\r\n\r\n```markdown\r\n<verification_context>\r\n**Phase:** {phase_number}\r\n**Phase Goal:** {goal from ROADMAP}\r\n\r\n<files_to_read>\r\n- {PHASE_DIR}/*-PLAN.md (Plans to verify)\r\n- {roadmap_path} (Roadmap)\r\n- {requirements_path} (Requirements)\r\n- {context_path} (USER DECISIONS from /gsd:discuss-phase)\r\n</files_to_read>\r\n\r\n**Phase requirement IDs (MUST ALL be covered):** {phase_req_ids}\r\n\r\n**Project instructions:** Read ./CLAUDE.md if exists — verify plans honor project guidelines\r\n**Project skills:** Check .agents/skills/ directory (if exists) — verify plans account for project skill rules\r\n</verification_context>\r\n\r\n<expected_output>\r\n- ## VERIFICATION PASSED — all checks pass\r\n- ## ISSUES FOUND — structured issue list\r\n</expected_output>\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=checker_prompt,\r\n  subagent_type=\"gsd-plan-checker\",\r\n  model=\"{checker_model}\",\r\n  description=\"Verify Phase {phase} plans\"\r\n)\r\n```\r\n\r\n## 11. Handle Checker Return\r\n\r\n- **`## VERIFICATION PASSED`:** Display confirmation, proceed to step 13.\r\n- **`## ISSUES FOUND`:** Display issues, check iteration count, proceed to step 12.\r\n\r\n## 12. Revision Loop (Max 3 Iterations)\r\n\r\nTrack `iteration_count` (starts at 1 after initial plan + check).\r\n\r\n**If iteration_count < 3:**\r\n\r\nDisplay: `Sending back to planner for revision... (iteration {N}/3)`\r\n\r\nRevision prompt:\r\n\r\n```markdown\r\n<revision_context>\r\n**Phase:** {phase_number}\r\n**Mode:** revision\r\n\r\n<files_to_read>\r\n- {PHASE_DIR}/*-PLAN.md (Existing plans)\r\n- {context_path} (USER DECISIONS from /gsd:discuss-phase)\r\n</files_to_read>\r\n\r\n**Checker issues:** {structured_issues_from_checker}\r\n</revision_context>\r\n\r\n<instructions>\r\nMake targeted updates to address checker issues.\r\nDo NOT replan from scratch unless issues are fundamental.\r\nReturn what changed.\r\n</instructions>\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=\"First, read ./.gemini/agents/gsd-planner.md for your role and instructions.\\n\\n\" + revision_prompt,\r\n  subagent_type=\"general-purpose\",\r\n  model=\"{planner_model}\",\r\n  description=\"Revise Phase {phase} plans\"\r\n)\r\n```\r\n\r\nAfter planner returns -> spawn checker again (step 10), increment iteration_count.\r\n\r\n**If iteration_count >= 3:**\r\n\r\nDisplay: `Max iterations reached. {N} issues remain:` + issue list\r\n\r\nOffer: 1) Force proceed, 2) Provide guidance and retry, 3) Abandon\r\n\r\n## 13. Present Final Status\r\n\r\nRoute to `<offer_next>` OR `auto_advance` depending on flags/config.\r\n\r\n## 14. Auto-Advance Check\r\n\r\nCheck for auto-advance trigger:\r\n\r\n1. Parse `--auto` flag from $ARGUMENTS\r\n2. Read `workflow.auto_advance` from config:\r\n   ```bash\r\n   AUTO_CFG=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs config-get workflow.auto_advance 2>/dev/null || echo \"false\")\r\n   ```\r\n\r\n**If `--auto` flag present OR `AUTO_CFG` is true:**\r\n\r\nDisplay banner:\r\n```\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► AUTO-ADVANCING TO EXECUTE\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\nPlans ready. Spawning execute-phase...\r\n```\r\n\r\nSpawn execute-phase as Task:\r\n```\r\nTask(\r\n  prompt=\"Run /gsd:execute-phase ${PHASE} --auto\",\r\n  subagent_type=\"general-purpose\",\r\n  description=\"Execute Phase ${PHASE}\"\r\n)\r\n```\r\n\r\n**Handle execute-phase return:**\r\n- **PHASE COMPLETE** → Display final summary:\r\n  ```\r\n  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n   GSD ► PHASE ${PHASE} COMPLETE ✓\r\n  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n  Auto-advance pipeline finished.\r\n\r\n  Next: /gsd:discuss-phase ${NEXT_PHASE} --auto\r\n  ```\r\n- **GAPS FOUND / VERIFICATION FAILED** → Display result, stop chain:\r\n  ```\r\n  Auto-advance stopped: Execution needs review.\r\n\r\n  Review the output above and continue manually:\r\n  /gsd:execute-phase ${PHASE}\r\n  ```\r\n\r\n**If neither `--auto` nor config enabled:**\r\nRoute to `<offer_next>` (existing behavior).\r\n\r\n</process>\r\n\r\n<offer_next>\r\nOutput this markdown directly (not as a code block):\r\n\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n GSD ► PHASE {X} PLANNED ✓\r\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\r\n\r\n**Phase {X}: {Name}** — {N} plan(s) in {M} wave(s)\r\n\r\n| Wave | Plans | What it builds |\r\n|------|-------|----------------|\r\n| 1    | 01, 02 | [objectives] |\r\n| 2    | 03     | [objective]  |\r\n\r\nResearch: {Completed | Used existing | Skipped}\r\nVerification: {Passed | Passed with override | Skipped}\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n## ▶ Next Up\r\n\r\n**Execute Phase {X}** — run all {N} plans\r\n\r\n/gsd:execute-phase {X}\r\n\r\n*(/clear first → fresh context window)*\r\n\r\n───────────────────────────────────────────────────────────────\r\n\r\n**Also available:**\r\n- cat .planning/phases/{phase-dir}/*-PLAN.md — review plans\r\n- /gsd:plan-phase {X} --research — re-research first\r\n\r\n───────────────────────────────────────────────────────────────\r\n</offer_next>\r\n\r\n<success_criteria>\r\n- [ ] .planning/ directory validated\r\n- [ ] Phase validated against roadmap\r\n- [ ] Phase directory created if needed\r\n- [ ] CONTEXT.md loaded early (step 4) and passed to ALL agents\r\n- [ ] Research completed (unless --skip-research or --gaps or exists)\r\n- [ ] gsd-phase-researcher spawned with CONTEXT.md\r\n- [ ] Existing plans checked\r\n- [ ] gsd-planner spawned with CONTEXT.md + RESEARCH.md\r\n- [ ] Plans created (PLANNING COMPLETE or CHECKPOINT handled)\r\n- [ ] gsd-plan-checker spawned with CONTEXT.md\r\n- [ ] Verification passed OR user override OR max iterations with user decision\r\n- [ ] User sees status between agent spawns\r\n- [ ] User knows next steps\r\n</success_criteria>\r\n"
