prompt = "# Git Planning Commit\r\n\r\nCommit planning artifacts using the gsd-tools CLI, which automatically checks `commit_docs` config and gitignore status.\r\n\r\n## Commit via CLI\r\n\r\nAlways use `gsd-tools.cjs commit` for `.planning/` files — it handles `commit_docs` and gitignore checks automatically:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs({scope}): {description}\" --files .planning/STATE.md .planning/ROADMAP.md\r\n```\r\n\r\nThe CLI will return `skipped` (with reason) if `commit_docs` is `false` or `.planning/` is gitignored. No manual conditional checks needed.\r\n\r\n## Amend previous commit\r\n\r\nTo fold `.planning/` file changes into the previous commit:\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"\" --files .planning/codebase/*.md --amend\r\n```\r\n\r\n## Commit Message Patterns\r\n\r\n| Command | Scope | Example |\r\n|---------|-------|---------|\r\n| plan-phase | phase | `docs(phase-03): create authentication plans` |\r\n| execute-phase | phase | `docs(phase-03): complete authentication phase` |\r\n| new-milestone | milestone | `docs: start milestone v1.1` |\r\n| remove-phase | chore | `chore: remove phase 17 (dashboard)` |\r\n| insert-phase | phase | `docs: insert phase 16.1 (critical fix)` |\r\n| add-phase | phase | `docs: add phase 07 (settings page)` |\r\n\r\n## When to Skip\r\n\r\n- `commit_docs: false` in config\r\n- `.planning/` is gitignored\r\n- No changes to commit (check with `git status --porcelain .planning/`)\r\n"
