prompt = "# Decimal Phase Calculation\r\n\r\nCalculate the next decimal phase number for urgent insertions.\r\n\r\n## Using gsd-tools\r\n\r\n```bash\r\n# Get next decimal phase after phase 6\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs phase next-decimal 6\r\n```\r\n\r\nOutput:\r\n```json\r\n{\r\n  \"found\": true,\r\n  \"base_phase\": \"06\",\r\n  \"next\": \"06.1\",\r\n  \"existing\": []\r\n}\r\n```\r\n\r\nWith existing decimals:\r\n```json\r\n{\r\n  \"found\": true,\r\n  \"base_phase\": \"06\",\r\n  \"next\": \"06.3\",\r\n  \"existing\": [\"06.1\", \"06.2\"]\r\n}\r\n```\r\n\r\n## Extract Values\r\n\r\n```bash\r\nDECIMAL_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs phase next-decimal \"${AFTER_PHASE}\")\r\nDECIMAL_PHASE=$(echo \"$DECIMAL_INFO\" | jq -r '.next')\r\nBASE_PHASE=$(echo \"$DECIMAL_INFO\" | jq -r '.base_phase')\r\n```\r\n\r\nOr with --raw flag:\r\n```bash\r\nDECIMAL_PHASE=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs phase next-decimal \"${AFTER_PHASE}\" --raw)\r\n# Returns just: 06.1\r\n```\r\n\r\n## Examples\r\n\r\n| Existing Phases | Next Phase |\r\n|-----------------|------------|\r\n| 06 only | 06.1 |\r\n| 06, 06.1 | 06.2 |\r\n| 06, 06.1, 06.2 | 06.3 |\r\n| 06, 06.1, 06.3 (gap) | 06.4 |\r\n\r\n## Directory Naming\r\n\r\nDecimal phase directories use the full decimal number:\r\n\r\n```bash\r\nSLUG=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs generate-slug \"$DESCRIPTION\" --raw)\r\nPHASE_DIR=\".planning/phases/${DECIMAL_PHASE}-${SLUG}\"\r\nmkdir -p \"$PHASE_DIR\"\r\n```\r\n\r\nExample: `.planning/phases/06.1-fix-critical-auth-bug/`\r\n"
