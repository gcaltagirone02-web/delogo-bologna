prompt = "<purpose>\r\nExecute all plans in a phase using wave-based parallel execution. Orchestrator stays lean — delegates plan execution to subagents.\r\n</purpose>\r\n\r\n<core_principle>\r\nOrchestrator coordinates, not executes. Each subagent loads the full execute-plan context. Orchestrator: discover plans → analyze deps → group waves → spawn agents → handle checkpoints → collect results.\r\n</core_principle>\r\n\r\n<required_reading>\r\nRead STATE.md before any operation to load project context.\r\n</required_reading>\r\n\r\n<process>\r\n\r\n<step name=\"initialize\" priority=\"first\">\r\nLoad all context in one call:\r\n\r\n```bash\r\nINIT=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs init execute-phase \"${PHASE_ARG}\")\r\n```\r\n\r\nParse JSON for: `executor_model`, `verifier_model`, `commit_docs`, `parallelization`, `branching_strategy`, `branch_name`, `phase_found`, `phase_dir`, `phase_number`, `phase_name`, `phase_slug`, `plans`, `incomplete_plans`, `plan_count`, `incomplete_count`, `state_exists`, `roadmap_exists`.\r\n\r\n**If `phase_found` is false:** Error — phase directory not found.\r\n**If `plan_count` is 0:** Error — no plans found in phase.\r\n**If `state_exists` is false but `.planning/` exists:** Offer reconstruct or continue.\r\n\r\nWhen `parallelization` is false, plans within a wave execute sequentially.\r\n</step>\r\n\r\n<step name=\"handle_branching\">\r\nCheck `branching_strategy` from init:\r\n\r\n**\"none\":** Skip, continue on current branch.\r\n\r\n**\"phase\" or \"milestone\":** Use pre-computed `branch_name` from init:\r\n```bash\r\ngit checkout -b \"$BRANCH_NAME\" 2>/dev/null || git checkout \"$BRANCH_NAME\"\r\n```\r\n\r\nAll subsequent commits go to this branch. User handles merging.\r\n</step>\r\n\r\n<step name=\"validate_phase\">\r\nFrom init JSON: `phase_dir`, `plan_count`, `incomplete_count`.\r\n\r\nReport: \"Found {plan_count} plans in {phase_dir} ({incomplete_count} incomplete)\"\r\n</step>\r\n\r\n<step name=\"discover_and_group_plans\">\r\nLoad plan inventory with wave grouping in one call:\r\n\r\n```bash\r\nPLAN_INDEX=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs phase-plan-index \"${PHASE_NUMBER}\")\r\n```\r\n\r\nParse JSON for: `phase`, `plans[]` (each with `id`, `wave`, `autonomous`, `objective`, `files_modified`, `task_count`, `has_summary`), `waves` (map of wave number → plan IDs), `incomplete`, `has_checkpoints`.\r\n\r\n**Filtering:** Skip plans where `has_summary: true`. If `--gaps-only`: also skip non-gap_closure plans. If all filtered: \"No matching incomplete plans\" → exit.\r\n\r\nReport:\r\n```\r\n## Execution Plan\r\n\r\n**Phase {X}: {Name}** — {total_plans} plans across {wave_count} waves\r\n\r\n| Wave | Plans | What it builds |\r\n|------|-------|----------------|\r\n| 1 | 01-01, 01-02 | {from plan objectives, 3-8 words} |\r\n| 2 | 01-03 | ... |\r\n```\r\n</step>\r\n\r\n<step name=\"execute_waves\">\r\nExecute each wave in sequence. Within a wave: parallel if `PARALLELIZATION=true`, sequential if `false`.\r\n\r\n**For each wave:**\r\n\r\n1. **Describe what's being built (BEFORE spawning):**\r\n\r\n   Read each plan's `<objective>`. Extract what's being built and why.\r\n\r\n   ```\r\n   ---\r\n   ## Wave {N}\r\n\r\n   **{Plan ID}: {Plan Name}**\r\n   {2-3 sentences: what this builds, technical approach, why it matters}\r\n\r\n   Spawning {count} agent(s)...\r\n   ---\r\n   ```\r\n\r\n   - Bad: \"Executing terrain generation plan\"\r\n   - Good: \"Procedural terrain generator using Perlin noise — creates height maps, biome zones, and collision meshes. Required before vehicle physics can interact with ground.\"\r\n\r\n2. **Spawn executor agents:**\r\n\r\n   Pass paths only — executors read files themselves with their fresh 200k context.\r\n   This keeps orchestrator context lean (~10-15%).\r\n\r\n   ```\r\n   Task(\r\n     subagent_type=\"gsd-executor\",\r\n     model=\"{executor_model}\",\r\n     prompt=\"\r\n       <objective>\r\n       Execute plan {plan_number} of phase {phase_number}-{phase_name}.\r\n       Commit each task atomically. Create SUMMARY.md. Update STATE.md and ROADMAP.md.\r\n       </objective>\r\n\r\n       <execution_context>\r\n       @./.gemini/get-shit-done/workflows/execute-plan.md\r\n       @./.gemini/get-shit-done/templates/summary.md\r\n       @./.gemini/get-shit-done/references/checkpoints.md\r\n       @./.gemini/get-shit-done/references/tdd.md\r\n       </execution_context>\r\n\r\n       <files_to_read>\r\n       Read these files at execution start using the Read tool:\r\n       - {phase_dir}/{plan_file} (Plan)\r\n       - .planning/STATE.md (State)\r\n       - .planning/config.json (Config, if exists)\r\n       - ./CLAUDE.md (Project instructions, if exists — follow project-specific guidelines and coding conventions)\r\n       - .agents/skills/ (Project skills, if exists — list skills, read SKILL.md for each, follow relevant rules during implementation)\r\n       </files_to_read>\r\n\r\n       <success_criteria>\r\n       - [ ] All tasks executed\r\n       - [ ] Each task committed individually\r\n       - [ ] SUMMARY.md created in plan directory\r\n       - [ ] STATE.md updated with position and decisions\r\n       - [ ] ROADMAP.md updated with plan progress (via `roadmap update-plan-progress`)\r\n       </success_criteria>\r\n     \"\r\n   )\r\n   ```\r\n\r\n3. **Wait for all agents in wave to complete.**\r\n\r\n4. **Report completion — spot-check claims first:**\r\n\r\n   For each SUMMARY.md:\r\n   - Verify first 2 files from `key-files.created` exist on disk\r\n   - Check `git log --oneline --all --grep=\"{phase}-{plan}\"` returns ≥1 commit\r\n   - Check for `## Self-Check: FAILED` marker\r\n\r\n   If ANY spot-check fails: report which plan failed, route to failure handler — ask \"Retry plan?\" or \"Continue with remaining waves?\"\r\n\r\n   If pass:\r\n   ```\r\n   ---\r\n   ## Wave {N} Complete\r\n\r\n   **{Plan ID}: {Plan Name}**\r\n   {What was built — from SUMMARY.md}\r\n   {Notable deviations, if any}\r\n\r\n   {If more waves: what this enables for next wave}\r\n   ---\r\n   ```\r\n\r\n   - Bad: \"Wave 2 complete. Proceeding to Wave 3.\"\r\n   - Good: \"Terrain system complete — 3 biome types, height-based texturing, physics collision meshes. Vehicle physics (Wave 3) can now reference ground surfaces.\"\r\n\r\n5. **Handle failures:**\r\n\r\n   **Known Claude Code bug (classifyHandoffIfNeeded):** If an agent reports \"failed\" with error containing `classifyHandoffIfNeeded is not defined`, this is a Claude Code runtime bug — not a GSD or agent issue. The error fires in the completion handler AFTER all tool calls finish. In this case: run the same spot-checks as step 4 (SUMMARY.md exists, git commits present, no Self-Check: FAILED). If spot-checks PASS → treat as **successful**. If spot-checks FAIL → treat as real failure below.\r\n\r\n   For real failures: report which plan failed → ask \"Continue?\" or \"Stop?\" → if continue, dependent plans may also fail. If stop, partial completion report.\r\n\r\n6. **Execute checkpoint plans between waves** — see `<checkpoint_handling>`.\r\n\r\n7. **Proceed to next wave.**\r\n</step>\r\n\r\n<step name=\"checkpoint_handling\">\r\nPlans with `autonomous: false` require user interaction.\r\n\r\n**Auto-mode checkpoint handling:**\r\n\r\nRead auto-advance config:\r\n```bash\r\nAUTO_CFG=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs config-get workflow.auto_advance 2>/dev/null || echo \"false\")\r\n```\r\n\r\nWhen executor returns a checkpoint AND `AUTO_CFG` is `\"true\"`:\r\n- **human-verify** → Auto-spawn continuation agent with `{user_response}` = `\"approved\"`. Log `⚡ Auto-approved checkpoint`.\r\n- **decision** → Auto-spawn continuation agent with `{user_response}` = first option from checkpoint details. Log `⚡ Auto-selected: [option]`.\r\n- **human-action** → Present to user (existing behavior below). Auth gates cannot be automated.\r\n\r\n**Standard flow (not auto-mode, or human-action type):**\r\n\r\n1. Spawn agent for checkpoint plan\r\n2. Agent runs until checkpoint task or auth gate → returns structured state\r\n3. Agent return includes: completed tasks table, current task + blocker, checkpoint type/details, what's awaited\r\n4. **Present to user:**\r\n   ```\r\n   ## Checkpoint: [Type]\r\n\r\n   **Plan:** 03-03 Dashboard Layout\r\n   **Progress:** 2/3 tasks complete\r\n\r\n   [Checkpoint Details from agent return]\r\n   [Awaiting section from agent return]\r\n   ```\r\n5. User responds: \"approved\"/\"done\" | issue description | decision selection\r\n6. **Spawn continuation agent (NOT resume)** using continuation-prompt.md template:\r\n   - `{completed_tasks_table}`: From checkpoint return\r\n   - `{resume_task_number}` + `{resume_task_name}`: Current task\r\n   - `{user_response}`: What user provided\r\n   - `{resume_instructions}`: Based on checkpoint type\r\n7. Continuation agent verifies previous commits, continues from resume point\r\n8. Repeat until plan completes or user stops\r\n\r\n**Why fresh agent, not resume:** Resume relies on internal serialization that breaks with parallel tool calls. Fresh agents with explicit state are more reliable.\r\n\r\n**Checkpoints in parallel waves:** Agent pauses and returns while other parallel agents may complete. Present checkpoint, spawn continuation, wait for all before next wave.\r\n</step>\r\n\r\n<step name=\"aggregate_results\">\r\nAfter all waves:\r\n\r\n```markdown\r\n## Phase {X}: {Name} Execution Complete\r\n\r\n**Waves:** {N} | **Plans:** {M}/{total} complete\r\n\r\n| Wave | Plans | Status |\r\n|------|-------|--------|\r\n| 1 | plan-01, plan-02 | ✓ Complete |\r\n| CP | plan-03 | ✓ Verified |\r\n| 2 | plan-04 | ✓ Complete |\r\n\r\n### Plan Details\r\n1. **03-01**: [one-liner from SUMMARY.md]\r\n2. **03-02**: [one-liner from SUMMARY.md]\r\n\r\n### Issues Encountered\r\n[Aggregate from SUMMARYs, or \"None\"]\r\n```\r\n</step>\r\n\r\n<step name=\"close_parent_artifacts\">\r\n**For decimal/polish phases only (X.Y pattern):** Close the feedback loop by resolving parent UAT and debug artifacts.\r\n\r\n**Skip if** phase number has no decimal (e.g., `3`, `04`) — only applies to gap-closure phases like `4.1`, `03.1`.\r\n\r\n**1. Detect decimal phase and derive parent:**\r\n```bash\r\n# Check if phase_number contains a decimal\r\nif [[ \"$PHASE_NUMBER\" == *.* ]]; then\r\n  PARENT_PHASE=\"${PHASE_NUMBER%%.*}\"\r\nfi\r\n```\r\n\r\n**2. Find parent UAT file:**\r\n```bash\r\nPARENT_INFO=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs find-phase \"${PARENT_PHASE}\" --raw)\r\n# Extract directory from PARENT_INFO JSON, then find UAT file in that directory\r\n```\r\n\r\n**If no parent UAT found:** Skip this step (gap-closure may have been triggered by VERIFICATION.md instead).\r\n\r\n**3. Update UAT gap statuses:**\r\n\r\nRead the parent UAT file's `## Gaps` section. For each gap entry with `status: failed`:\r\n- Update to `status: resolved`\r\n\r\n**4. Update UAT frontmatter:**\r\n\r\nIf all gaps now have `status: resolved`:\r\n- Update frontmatter `status: diagnosed` → `status: resolved`\r\n- Update frontmatter `updated:` timestamp\r\n\r\n**5. Resolve referenced debug sessions:**\r\n\r\nFor each gap that has a `debug_session:` field:\r\n- Read the debug session file\r\n- Update frontmatter `status:` → `resolved`\r\n- Update frontmatter `updated:` timestamp\r\n- Move to resolved directory:\r\n```bash\r\nmkdir -p .planning/debug/resolved\r\nmv .planning/debug/{slug}.md .planning/debug/resolved/\r\n```\r\n\r\n**6. Commit updated artifacts:**\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs(phase-${PARENT_PHASE}): resolve UAT gaps and debug sessions after ${PHASE_NUMBER} gap closure\" --files .planning/phases/*${PARENT_PHASE}*/*-UAT.md .planning/debug/resolved/*.md\r\n```\r\n</step>\r\n\r\n<step name=\"verify_phase_goal\">\r\nVerify phase achieved its GOAL, not just completed tasks.\r\n\r\n```bash\r\nPHASE_REQ_IDS=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs roadmap get-phase \"${PHASE_NUMBER}\" | jq -r '.section' | grep -i \"Requirements:\" | sed 's/.*Requirements:\\*\\*\\s*//' | sed 's/[\\[\\]]//g')\r\n```\r\n\r\n```\r\nTask(\r\n  prompt=\"Verify phase {phase_number} goal achievement.\r\nPhase directory: {phase_dir}\r\nPhase goal: {goal from ROADMAP.md}\r\nPhase requirement IDs: {phase_req_ids}\r\nCheck must_haves against actual codebase.\r\nCross-reference requirement IDs from PLAN frontmatter against REQUIREMENTS.md — every ID MUST be accounted for.\r\nCreate VERIFICATION.md.\",\r\n  subagent_type=\"gsd-verifier\",\r\n  model=\"{verifier_model}\"\r\n)\r\n```\r\n\r\nRead status:\r\n```bash\r\ngrep \"^status:\" \"$PHASE_DIR\"/*-VERIFICATION.md | cut -d: -f2 | tr -d ' '\r\n```\r\n\r\n| Status | Action |\r\n|--------|--------|\r\n| `passed` | → update_roadmap |\r\n| `human_needed` | Present items for human testing, get approval or feedback |\r\n| `gaps_found` | Present gap summary, offer `/gsd:plan-phase {phase} --gaps` |\r\n\r\n**If human_needed:**\r\n```\r\n## ✓ Phase {X}: {Name} — Human Verification Required\r\n\r\nAll automated checks passed. {N} items need human testing:\r\n\r\n{From VERIFICATION.md human_verification section}\r\n\r\n\"approved\" → continue | Report issues → gap closure\r\n```\r\n\r\n**If gaps_found:**\r\n```\r\n## ⚠ Phase {X}: {Name} — Gaps Found\r\n\r\n**Score:** {N}/{M} must-haves verified\r\n**Report:** {phase_dir}/{phase_num}-VERIFICATION.md\r\n\r\n### What's Missing\r\n{Gap summaries from VERIFICATION.md}\r\n\r\n---\r\n## ▶ Next Up\r\n\r\n`/gsd:plan-phase {X} --gaps`\r\n\r\n*(`/clear` first → fresh context window)*\r\n\r\nAlso: `cat {phase_dir}/{phase_num}-VERIFICATION.md` — full report\r\nAlso: `/gsd:verify-work {X}` — manual testing first\r\n```\r\n\r\nGap closure cycle: `/gsd:plan-phase {X} --gaps` reads VERIFICATION.md → creates gap plans with `gap_closure: true` → user runs `/gsd:execute-phase {X} --gaps-only` → verifier re-runs.\r\n</step>\r\n\r\n<step name=\"update_roadmap\">\r\n**Mark phase complete and update all tracking files:**\r\n\r\n```bash\r\nCOMPLETION=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs phase complete \"${PHASE_NUMBER}\")\r\n```\r\n\r\nThe CLI handles:\r\n- Marking phase checkbox `[x]` with completion date\r\n- Updating Progress table (Status → Complete, date)\r\n- Updating plan count to final\r\n- Advancing STATE.md to next phase\r\n- Updating REQUIREMENTS.md traceability\r\n\r\nExtract from result: `next_phase`, `next_phase_name`, `is_last_phase`.\r\n\r\n```bash\r\nnode ./.gemini/get-shit-done/bin/gsd-tools.cjs commit \"docs(phase-{X}): complete phase execution\" --files .planning/ROADMAP.md .planning/STATE.md .planning/REQUIREMENTS.md {phase_dir}/*-VERIFICATION.md\r\n```\r\n</step>\r\n\r\n<step name=\"offer_next\">\r\n\r\n**Exception:** If `gaps_found`, the `verify_phase_goal` step already presents the gap-closure path (`/gsd:plan-phase {X} --gaps`). No additional routing needed — skip auto-advance.\r\n\r\n**Auto-advance detection:**\r\n\r\n1. Parse `--auto` flag from $ARGUMENTS\r\n2. Read `workflow.auto_advance` from config:\r\n   ```bash\r\n   AUTO_CFG=$(node ./.gemini/get-shit-done/bin/gsd-tools.cjs config-get workflow.auto_advance 2>/dev/null || echo \"false\")\r\n   ```\r\n\r\n**If `--auto` flag present OR `AUTO_CFG` is true (AND verification passed with no gaps):**\r\n\r\n```\r\n╔══════════════════════════════════════════╗\r\n║  AUTO-ADVANCING → TRANSITION             ║\r\n║  Phase {X} verified, continuing chain    ║\r\n╚══════════════════════════════════════════╝\r\n```\r\n\r\nExecute the transition workflow inline (do NOT use Task — orchestrator context is ~10-15%, transition needs phase completion data already in context):\r\n\r\nRead and follow `./.gemini/get-shit-done/workflows/transition.md`, passing through the `--auto` flag so it propagates to the next phase invocation.\r\n\r\n**If neither `--auto` nor `AUTO_CFG` is true:**\r\n\r\nThe workflow ends. The user runs `/gsd:progress` or invokes the transition workflow manually.\r\n</step>\r\n\r\n</process>\r\n\r\n<context_efficiency>\r\nOrchestrator: ~10-15% context. Subagents: fresh 200k each. No polling (Task blocks). No context bleed.\r\n</context_efficiency>\r\n\r\n<failure_handling>\r\n- **classifyHandoffIfNeeded false failure:** Agent reports \"failed\" but error is `classifyHandoffIfNeeded is not defined` → Claude Code bug, not GSD. Spot-check (SUMMARY exists, commits present) → if pass, treat as success\r\n- **Agent fails mid-plan:** Missing SUMMARY.md → report, ask user how to proceed\r\n- **Dependency chain breaks:** Wave 1 fails → Wave 2 dependents likely fail → user chooses attempt or skip\r\n- **All agents in wave fail:** Systemic issue → stop, report for investigation\r\n- **Checkpoint unresolvable:** \"Skip this plan?\" or \"Abort phase execution?\" → record partial progress in STATE.md\r\n</failure_handling>\r\n\r\n<resumption>\r\nRe-run `/gsd:execute-phase {phase}` → discover_plans finds completed SUMMARYs → skips them → resumes from first incomplete plan → continues wave execution.\r\n\r\nSTATE.md tracks: last completed plan, current wave, pending checkpoints.\r\n</resumption>\r\n"
